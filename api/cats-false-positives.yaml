# CATS false-positive rules.
#
# Rules are evaluated in file order; the FIRST match wins and its id is recorded
# on the test row. Only 'error' and 'warn' results are classified.
#
# Fields: result, response_code, fuzzer, path, contract_path, method, url, scenario,
#         result_reason, result_details, any_text (reason + details), response_body,
#         response_content_type, request_body, json_body.<dotted.path>,
#         request_header.<name>
# Operators: equals (bare scalar), in, not_equals, contains, contains_any,
#            contains_all, starts_with, starts_with_any, ends_with, matches, exists
# equals/in/not_equals are case-sensitive; the rest are case-insensitive.
version: 1
rules:
  - id: RATE_LIMIT_429
    why: Rate limiting is infrastructure protection, not API behavior under test.
    when: {response_code: 429}

  - id: CONNECTION_ERROR_999
    why: CATS reports 999 for transport/connection failures, not API defects.
    when: {response_code: 999}
  - id: PROBLEM_TITLE_KEYWORD_401
    why: "CATS's leak keyword [unauthorized] is the RFC 9457 title of the 401 problem body (components/responses/Unauthorized; ADR 0001 addendum); since RB3 (Task 8.2) the detail is the fixed text 'a bearer token is required', so the keyword is the only finding."
    when: {response_code: 401, fuzzer: BypassAuthentication, result_reason: "Error details leak", result_details: {contains: "[unauthorized]"}}
  - id: PROBLEM_TITLE_KEYWORD_403
    why: "CATS's leak keyword [forbidden] is the RFC 9457 title and the code of the 403 problem body (components/responses/Forbidden; ADR 0001 addendum), not an error detail; the rule is limited to the 403 causes the rules below document plus one of its own, so a 403 with a new detail stays visible. The own cause, 'cats-admin needs read on channel ...': the campaign's createChannel tests created channels named with the injection payloads under the refData ACL that names cats-agent only (refdata.yml acl[*]#identity, admin Test 3155), and administrators are subject to channel Read rows by design (internal/core/access/decide.go decideChannel; ADR 0011)."
    when:
      response_code: 403
      result_reason: "Error details leak"
      result_details: {contains: "[forbidden]"}
      json_body.detail: {contains_any: ["enrollment token is invalid", "is scoped; it registers only", "is a human; humans sign in", "needs admin on channel \"cats-acl\"", "cats-admin needs read on channel", "is not registered; register it first"]}
  - id: NOTICES_KEYWORD_200
    why: "CATS's leak keyword [notice] matches the documented notices member of the health and administrator status documents (docs/ops/health.md, ADR 0010)."
    when: {response_code: 200, result_reason: "Error details leak", result_details: {contains: "[notice]"}, path: {in: [/v1/health, /v1/admin/status]}}
  - id: HARNESS_REPLY_TO_REMOVED_201
    why: "The seed's refData removes reply_to from POST /v1/channels/{channel}/messages (cats_remove_field, scripts/cats-harness.sh), so the reply_to fuzzers send no reply_to at all and the 201 is the normal answer (round 1 raw report Test 1513; round 2 admin Tests 11563 to 11565)."
    when: {response_code: 201, path: "/v1/channels/{channel}/messages", scenario: {contains: "[reply_to]"}}
  - id: AGENT_LOST_ACL_ADMIN_403
    why: "The fuzzed PUT /v1/channels/{channel}/acl replaces cats-acl's ACL with bodies that omit cats-agent (EmptyJsonArrayBody [] answered 204 in the admin pass, Test 11228), and the seed re-creates decoys but does not restore an existing channel's ACL (scripts/cats-harness.sh seed comment: 'that leftover is a recorded rule, not a harness change'); an agent without an admin row gets the documented 403 (internal/core/access/decide.go decideChannel, ADR 0011)."
    when: {response_code: 403, path: "/v1/channels/{channel}/acl", json_body.code: forbidden, json_body.detail: {contains: "needs admin on channel \"cats-acl\""}}
  - id: DECOY_CONSUMED_404
    why: "Campaign design (plan ruling 13): the anchor path's decoy is consumed by the first successful DELETE or retire, and cats-sub is garbage-collected after the first unsubscribe (ADR 0009 decision 20); every later test on the anchor path is 404 by construction, and CATS's own hint text ('provide business context using --refData') marks these rows."
    when:
      response_code: 404
      result_reason: "Not found"
      path: {in: ["/v1/channels/{channel}", "/v1/memories/{id}", "/v1/sessions/{session}", "/v1/admin/scopes/{scope}/done", "/v1/channels/{channel}/subscription", /v1/tag-subscriptions]}
      result_details: {contains: "provide business context"}
  - id: CREATE_NAME_CONFLICT_409
    why: "CATS reuses one generated name across the tests of a create operation, so the first test creates and the rest get the documented 409 (components/responses/Conflict on createChannel, createScope and createAgentIdentity; an identity that exists in another scope is the same conflict)."
    when: {response_code: 409, path: {in: [/v1/channels, /v1/admin/scopes, /v1/admin/identities]}, json_body.code: conflict}
  - id: IF_REVISION_MISMATCH_409
    why: "CATS fills if_revision with a generated value; the edit fails with the documented 409 when the live revision differs (EditMemoryRequest.if_revision description in api/openapi.yaml; internal/core/memories/memories.go:118)."
    when: {response_code: 409, path: "/v1/memories/{id}/revisions", json_body.code: conflict, json_body.detail: {contains: "is at revision"}}
  - id: REGISTER_EXAMPLE_TOKEN_INVALID_403
    why: "Every register test sends the spec's example enrollment_token (abe_ZXhhbXBsZS1lbnJvbGxtZW50LXRvay1ub3QtcmVhbDE, 'example-enrollment-tok-not-real1'), which the server never issued; 403 is the documented refusal (operation register declares Forbidden; internal/core/identities/register.go:32)."
    when: {response_code: 403, path: /v1/auth/register, json_body.code: forbidden, json_body.detail: "enrollment token is invalid"}
  - id: REGISTER_TAKEN_IDENTITY_403
    why: "The identity names the register fuzzers reuse were created earlier in the same campaign by createAgentIdentity (scope cats-scope, the same payload strings) and createHumanIdentity (the generated email); the register description says a scoped identity registers only with the enrollment token bound to it and a human identity cannot register (403) (api/openapi.yaml operation register; internal/core/identities/register.go:102 and :121)."
    when: {response_code: 403, path: /v1/auth/register, json_body.code: forbidden, json_body.detail: {contains_any: ["is scoped; it registers only", "is a human; humans sign in"]}}
  - id: REGISTER_EXISTING_CREDENTIAL_409
    why: "The request names an identity that already holds a key (the campaign's own cats-admin or cats-agent; admin pass RemoveFields and EmptyStringsInFields on enrollment_token); the documented 409 (operation register declares Conflict; internal/core/identities/register.go:162)."
    when: {response_code: 409, path: /v1/auth/register, json_body.code: conflict, json_body.detail: {contains: "already has a credential"}}
  - id: EDIT_MEMORY_EMPTY_BODY_400
    why: "EditMemoryRequest declares minProperties 1 and no required member (SG3, commit ebddff5), so the fuzzers that strip every optional member (EmptyJsonBody, OnlyRequiredFields, RemoveFields) send {} and get the documented 400 validation."
    when: {response_code: 400, path: "/v1/memories/{id}/revisions", method: POST, json_body.code: validation, json_body.detail: {contains: "minProperties"}}
  - id: EXAMPLES_FIELDS_OBJECT_FOR_ARRAY_BODY_400
    why: "ExamplesFields sends the ACLEntry item example as the whole body of PUT /v1/channels/{channel}/acl, whose schema is an array (request body {identity, permissions}, admin pass); the validator's 400 'value must be an array' is the documented BadRequest."
    when: {response_code: 400, path: "/v1/channels/{channel}/acl", method: PUT, fuzzer: ExamplesFields, json_body.code: validation, json_body.detail: {contains: "value must be an array"}}
  - id: EMPTY_ACL_ARRAY_204
    why: "The ACL PUT body is an array with maxItems 256 and no minItems (api/openapi.yaml /v1/channels/{channel}/acl put); [] is a valid empty ACL and 204 is right."
    when: {response_code: 204, path: "/v1/channels/{channel}/acl", fuzzer: EmptyJsonArrayBody}
  - id: RANDOM_RESOURCES_EXISTING_TASK_200
    why: "RandomResources put a small integer in the task id (admin Test 5845 /v1/tasks/7/claim; agent Test 5170 /v1/tasks/1/release, the refData id) that names an existing task; claiming or releasing an existing task is the documented 200 (no task owner guard, CLAUDE.md Design; ADR 0011)."
    when: {response_code: 200, fuzzer: RandomResources, path: {in: ["/v1/tasks/{id}/claim", "/v1/tasks/{id}/release"]}}
  - id: CHECK_DELETED_COLLECTION_200
    why: "CheckDeletedResourcesNotAvailable re-GETs /v1/tag-subscriptions after a DELETE on it; the path is a collection (one DELETE removes one entry, api/openapi.yaml deleteTagSubscription), so the collection still answers 200. CATS files the re-GET under another path's bucket, so the rule matches the request URL."
    when: {response_code: 200, fuzzer: CheckDeletedResourcesNotAvailable, url: {ends_with: /v1/tag-subscriptions}}
  - id: OPEN_OPERATION
    why: "The 8 open operations declare security [] (api/openapi.yaml: GET /v1/health, /v1/discover, /v1/auth/jwks, the three /.well-known/*, POST /v1/auth/token and /v1/auth/register), so a request without a bearer is answered: 200, or the body's 400. CATS's BypassAuthentication expects 401 or 403."
    when: {response_code: {in: [200, 400]}, fuzzer: BypassAuthentication, path: {in: [/v1/health, /v1/discover, /v1/auth/jwks, /.well-known/agentmesh, /.well-known/oauth-authorization-server, /.well-known/openid-configuration, /v1/auth/token, /v1/auth/register]}}
  - id: TOKEN_ENDPOINT_OAUTH_400
    why: "POST /v1/auth/token answers every malformed request with the RFC 6749 section 5.2 body (spec section 8.1; tokenRequestError and rejectRepeatedTokenParams in internal/server/oauth.go), not problem+json; CATS cannot sign a client assertion, so its field fuzzers never reach 200."
    when: {response_code: 400, path: /v1/auth/token}
  - id: TOKEN_ENDPOINT_OAUTH_401
    why: "ExamplesFields sends the spec's example assertion, which names no registered key; 401 invalid_client is the RFC 6749 section 5.2 answer (spec section 8.1)."
    when: {response_code: 401, path: /v1/auth/token, fuzzer: ExamplesFields}
  - id: NET_HTTP_400_AFTER_BAD_CONTENT_LENGTH
    why: "net/http's connection-level '400 Bad Request' (text/plain, 15 bytes) on the request that follows an InvalidContentLengthHeaders test on the same connection; no handler ran (no text/plain writer exists in internal/server; the transport family of Open item 1)."
    when: {response_code: 400, response_content_type: {starts_with: text/plain}, result_reason: "Response content type not matching the contract"}
  - id: READ_TIMEOUT_954
    why: "CATS records its pseudo-code 954 when it times out reading the answer to an InvalidContentLengthHeaders request (the server waits for the declared body); a sibling of 999, not an HTTP status (plan ruling 35)."
    when: {response_code: 954, fuzzer: InvalidContentLengthHeaders}
  - id: UNKNOWN_METHOD_404
    why: "An undeclared method answers 404 not_found with detail 'method not allowed' by design (TestUndeclaredMethodsRefused, internal/server/routes_test.go:172; ADR 0002 audit; Open item 2 default); CATS expects 405."
    when: {response_code: 404, fuzzer: {in: [HttpMethods, NonRestHttpMethods, CustomHttpMethods]}, result_reason: {starts_with: "Unexpected response code"}}
  - id: ACCEPT_NOT_NEGOTIATED
    why: "The server does no Accept negotiation (no non-test file in internal/server reads the Accept header; Open item 2 default): under an unsupported or dummy Accept the operation answers as it would without the header, 2xx or the same 4xx. CATS expects 406."
    when: {response_code: {in: [200, 201, 204, 400, 403, 404, 409]}, fuzzer: {in: [UnsupportedAcceptHeaders, DummyAcceptHeaders]}}
  - id: CONTENT_TYPE_NOT_CHECKED
    why: "An unsupported Content-Type on an operation with a body is refused by the request validator as 400 validation (problem+json) and ignored on a bodiless operation, where the normal answer follows; the spec declares BadRequest, not 415 (ADR 0001 addendum, the 11 shared responses; Open item 2 default)."
    when: {response_code: {in: [200, 201, 204, 400, 403, 404, 409]}, fuzzer: {in: [UnsupportedContentTypesHeaders, DummyContentTypeHeaders]}}
  - id: DUPLICATE_HEADERS_2XX
    why: "net/http joins a repeated request header and the operation answers normally (2xx, or the 409 the same create gets anyway); CATS expects 4xx."
    when: {response_code: {in: [200, 201, 204, 409]}, fuzzer: DuplicateHeaders}
  - id: SECURITY_HEADERS_JSON_API
    why: "CATS's recommended browser headers (X-Frame-Options, Content-Security-Policy frame-ancestors, X-Content-Type-Options, Cache-Control no-store) are not part of the API contract; the server serves JSON to non-browser clients (plan ruling 34; a header middleware is Open item 7 for Eric, default the rule)."
    when: {response_code: {in: [200, 201, 204, 400, 403, 404, 409]}, fuzzer: CheckSecurityHeaders, result_reason: "Missing recommended security headers"}
  - id: NO_REQUEST_BODY_IGNORED
    why: "POST /v1/tasks/{id}/release, POST /v1/admin/reset, POST /v1/admin/identities/{identity}/reset-credential and POST /v1/admin/signing-keys/rotate (revoke_previous is a query parameter) declare no requestBody (api/openapi.yaml), so a body the fuzzer invents is ignored and the normal 200 or 204 follows."
    when: {response_code: {in: [200, 204]}, path: {in: ["/v1/tasks/{id}/release", /v1/admin/reset, "/v1/admin/identities/{identity}/reset-credential", /v1/admin/signing-keys/rotate]}, fuzzer: {in: [RandomDummyInvalidJsonBody, NewFields, InvalidContentLengthHeaders]}}
  - id: ROTATION_COOLDOWN_409
    why: "The harness runs the standalone server with signing_key_rotation_cooldown_seconds=1, the setting's floor (Task 8.1 g; internal/server/config), and CATS fires many requests per second, so after a rotation succeeds (Step 2b HappyPath Test 1 and NewFields Test 46 answered 200) every rotation within the same second is the documented 409 ErrCooldown (internal/core/signingkeys/service.go:324; ADR 0012)."
    when: {response_code: 409, path: /v1/admin/signing-keys/rotate, json_body.code: conflict, json_body.detail: {contains: "the next rotation is allowed at"}}
  - id: RESET_CREDENTIAL_UNKNOWN_IDENTITY_403
    why: "RandomResources and InvalidReferencesFields mangle the identity path variable (cats-victim.json, a UUID, a random word); an identity that was never registered answers the documented 403 not_registered (components/responses/Forbidden code enum; internal/core/identities/admin.go:33). The real target cats-victim answered 200 (Step 2b HappyPath Test 1)."
    when: {response_code: 403, path: "/v1/admin/identities/{identity}/reset-credential", json_body.code: not_registered}
  - id: VALIDATED_FIELD_400
    why: "Identifier, enum, cursor and typed fields are validated literally and never sanitized (internal/core/rules/bounds.go, TestSpecBounds, the spec's maxLength, enum and format); null is refused because no field is nullable. CATS's sanitize-then-validate expectation is 2xx. The fuzzer list is explicit and leaves out the happy-path family (HappyPath, OnlyRequiredFields, ExamplesFields, RemoveFields, EmptyJsonBody, BypassAuthentication) so an over-strict 400 on a plain request stays visible."
    when:
      response_code: 400
      json_body.code: validation
      fuzzer: {in: [ZeroWidthCharsInValuesFields, ControlCharsInStringFields, HangulFillerFields, ZalgoTextInFields, EmojisInStringFields, AbugidasInStringFields, FullwidthBracketsFields, EmptyStringsInFields, MaxLengthExactValuesInStringFields, EnumCaseVariantFields, NullValuesInFields, MaximumExactNumbersInNumericFields, MinimumExactNumbersInNumericFields]}
  - id: UNKNOWN_ID_404
    why: "Zero-width, control or combining characters inserted into a path or query identifier make an unknown id; 404 is the documented answer and the server does not strip them (no sanitization in internal/core/rules)."
    when: {response_code: 404, result_reason: "Not found", fuzzer: {in: [ZeroWidthCharsInValuesFields, ControlCharsInStringFields, HangulFillerFields, EmojisInStringFields, AbugidasInStringFields, FullwidthBracketsFields, ZalgoTextInFields, MaxLengthExactValuesInStringFields, IterateThroughEnumValuesFields]}}
  - id: RANDOM_REFERENCE_UNKNOWN
    why: "CATS fills reference fields (parent, a channel name in a filter, an identity) with random values; 'does not exist' or 'is not registered' at the documented 400 or 404 is the right answer (the HappyPath of createTask also lands here because TaskCreateRequest.parent carries no property example, a refData improvement noted in the round 2 report)."
    when: {response_code: {in: [400, 404]}, response_body: {contains_any: ["does not exist", "is not registered"]}}
  - id: XSS_OPAQUE_TEXT
    why: "Text fields (content, subject, description, text) are opaque to the server, never rendered as HTML, and encoding/json escapes <, > and & by default; a stored payload returned inside JSON is not a reflection."
    when: {response_code: {in: [200, 201, 204]}, fuzzer: XssInjectionInStringFields, result_reason: {starts_with: "XSS payload"}}
  - id: XXE_OPAQUE_TEXT_ECHO_200
    why: "The status text is opaque and the status document echoes it (admin Test 13582: the stored text contains the payload's own 'xxe_test_success' and 'DOCTYPE' strings); no package of this module imports encoding/xml, so nothing parses it. CATS's heuristic reads the echo as entity expansion."
    when: {response_code: 200, path: "/v1/sessions/{session}/status", fuzzer: XxeInjectionInStringFields, result_reason: {contains: "XXE"}}
  - id: NOSQL_HEURISTIC_200
    why: "The store is SQL with bound parameters (internal/store/sqlstore); CATS matched its own stored payload echoed in the task document."
    when: {response_code: 200, fuzzer: NoSqlInjectionInStringFields, result_reason: "NoSQL injection vulnerability detected"}
  - id: LEADING_ZEROS_QUERY_2XX
    why: "A query parameter is a string the server parses as the declared integer (strconv); 007 is 7, and watch answers 204 when nothing arrives within watch_max_seconds. CATS expects 4xx."
    when: {response_code: {in: [200, 204]}, fuzzer: LeadingZerosInNumericFields, method: GET}
  - id: LARGE_STRING_WITHIN_BOUNDS_2XX
    why: "The value is within the field's bound (internal/core/rules/bounds.go, TestSpecBounds), so 200 or 201 is right; CATS expects 4xx for any very large string."
    when: {response_code: {in: [200, 201]}, fuzzer: VeryLargeStringsInFields}
  - id: AGENT_CANNOT_STRIP_PROTECTED_ACL_ENTRY_403
    why: "In the standalone flow the ACL PUT runs as cats-agent (plan ruling 12: all: is the agent bearer) against cats-acl, whose seeded ACL names cats-admin too (acl_both, scripts/cats-harness.sh); every fuzzed body omits or shrinks the administrator's entry, and an agent that is not an administrator never removes a permission from a protected entry (CLAUDE.md Design, set_acl; internal/core/access/decide.go decideACLChange; ADR 0011), so 403 'an agent cannot remove ... from ACL entry \"cats-admin\"' is the documented answer (Step 8 run-20261108T170214Z Tests 79 to 11376, 23 rows)."
    when: {response_code: 403, path: "/v1/channels/{channel}/acl", method: PUT, json_body.code: forbidden, json_body.detail: {contains: "an agent cannot remove"}}
  - id: TASK_PATCH_DELETE_EXCLUSIVE_400
    why: "TaskPatch.delete is documented as exclusive: 'True deletes the task; it cannot be combined with another member (400 validation)' (api/openapi.yaml TaskPatch.delete description; internal/core/tasks/update.go answers exactly this detail), but the schema lets delete sit beside every other member, so CATS's HappyPath (every field at once) is refused by design. Plan ruling 38 records this as a rule rather than a oneOf (Open item 9, Eric may prefer the schema form)."
    when: {response_code: 400, path: "/v1/tasks/{id}", method: PATCH, json_body.code: validation, json_body.detail: "delete cannot be combined with other changes"}
