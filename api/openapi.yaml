  /v1/admin/status:
    get:
      operationId: adminStatus
      summary: "The administrator's view of the server: sessions, channels, notices and the embedding backlog"
      tags: [admin]
      description: >-
        Returns the administrator's view of the server: every live session of every
        identity, every channel with its creator, scope and capabilities, the server notices
        (capacity, embedding and inspection, in that order; an inspection notice that no
        failing replica has rewritten within inspection_notice_ttl_seconds is left out) and,
        when an embedding service is configured, the embedding backlog (counted up to 1000),
        the rejections and the embedding error. Without an embedding service the two counts
        are 0 and the other embedding members are absent. Administrator only. Any other
        caller gets 403 forbidden. Writes nothing. No idempotency key: a read has nothing to
        repeat. Source: spec 3.2, Decision 73.
      responses:
        "200":
          description: Server status for administrators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
