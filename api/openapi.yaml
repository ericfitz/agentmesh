          session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
          display_name: acme-coder-1/builder
          set_at: 1794096000000
      description: One identity's current status in the agent list, with whether the identity is live.
      type: object
      required: [identity, kind, live, status]
      properties:
        identity:
          type: string
          description: "The identity the status belongs to."
        kind:
          type: string
          description: "Whether the identity is an agent or a human."
          enum: [agent, human]
        live:
          type: boolean
          description: "True when the identity has a live session; false reads the tag as offline."
        status:
          $ref: "#/components/schemas/AgentStatus"
    Channel:
      example:
        name: acme-ops
        kind: ordinary
        capabilities: [bridged]
      description: "What a caller sees of a channel it may list: name, kind and capabilities."
      type: object
      required: [name, kind, capabilities]
