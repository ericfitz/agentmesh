        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/signing-keys/rotate:
    post:
      operationId: rotateSigningKey
      summary: "Rotate the active token signing key"
      tags: [admin]
      description: >-
        Asks the configured key provider for the next key and makes it the
        active key. The previous active key keeps verifying until its removal
        time (state retiring), or is deleted at once with revoke_previous, which
        also skips the rotation cooldown. Inside the cooldown a plain rotation
        answers 409 conflict. Administrator only.
      parameters:
        - name: revoke_previous
          description: "Delete the previous active key at once instead of retiring it, and skip the rotation cooldown; default false"
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
