            type: integer
            format: int64
          description: "The ids of the tasks that must be completed before this one can start; absent when none. A blocker that was deleted stops counting and is dropped from the list on the task's next update."
        leased_until:
          type: integer
          format: int64
          description: "When the owner's lease ends, in Unix milliseconds; absent when the task has none. Only an in_progress task keeps a lease, and a task whose lease has run out is abandoned."
        reclaimed_from:
          type: string
          description: "the owner the abandoned-task reclaim took the task from; present until the task is claimed, assigned or leaves pending"
        reclaimed_at:
          type: integer
          format: int64
          description: "when the reclaim happened, unix ms"
        metadata:
          type: object
          additionalProperties:
            type: string
          description: "Free-form string pairs attached to the task; absent when none. An update merges into them."
        blocked:
          type: boolean
          description: "True while at least one task in blocked_by is live and not completed."
        open_blockers:
          type: array
          items:
            type: integer
            format: int64
          description: "The ids in blocked_by whose tasks are live and not completed; absent when none."
        updated_at:
          type: integer
          format: int64
          description: "When the task's current revision was stored, in Unix milliseconds."
        updated_by:
