    Usage:
      type: object
      required: [bytes, budget_bytes, evictable, disk_bytes, disk_ratio, tier]
      properties:
        bytes:
          type: integer
          format: int64
          description: "The enforced measure: used file bytes on SQLite, the logical sum on Postgres."
        budget_bytes:
          type: integer
          format: int64
