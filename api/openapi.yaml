      type: object
      required: [id, channel, revision, subject, status, rank, blocked, updated_at, updated_by]
      properties:
        id:
          type: integer
          format: int64
          description: "The task's id: the sequence number of its first revision. It stays the same through every update and is the id the task operations take."
