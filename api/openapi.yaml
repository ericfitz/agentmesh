openapi: 3.1.0
info:
  title: agentmesh
  version: 1.0.0
  description: >-
    The agentmesh HTTP API (spec section 3, Decision 65). Path parameters: a
    client percent-encodes every path parameter exactly once (a space is %20,
    a percent sign %25, a slash inside a name %2F, a question mark %3F, a
    number sign %23); the server decodes each parameter exactly once, so a
    channel name such as 100% or a%2Fb round-trips as the literal name and an
    empty segment matches no route. Optional members are absent from the JSON,
    never null. Every error is application/problem+json.
servers:
  - url: http://localhost:8420
    description: "A placeholder: deployments vary (Eric, 2026-11-06). A client takes the base URL from its profile; the server's own listener is -listen."
security:
  - bearerAuth: []
tags:
  - name: discovery
    description: "The well-known documents and /v1/discover"
  - name: health
    description: "GET /v1/health"
  - name: sessions
    description: "Open, close, receive, watch, peek, identities and agent status"
  - name: channels
    description: "Channels, ACLs, subscriptions and tag subscriptions"
  - name: messages
    description: "Send, history and search"
  - name: memories
    description: "Memory documents and their revisions"
  - name: tasks
    description: "Task lists"
  - name: admin
    description: "Administrator operations (scopes, identities, bridges, signing keys, status, usage, reset)"
  - name: auth
    description: "Registration, the token endpoint and the JWKS"
paths:
  /.well-known/agentmesh:
    get:
      operationId: wellKnown
      summary: "The agentmesh well-known document: where to discover the API"
      tags: [discovery]
      security: []
      description: >-
        Returns the path of the versioned discovery document, /v1/discover, so a
        client that knows only the host can find the API. Open operation. Writes
        nothing. No idempotency key: a read has nothing to repeat. Source: spec 3.1,
        Decision 43.
      responses:
        "200":
          description: Pointer to the versioned discovery endpoint (Decision 43).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /.well-known/oauth-authorization-server:
    get:
      operationId: authorizationServerMetadata
      summary: "OAuth 2.0 authorization server metadata (RFC 8414)"
      tags: [discovery]
      security: []
      description: >-
        Returns the RFC 8414 metadata of this server's token endpoint: the issuer,
        the token endpoint and JWKS URLs, the grants, the client authentication
        methods and the signing algorithms a client assertion may use. The issuer is
        the configured one when set and is then never derived from the request Host;
        without a configured issuer it is the scheme and host of the request. Open
        operation. Writes nothing. No idempotency key: a read has nothing to repeat.
        Source: spec 3.1, Decisions 55, 70, 84, 91.
      responses:
        "200":
          description: >-
            OAuth 2.0 authorization server metadata (RFC 8414). The same
            document is served at /.well-known/openid-configuration for
            existing clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /.well-known/openid-configuration:
    get:
      operationId: openidConfiguration
      summary: "OpenID Connect discovery document for this server"
      tags: [discovery]
      security: []
      description: >-
        Returns the same document as authorizationServerMetadata for clients that
        predate the RFC 8414 path. The server is not an OpenID Provider and the
        document says nothing about OpenID Connect. Open operation. Writes nothing.
        No idempotency key: a read has nothing to repeat. Source: spec 3.1, Decision
        91.
      responses:
        "200":
          description: >-
            The same document as /.well-known/oauth-authorization-server. It
            is kept for existing clients. The server is not an OpenID Provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/discover:
    get:
      operationId: discover
      summary: "The liveness probe: API versions, server and protocol version, capabilities and auth methods"
      tags: [discovery]
      security: []
      description: >-
        Returns the API versions, the server and protocol versions, the
        capabilities, the authentication methods and the issuer metadata locations.
        The capabilities are computed, not configured: health and long_poll always,
        semantic_search when an embedder is configured. The authentication methods
        are computed from the security schemes of this document, and issuers lists
        the configured external identity providers. It never touches the store, so
        it is the liveness probe and a store outage does not fail it. Open
        operation. Writes nothing. No idempotency key: a read has nothing to repeat.
        Source: spec 3.1, Decision 65, ADR 0010.
      responses:
        "200":
          description: Server versions, capabilities and auth methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/health:
    get:
      operationId: health
      summary: "The health document as the caller's tier sees it"
      tags: [health]
      security:
        - {}
        - bearerAuth: []
      description: >-
        Returns the health document at the caller's tier: probe without a credential
        (status, tier, version, protocol_version, now), identity for a registered
        identity (adds started_at, the store and the embedding state), admin for an
        administrator (adds the embedding model and errors, storage, notices and the
        maintenance loop). status is degraded when an operator notice is set or this
        process's last maintenance tick recorded a lock error or a failed job, and
        every tier sees the same status. A bearer the server rejects is 401 and is
        never the probe tier; a valid bearer whose identity no longer exists is 403
        not_registered; a store that does not answer is 503 unavailable with the
        detail store unreachable and never a document. Open operation. The bearer is
        optional, and the tier is decided by the administrator flag. Writes nothing.
        No idempotency key: a read has nothing to repeat. Source: ADR 0010, Decision
        73, spec 3.1.
      responses:
        "200":
          description: The health document, as the caller's tier may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions:
    post:
      operationId: openSession
      summary: "Open a session for the caller's identity, resuming by token or offering cursors"
      tags: [sessions]
      description: >-
        Opens a session for the caller, or resumes one. When resume_token names a
        session row the server still retains (live, or lapsed and not yet swept:
        Decision 79), that session is resumed: its lease is renewed, its cursors,
        pending batch and token are untouched, resumed is true, and hint and cursors
        are not applied. A token the server no longer holds opens a fresh session; a
        malformed token is 400 validation, another identity's token is 404
        not_found, and a closed session's token is 410 session_closed. A fresh
        session gets a display name (the identity, or identity/hint, with -2, -3 and
        so on until it is unique among the identity's sessions that are not closed:
        Decisions 15 and 39; the hint never affects what the session may do), a
        cursor on every subscribed channel at the identity's acknowledged position,
        and each offered cursor adopted where it can be. An offered cursor is
        rejected as unsubscribed (no such channel, or the identity is not subscribed
        to it), unreadable (the identity may not receive it), before_retention
        (messages after it are already removed) or ahead (above the newest sequence
        number the server has assigned); that channel then starts at the
        acknowledged position (Decision 44). pending counts, for each subscribed
        channel the caller may receive, the messages above the session's position,
        up to receive_max_count. A resume answers 201 like a new session. Any
        registered identity. Side effects: creates the session row and its cursors
        (a fresh open), or renews the lease (a resume). No idempotency key: a
        retried open creates another session, and the first, never used, lapses and
        the retention sweep removes it; resume with the token you hold instead.
        Source: spec 4.3, Decisions 15, 39, 40, 44, 79, ADR 0003.
      requestBody:
        description: "The hint for a second session, the resume token of a session to resume and the cursors a client kept"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
            examples:
              default:
                summary: A new session for a second role, offering one cursor
                value:
                  hint: builder
                  cursors:
                    - channel: release-train
                      seq: 41
              resume:
                summary: Resume a retained session by its token
                value:
                  resume_token: ZXhhbXBsZS1yZXN1bWUtdG9rZW4tbm90LWEtcmVhbDE
      responses:
        "201":
          description: Session opened or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}:
    delete:
      operationId: closeSession
      summary: "Close a session, freeing its display name"
      tags: [sessions]
      description: >-
        Closes one of the caller's own sessions, live or lapsed: the row is marked
        closed and its display name is free for the next open (a lapsed row may be
        closed, which is how a client frees a crashed session's name). A closed
        session cannot be resumed (its token answers 410 session_closed), and a call
        that names it answers 410 session_closed. Closing a closed session succeeds
        and changes nothing; a session of another identity, or one that does not
        exist, is 404 not_found. Any registered identity. Only the caller's own
        sessions. Side effects: sets the closed time and the lease to now; the
        retention sweep removes the row later. Idempotency-Key: a repeat with the
        same key and body returns the first answer. Source: spec 4.3, Decision 15,
        ADR 0003.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Session closed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/receive:
    post:
      operationId: receive
      summary: "Receive the next batch of messages for a session, acknowledging the previous one"
      tags: [sessions]
      description: >-
        Delivers the next batch for the session and, in the same call, acknowledges
        the previous one. The batch holds the messages above the session's position
        on every subscribed channel the caller may receive, plus the messages whose
        tags match a tag subscription (an unfiltered receive only; those carry
        matched_tags), oldest first, at most count and cut to fit result_default_kib.
        The server records the batch as pending and returns its token in batch; the
        position advances only when a later receive passes that token as ack, so a
        lost response redelivers the same batch (redelivered is true, whatever count
        and channels say, with the include_own of the first delivery) until it is
        acknowledged. An ack that is not the pending token changes nothing and is
        reported as ack_ignored. When retention removed messages the session had not
        received, gaps names each range and the position moves past it. notice
        carries the capacity notice when one is set, and instruction says what to
        pass as ack. An empty batch has no token. Agents are never delivered memory
        channels; they find a memory with search and read it with getMemory. Any
        registered identity. Only the caller's own sessions; channels the caller may
        not receive are skipped, and naming one it cannot see in channels is 404
        not_found. Side effects: renews the session lease and stores the pending
        batch; a matching ack advances the session's positions and the identity's
        acknowledged marks. No idempotency key: repeating a receive redelivers the
        same pending batch, and repeating an ack is ignored. Source: spec 3.5 and
        4.3, Decisions 16, 40, 75, 95, ADR 0003.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
      requestBody:
        description: "The batch token to acknowledge, the batch size, the channels to read and whether to include the session's own messages"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveRequest"
      responses:
        "200":
          description: A batch of pending messages (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/watch:
    get:
      operationId: watch
      summary: "Long-poll until the session has something to receive or the timeout passes"
      tags: [sessions]
      description: >-
        Waits until the session has something to receive or the timeout passes. It
        wakes for a message above the watch floor, the highest of the session's
        position, the end of any pending batch and after, so a batch already handed
        out never wakes it. After a wake the server waits up to watch_merge_seconds
        (default 2) so a burst is reported as one wake. It answers 200 with seq,
        count and channels, or 204 when the wait ended with nothing new. The wait is
        cut to watch_max_seconds (default 50), which also applies to a timeout of 0.
        A newer watch on the same session replaces this one, which answers 409
        replaced and must not retry. A watch delivers and acknowledges nothing: call
        receive to read. Any registered identity. Only the caller's own sessions.
        Side effects: registers the watch on the session, replacing the older one,
        and renews the lease. No idempotency key: a watch is a wait, and repeating
        it registers a new watch that replaces the first. Source: spec 3.5,
        Decisions 42, 45, 68, ADR 0003.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: after
          description: "Wake only for messages with a sequence number above this one, as well as above the session's position (the higher of the two counts); default 0"
          example: 41
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
            maximum: 9223372036854775807
        - name: timeout
          in: query
          required: false
          example: 30
          description: >-
            Seconds to wait; fractional allowed; 0 or absent means the server cap. At most 240 seconds, the largest value of watch_max_seconds; above the configured watch_max_seconds the server waits at most that long.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 240
        - name: include_own
          description: "Whether the session's own messages count, so a message it sent wakes it; default false"
          example: true
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Woke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wake"
        "204":
          description: Timed out, nothing new.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/peek:
    get:
      operationId: peek
      summary: "Count the messages pending above the watch floor, without delivering or acknowledging them"
      tags: [sessions]
      description: >-
        Counts the messages pending for the session above the floor watch uses (the
        session's position and the end of any pending batch), without delivering,
        acknowledging or waking anything: the total in count, and per channel for
        the channels that have any. Each source (a subscribed channel, and the tag
        subscriptions as a whole) counts at most receive_max_count. Any registered identity. Only the
        caller's own sessions: another identity's session is 404 not_found, a
        closed one 410 session_closed and a lapsed one 410 session_lapsed. Writes
        nothing (no lease renewal, no cursor, no watch row, no receipt). No
        idempotency key: a read has nothing to repeat. Source: spec 3.5, ADR 0003.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: include_own
          description: "Whether the session's own messages count; default false"
          example: true
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The pending counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Peek"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/identities:
    get:
      operationId: listIdentities
      summary: "List identities that have a live session"
      tags: [sessions]
      description: >-
        Lists the identities the caller may see that have at least one live
        session, by name, each with its kind, administrator flag, live sessions and
        its current status when it has one. A scoped agent sees the identities of
        its scope plus every human and administrator (ADR 0011). An identity with no
        live session is not listed; listAgentStatuses lists those that went
        offline. Any registered identity. Writes nothing. No idempotency key: a read
        has nothing to repeat. Source: spec 4.1, ADR 0011, ADR 0014.
      responses:
        "200":
          description: Registered identities and their open sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
              example:
                - name: acme-coder-1
                  kind: agent
                  admin: true
                  sessions:
                    - id: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                      identity: acme-coder-1
                      display_name: acme-coder-1/builder
                      opened_at: 1794096000000
                  status:
                    identity: acme-coder-1
                    revision: 3
                    tag: needs-human
                    text: Waiting for approval to deploy build 42 to staging
                    problem: Staging needs a change approval that only a human can grant
                    session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                    display_name: acme-coder-1/builder
                    set_at: 1794096000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/status:
    post:
      operationId: setAgentStatus
      summary: "Set the calling agent's status line from one of its live sessions"
      tags: [sessions]
      description: >-
        Sets the calling agent's status line from one of its live sessions. An
        identity has one status; every call appends the next revision to its history
        (a repeat of an identical status is a new revision too) and prunes the
        history to status_history_count (default 20, the current status included).
        tag is one of idle, planning, implementing, reviewing, waiting, blocked or
        needs-human; offline is set by the server for an identity with no live
        session and is refused here. text is required and one line; problem is
        optional and says what blocks the agent. The session must be live (410
        session_closed or session_lapsed otherwise). The call shares the sender's
        rate limit with messages: 429 rate_limited with Retry-After. Any registered
        identity. Only an agent sets a status, and only its own (403 forbidden
        for a human). Side effects: appends one
        revision and may delete the oldest; the session's lease is renewed.
        Idempotency-Key: a repeat with the same key and body returns the first
        answer and adds no revision. Source: ADR 0014, Decisions 2, 4, 8, 14.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The status tag, the one-line text and an optional problem"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAgentStatusRequest"
      responses:
        "200":
          description: The stored status revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/agent-statuses:
    get:
      operationId: listAgentStatuses
      summary: "List every visible identity's stored status"
      tags: [sessions]
      description: >-
        Lists the latest status of every identity the caller may see that has one,
        by identity (byte order). An identity with no live session reads tag offline
        with live false, and last_tag keeps the stored tag; an offline entry whose
        status was set more than status_offline_hours ago (default 24; 0 keeps only
        live identities) is left out. A scoped agent sees its scope plus every human
        and administrator (ADR 0011). Any registered identity. Writes nothing. No idempotency
        key: a read has nothing to repeat. Source: ADR 0014, Decisions 3, 7 and 18.
      responses:
        "200":
          description: The current statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentStatusEntry"
              example:
                - identity: acme-coder-1
                  kind: agent
                  live: true
                  status:
                    identity: acme-coder-1
                    revision: 3
                    tag: needs-human
                    last_tag: needs-human
                    text: Waiting for approval to deploy build 42 to staging
                    problem: Staging needs a change approval that only a human can grant
                    session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                    display_name: acme-coder-1/builder
                    set_at: 1794096000000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/identities/{identity}/statuses:
    get:
      operationId: agentStatusHistory
      summary: "List one identity's stored statuses, oldest first"
      tags: [sessions]
      description: >-
        Lists one identity's stored status revisions, oldest first, at most
        status_history_count (default 20, the current status included); revisions
        pruned by later sets are gone, and after the setting is lowered the extra
        rows stay stored until the identity's next set but are not returned. An identity that is not registered,
        or is outside a scoped caller's view, is 404 not_found. Any registered
        identity. The caller must be able to see the named identity (the
        Identity/See action of the access check). Writes nothing. No idempotency key: a read has nothing to repeat.
        Source: ADR 0014, Decisions 7 and 8.
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
            maxLength: 384
          example: acme-coder-1
          description: >-
            The identity whose statuses to read, percent-encoded once. At most 384 characters: the percent-encoded length (the server counts 128 decoded bytes).
      responses:
        "200":
          description: The stored revisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentStatus"
              example:
                - identity: acme-coder-1
                  revision: 2
                  tag: implementing
                  text: Deploying build 42 to staging
