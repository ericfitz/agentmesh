        embedding_rejected_last: "input exceeds the model context window"
        embedding_error: "embedding service unreachable: connection refused"
        embedding_error_at: 1794095000000
      description: "The administrator's view: live sessions, every channel with its creator, server notices and the embedding backlog and rejections."
      type: object
      required: [sessions, channels, notices, embedding_backlog, embedding_rejected]
      properties:
        sessions:
          type: array
          description: "The live sessions of every identity; empty when there are none."
          items:
            $ref: "#/components/schemas/SessionInfo"
        channels:
          type: array
          description: "Every channel on the server, whatever its kind or scope, with its creator and capabilities."
          items:
            $ref: "#/components/schemas/ChannelInfo"
        notices:
          type: array
          description: "The notices that are set, in the order capacity, embedding, inspection; empty when there are none."
          items:
            $ref: "#/components/schemas/Notice"
        embedding_backlog:
          type: integer
          description: "Memories still waiting for an embedding, counted up to 1000; 0 when no embedding service is configured."
        embedding_rejected:
          type: integer
          description: "How many memories the embedding service rejected for the configured model; 0 when no embedding service is configured."
        embedding_rejected_last:
          type: string
          description: "The reason of the latest rejection; absent when there is none."
        embedding_error:
          type: string
          description: "The text of the embedding notice while the service is failing; absent otherwise."
        embedding_error_at:
          type: integer
          format: int64
          description: "When the embedding notice was set, in Unix milliseconds; absent while the service is not failing."
    Usage:
      example:
        bytes: 2306867200
        budget_bytes: 2147483648
        evictable: true
        disk_bytes: 2516582400
        disk_ratio: 1.0909
        tier: soft
        notice: "agentmesh storage is over budget: sqlite_budget_mib=2048 MiB holds 2200 MiB (disk 2400 MiB, 1.09x); orphaned and expired rows, idle task lists and memories, and ordinary messages older than 1 hour are being deleted to make room"
      description: "Storage use against the budget: bytes, budget, disk size and ratio, how close the use is to the budget, and the capacity notice text when one is set."
      type: object
      required: [bytes, budget_bytes, evictable, disk_bytes, disk_ratio, tier]
      properties:
        bytes:
          type: integer
          format: int64
          description: "The enforced measure: used file bytes on SQLite, the logical sum on Postgres."
        budget_bytes:
          type: integer
          format: int64
          description: "The budget of the server's engine (sqlite_budget_mib or postgres_budget_mib) in bytes."
        evictable:
          type: boolean
          description: "True when a budget is enforced, which it always is in this release."
        disk_bytes:
          type: integer
          format: int64
          description: "The physical size of the store in bytes."
        disk_ratio:
          type: number
          format: double
          description: "disk_bytes divided by bytes; 0 when bytes is 0."
        tier:
          type: string
          enum: [normal, approaching, soft, hard, exhausted]
          description: "How close bytes is to the budget. normal: at or below the size a sweep stops at (the budget less cleanup_free_percent). approaching: above that and within the budget. soft: over the budget and the sweep still has rows it deletes first. hard: over the budget and only rows it deletes last remain. exhausted: over the budget and nothing is left to evict."
        notice:
          type: string
          description: "The capacity notice text, when one is set."
    Health:
      example:
        status: degraded
        tier: admin
        version: 2.0.0-dev
        protocol_version: 1.0.0
        now: 1794096000000
        started_at: 1794092400000
        store:
          engine: sqlite
          schema_version: 1
        embeddings:
          state: failing
          backlog: 3
          rejected: 1
          model: example-embedding-model
          last_error: 'embedding service unreachable: connection refused'
          last_error_at: 1794095000000
          rejected_last: 'input exceeds the model context window'
        storage:
          bytes: 352256
          budget_bytes: 2147483648
          evictable: true
          disk_bytes: 352256
          disk_ratio: 1
          tier: normal
        notices:
          - kind: embedding
            message: 'embedding service unreachable: connection refused'
            set_at: 1794095000000
        maintenance:
          interval_seconds: 60
          owner: a31950eb95b5c835988bcf17
          lock: held
          last_tick_at: 1794095940000
          jobs:
            - name: lapsed sessions
              changed: 2
              skipped: false
            - name: embeddings
              changed: 0
              error: 'embedding service unreachable: connection refused'
              skipped: false
      type: object
      description: >-
        The server's health as the caller's tier may see it (spec
        2026-10-25 section 4). Members above the probe tier are absent, never
        null, below their tier. An unreachable store is a 503 problem with
        code unavailable, never a document.
      required: [status, tier, version, protocol_version, now]
      properties:
        status:
          type: string
          description: "ok, or degraded when an operator notice (capacity, embedding or inspection) is set or this process's last maintenance tick recorded a lock error or a failed job. Every tier sees the same status."
          enum: [ok, degraded]
        tier:
          type: string
          description: "What the caller got: probe (no credential), identity (a registered identity) or admin (an administrator), so a probe-only view is never mistaken for health."
          enum: [probe, identity, admin]
        version:
          type: string
          description: "The server's version string, the same value as server_version in the discovery document."
        protocol_version:
          type: string
          description: >-
            The protocol version (this document's info.version): the major is
            the /v1 path, the minor is bumped on every addition, the patch on
            a documentation-only change. Independent of version.
        now:
          type: integer
          format: int64
          description: "The server's clock, in Unix milliseconds."
        started_at:
          type: integer
          format: int64
          description: "When this process started, in Unix milliseconds; identity tier and above."
        store:
          $ref: "#/components/schemas/HealthStore"
        embeddings:
          $ref: "#/components/schemas/HealthEmbeddings"
        storage:
          $ref: "#/components/schemas/Usage"
        notices:
          type: array
          description: "The operator notices (capacity, embedding, inspection); an empty list when none is set. Administrator tier only."
          items:
            $ref: "#/components/schemas/Notice"
        maintenance:
          $ref: "#/components/schemas/HealthMaintenance"
    HealthStore:
      example:
        engine: sqlite
        schema_version: 1
      description: The store engine and its schema version.
      type: object
      required: [engine, schema_version]
      properties:
        engine:
          type: string
          description: "The store engine: sqlite or postgres."
          enum: [sqlite, postgres]
        schema_version:
          type: integer
          description: "The schema version the database holds."
    HealthEmbeddings:
      example:
        state: failing
        backlog: 3
        rejected: 1
        model: example-embedding-model
        last_error: 'embedding service unreachable: connection refused'
        last_error_at: 1794095000000
        rejected_last: 'input exceeds the model context window'
      description: The embedding state and backlog; the model, last error and rejection details are set at the administrator tier only.
      type: object
      required: [state, backlog, rejected]
      properties:
        state:
          type: string
          description: "off when no embedder is configured, failing while the embedding notice is set, else ok."
          enum: [off, ok, failing]
        backlog:
          type: integer
          description: >-
            Memories waiting for an embedding, capped at 1000 (the search page
            maximum), so 1000 means "at least 1000".
        rejected:
          type: integer
          description: "The number of memories whose embedding the embedder rejected."
        model:
          type: string
          description: "The embedding model; administrator tier only, absent when state is off."
        last_error:
          type: string
          description: "The text of the embedding notice; administrator tier only, absent when none is set."
        last_error_at:
          type: integer
          format: int64
          description: "When the embedding notice was set, in Unix milliseconds; administrator tier only, absent when none is set."
        rejected_last:
          type: string
          description: "The latest rejection reason; administrator tier only, absent when there is none."
    HealthMaintenance:
      example:
        interval_seconds: 60
        owner: a31950eb95b5c835988bcf17
        lock: held
        last_tick_at: 1794095940000
        jobs:
          - name: lapsed sessions
            changed: 2
            skipped: false
          - name: embeddings
            changed: 0
            error: 'embedding service unreachable: connection refused'
            skipped: false
      description: "This process's view of the maintenance loop: its interval, the lock owner and the last tick's jobs."
      type: object
      required: [interval_seconds, owner, lock, jobs]
      properties:
        interval_seconds:
          type: integer
          description: "The period of the maintenance tick in seconds."
        owner:
          type: string
          description: "This process's own lock owner id, not the holder's."
        lock:
          type: string
          description: "The result of this process's last attempt to take the maintenance lock: held, held_elsewhere, or unknown before the first tick and after a lock error."
          enum: [held, held_elsewhere, unknown]
        last_tick_at:
          type: integer
          format: int64
          description: "When this process last ticked, in Unix milliseconds; absent before its first tick."
        lock_error:
          type: string
          description: "The last lock error, truncated; present only when lock is unknown after a failed attempt (that tick lists no jobs), absent otherwise."
        jobs:
          type: array
          description: "The jobs of the last tick; empty before the first tick, when the lock is held elsewhere and after a lock error."
          items:
            $ref: "#/components/schemas/HealthJob"
    HealthJob:
      example:
        name: lapsed sessions
        changed: 2
        skipped: false
      description: One maintenance job's outcome in the last tick.
      type: object
      required: [name, changed, skipped]
      properties:
        name:
          type: string
          description: "The job's name, for example lapsed sessions."
        changed:
          type: integer
          description: "The count the job reported changed in the last tick."
        error:
          type: string
          description: "The job's error text, truncated; absent when the job succeeded."
        skipped:
          type: boolean
          description: "True when the tick's deadline passed before the job ran."
    TokenRequest:
      example:
        grant_type: client_credentials
        client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion: eyJhbGciOiJFZERTQSIsImtpZCI6IlpYaGhiWEJzWlMxemFXZHVhVzVuTFd0bGVTMXBaQzF1YjNRdGNtVmhiREUiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJhY21lLWNvZGVyLTEiLCJzdWIiOiJhY21lLWNvZGVyLTEiLCJhdWQiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJqdGkiOiJleGFtcGxlLWp0aS0xIiwiZXhwIjoxNzk0MDk5NjAwfQ.ZXhhbXBsZS1zaWduYXR1cmUtbm90LXJlYWw
      type: object
      description: >-
        RFC 6749 section 4.4.2 and RFC 8693 section 2.1 token request. The
        grant is a plain string so that an unsupported one answers
        unsupported_grant_type (RFC 6749 section 5.2) rather than failing
        validation; the handler checks which parameters each grant needs.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          maxLength: 1024
          description: "client_credentials, or urn:ietf:params:oauth:grant-type:token-exchange; any other value is unsupported_grant_type. At most 1024 bytes."
        client_assertion_type:
          type: string
          maxLength: 1024
          description: "client_credentials only: urn:ietf:params:oauth:client-assertion-type:jwt-bearer. At most 1024 bytes."
        client_assertion:
          type: string
          maxLength: 16384
          description: "client_credentials only: the signed client assertion JWT, whose iss and sub are the identity and whose aud is the issuer URL. At most 16384 bytes."
        client_id:
          type: string
          maxLength: 128
          description: "client_credentials only, optional: when sent, it must equal the assertion's issuer. The token exchange does not use it. At most 128 bytes (the server counts bytes)."
        scope:
          type: string
          maxLength: 1024
          description: "Ignored by the server. At most 1024 bytes."
        subject_token:
          type: string
          maxLength: 16384
          description: "Token exchange only: the access token a configured external issuer gave the human. At most 16384 bytes."
        subject_token_type:
          type: string
          maxLength: 1024
          description: "Token exchange only: urn:ietf:params:oauth:token-type:access_token; an ID token type is refused. At most 1024 bytes."
        requested_token_type:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, urn:ietf:params:oauth:token-type:access_token. At most 1024 bytes."
        audience:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, the issuer URL of this server (else invalid_target). At most 1024 bytes."
        resource:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, the issuer URL of this server (else invalid_target). At most 1024 bytes."
        actor_token:
          type: string
          maxLength: 16384
          description: "Not supported: any value is invalid_request in a token exchange. At most 16384 bytes."
        actor_token_type:
          type: string
          maxLength: 1024
          description: "Not supported: any value is invalid_request in a token exchange. At most 1024 bytes."
    OAuthError:
      example:
        error: invalid_client
        error_description: assertion replayed
      type: object
      description: RFC 6749 section 5.2 error body.
      required: [error]
      properties:
        error:
          type: string
          description: "The RFC 6749 section 5.2 error code: invalid_request, invalid_client, invalid_target, unsupported_grant_type, temporarily_unavailable or server_error."
        error_description:
          type: string
          description: "A human-readable explanation; a server fault always says internal error and never carries the underlying text."
    AccessToken:
      example:
        access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IlpYaGhiWEJzWlMxemFXZHVhVzVuTFd0bGVTMXBaQzF1YjNRdGNtVmhiREUiLCJ0eXAiOiJhdCtqd3QifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJzdWIiOiJhY21lLWNvZGVyLTEiLCJhdWQiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJjbGllbnRfaWQiOiJhY21lLWNvZGVyLTEiLCJqdGkiOiJleGFtcGxlLWp0aS0xIiwiaWF0IjoxNzk0MDk2MDAwLCJleHAiOjE3OTQwOTk2MDAsImFnZW50bWVzaF9raW5kIjoiYWdlbnQifQ.ZXhhbXBsZS1zaWduYXR1cmUtbm90LXJlYWw
        token_type: Bearer
        expires_in: 3600
        issued_token_type: urn:ietf:params:oauth:token-type:access_token
      description: "The answer of a successful token exchange: the bearer, its type and its lifetime in seconds."
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: "The bearer, a JWT of type at+jwt; send it as Authorization: Bearer."
        token_type:
          type: string
          description: "Always Bearer."
        expires_in:
          type: integer
          format: int64
          description: "Seconds until the bearer expires: token_lifetime_seconds (default 3600) for an agent, the issuer's human lifetime (default 900) for a human."
        issued_token_type:
          type: string
          description: "urn:ietf:params:oauth:token-type:access_token after a token exchange; absent for client_credentials."
    JWK:
      example:
        kty: OKP
        crv: Ed25519
        x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
        kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
        alg: EdDSA
        use: sig
      type: object
      additionalProperties: true
      maxProperties: 16
      description: "A public JSON Web Key (RFC 7517): the members of the key and its kid, alg and use. At most 16 keys: the members of a submitted key."
    JWKS:
      example:
        keys:
          - kty: OKP
            crv: Ed25519
            x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
            kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
            alg: EdDSA
            use: sig
      description: "A JSON Web Key Set: the active signing key and any retiring key that still verifies the bearers it signed."
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: "The public keys, each with its kid."
          items:
            $ref: "#/components/schemas/JWK"
    RegisterRequest:
      example:
        identity: acme-coder-1
        public_key_jwk:
          kty: OKP
          crv: Ed25519
          x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
          kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
          alg: EdDSA
          use: sig
        enrollment_token: abe_ZXhhbXBsZS1lbnJvbGxtZW50LXRvay1ub3QtcmVhbDE
      description: Registers a public key for an identity, with an enrollment token where the server requires one.
      type: object
      additionalProperties: false
      required: [identity, public_key_jwk]
      properties:
        identity:
          type: string
          maxLength: 128
          description: "The identity name to claim: it must have no credential yet. At most 128 bytes (the server counts bytes)."
        public_key_jwk:
          $ref: "#/components/schemas/JWK"
        enrollment_token:
          type: string
          maxLength: 1024
          description: "The plaintext token a host administrator created with enrollment create; required when the server registers by enrollment, consumed on success. At most 1024 bytes."
    Registration:
      example:
        identity: acme-coder-1
        kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
        algorithm: EdDSA
        created: true
      description: "The outcome of a registration: the identity, the key id and algorithm, and whether this call created the identity."
      type: object
      required: [identity, kid, algorithm, created]
      properties:
        identity:
          type: string
          description: "The identity the key is bound to."
        kid:
          type: string
          description: "The key id: the RFC 7638 SHA-256 thumbprint of the public key, base64url."
        algorithm:
          type: string
          description: "The signing algorithm of the key: EdDSA for an Ed25519 key, ES256 for a P-256 key."
          enum: [EdDSA, ES256]
        created:
          type: boolean
          description: "True when this call created the identity, false when it already existed (a repeat of the same key included)."
    CreateIdentityByEmailRequest:
      example:
        email: dana@example.com
      description: Creates a human identity from an email address.
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 128
          description: "The email address the human identity is created for; it is trimmed and lowercased, and the result is the identity's name. At most 128 bytes (the server counts bytes)."
    HumanIdentity:
      example:
        identity: dana@example.com
        created: true
      description: The normalized human identity name and whether this call created it.
      type: object
      required: [identity, created]
      properties:
        identity:
          type: string
          description: "The identity's name: the normalized email address."
        created:
          type: boolean
          description: "True when this call created the identity, false when the address was already bound to one."
    CredentialReset:
      example:
        identity: acme-builder
        keys_removed: 1
      description: "The result of a credential reset: the identity and how many registered keys were removed."
      type: object
      required: [identity, keys_removed]
      properties:
        identity:
          type: string
          description: "The identity whose credential was reset."
        keys_removed:
          type: integer
          description: "How many registered keys were removed; for a human identity, 1 when a provider subject was cleared, else 0."
    SigningKey:
      example:
        kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
        state: retiring
        provider: store
        provider_ref: ""
        algorithm: EdDSA
        created_at: 1794096000000
        retired_at: 1794182400000
        remove_after: 1794268890000
      description: "One token signing key: its id, state, provider, algorithm and times."
      type: object
      required: [kid, state, provider, provider_ref, algorithm, created_at, retired_at, remove_after]
      properties:
        kid:
          type: string
          description: The RFC 7638 thumbprint of the public key; the kid that bearers carry and /v1/auth/jwks publishes.
        state:
          type: string
          enum: [active, retiring]
          description: "active: the key signs new bearers. retiring: it no longer signs and verifies until remove_after."
        provider:
          type: string
          enum: [store, awskms, gcpkms, azurekms, hashivault]
          description: "Where the private key lives: store (a database row) or an external key service."
        provider_ref:
          type: string
          description: The key URI inside an external provider; empty for the store provider.
        algorithm:
          type: string
          description: "The signing algorithm of the key: EdDSA for an Ed25519 key, ES256 for a P-256 key."
          enum: [EdDSA, ES256]
        created_at:
          type: integer
          format: int64
          description: "When the key was created, in Unix milliseconds."
        retired_at:
          type: integer
          format: int64
          description: Unix milliseconds; 0 while the key is active.
        remove_after:
          type: integer
          format: int64
          description: Unix milliseconds, the earliest removal of a retiring key; 0 while the key is active.
    SigningKeyList:
      example:
        keys:
          - kid: ZXhhbXBsZS1uZXh0LWtleS1pZC1ub3QtcmVhbC0zMmI
            state: active
            provider: store
            provider_ref: ""
            algorithm: EdDSA
            created_at: 1794182400000
            retired_at: 0
            remove_after: 0
          - kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
            state: retiring
            provider: store
            provider_ref: ""
            algorithm: EdDSA
            created_at: 1794096000000
            retired_at: 1794182400000
            remove_after: 1794268890000
      description: The server's token signing keys.
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: "The key set, the active key first; public facts only."
          items:
            $ref: "#/components/schemas/SigningKey"
    SigningKeyRotation:
      example:
        active:
          kid: ZXhhbXBsZS1uZXh0LWtleS1pZC1ub3QtcmVhbC0zMmI
          state: active
          provider: store
          provider_ref: ""
          algorithm: EdDSA
          created_at: 1794182400000
          retired_at: 0
          remove_after: 0
        previous:
          kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
          state: retiring
          provider: store
          provider_ref: ""
          algorithm: EdDSA
          created_at: 1794096000000
          retired_at: 1794182400000
          remove_after: 1794268890000
        revoked: false
      description: "The result of a rotation: the new active key, the key that was active before and whether that key was deleted."
      type: object
      required: [active, revoked]
      properties:
        active:
          $ref: "#/components/schemas/SigningKey"
        previous:
          description: The key that was active before the rotation, as the rotation left it (retiring, with its retirement times), or, when revoked is true, the deleted key as it was. Absent when the set had none.
          $ref: "#/components/schemas/SigningKey"
        revoked:
          type: boolean
          description: True when previous was deleted instead of retired.
    CreateAgentIdentityRequest:
      example:
        name: acme-builder
        scope: acme
      description: Creates an agent identity by name, optionally in a scope.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: "The agent identity's name: not a reserved name and not the name of a retired identity. At most 128 bytes (the server counts bytes)."
        scope:
          type: string
          maxLength: 128
          description: "The open scope the identity joins; absent makes an unscoped agent. At most 128 bytes (the server counts bytes)."
    AgentIdentity:
      example:
        identity: acme-builder
        scope: acme
        created: true
        enrollment_token: abe_ZXhhbXBsZS1lbnJvbGxtZW50LXRvay1ub3QtcmVhbDE
        expires_at: 1794182400000
      description: "The result of creating an agent identity: the identity, its scope, whether this call created it and the one-time enrollment token bound to the name with its expiry."
      type: object
      required: [identity, created, enrollment_token, expires_at]
      properties:
        identity:
          type: string
          description: "The agent identity's name."
        scope:
          type: string
          description: "The identity's scope; absent for an unscoped agent."
        created:
          type: boolean
          description: "True when this call created the identity, false when it already existed as a keyless agent of the same scope."
        enrollment_token:
          type: string
          description: "The one-time enrollment token bound to the name, valid for 24 hours; the agent presents it with its public key to register. The server never stores it in clear: this answer is the only copy."
        expires_at:
          type: integer
          format: int64
          description: "When the token expires, in Unix milliseconds."
    CreateScopeRequest:
      example:
        name: acme
      description: Creates a scope by name.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: "The scope's name; a scoped agent's channels are named <name>-<rest>, so the name is also the prefix of those channels. At most 128 bytes (the server counts bytes)."
    DoneScopeRequest:
      example:
        retire: normal
      description: Retires a scope; retire is with_bridge or normal.
      type: object
      additionalProperties: false
      required: [retire]
      properties:
        retire:
          type: string
          enum: [with_bridge, normal]
          description: "with_bridge: retire the scope once its Slack channel is archived (409 conflict when the scope has no live bridge). normal: retire it when its last channel is removed by the normal rules."
    Scope:
      example:
        name: acme
        state: done
        retire: normal
        created_at: 1794096000000
        done_at: 1794182400000
        last_activity: 1794099600000
        channels: [acme-ops, acme-docs]
        identities: [acme-builder]
      description: A named group of channels and agent identities retired as one unit; channels and identities are filled on a get only.
      type: object
      required: [name, state, created_at, last_activity]
      properties:
        name:
          type: string
          description: "The scope's name; also the prefix of its channels' names (<name>-<rest>)."
        state:
          type: string
          enum: [open, done, retired]
          description: "open: the scope takes new channels and identities. done: an administrator marked it done and nothing new may join it. retired: its resources are gone; this API never returns a retired scope (the list omits it, a get answers 404)."
        retire:
          type: string
          enum: [with_bridge, normal]
          description: "How the scope is retired; present once the scope is done."
        created_at:
          type: integer
          format: int64
          description: "When the scope was created, in Unix milliseconds."
        done_at:
          type: integer
          format: int64
          description: "When the scope was marked done, in Unix milliseconds; absent while it is open."
        last_activity:
          type: integer
          format: int64
          description: "The time of the latest message on any of the scope's channels, in Unix milliseconds; the creation time until the first message. The idle rule (scope_idle_hours) reads it."
        channels:
          type: array
          description: "The names of the scope's channels; present on a get only (an empty array is a scope with none)."
          items:
            type: string
        identities:
          type: array
          description: "The names of the scope's agent identities; present on a get only."
          items:
            type: string
    ScopeList:
      example:
        scopes:
          - name: acme
            state: done
            retire: normal
            created_at: 1794096000000
            done_at: 1794182400000
            last_activity: 1794099600000
          - name: globex
            state: open
            created_at: 1794092400000
            last_activity: 1794092400000
      description: The scopes of the server.
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          description: "The open and done scopes by name, without their channels and identities; retired scopes are left out."
          items:
            $ref: "#/components/schemas/Scope"
    CreateBridgeRequest:
      example:
        channel: acme-ops
        slack_name: acme-ops
      description: Creates a bridge from a bus channel to a Slack channel, optionally with a Slack channel name.
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          type: string
          maxLength: 128
          description: "The ordinary channel to bridge: it must belong to an open scope. At most 128 bytes (the server counts bytes)."
        slack_name:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9_-]{1,80}$
          description: >-
            The name of the new Slack channel; absent, the bus channel's name is used, lowercased with every
            other character turned into a hyphen. At most 80 code points of lowercase letters, digits,
            underscore and hyphen.
    Bridge:
      example:
        channel: acme-docs
        scope: acme
        slack_channel_id: C0EXAMPLE02
        slack_name: acme-docs
        state: archived
        created_at: 1794096000000
        archived_at: 1794182400000
      description: The link between a bus channel and a Slack channel, with its state and times.
      type: object
      required: [channel, scope, slack_name, state, created_at]
      properties:
        channel:
          type: string
          description: "The bridged bus channel's name."
        scope:
          type: string
          description: "The scope of the bridged channel."
        slack_channel_id:
          type: string
          description: "Slack's id of the private channel; absent until Slack has created it."
        slack_name:
          type: string
          description: "The name of the Slack channel."
        state:
          type: string
          enum: [creating, live, archived]
          description: "creating: the bridge is reserved and its Slack channel is being set up (a create that failed part way stays here until the next create resumes it). live: the bridge mirrors the bus channel to Slack and Slack to the bus channel. archived: the Slack channel is archived and nothing is mirrored."
        created_at:
          type: integer
          format: int64
          description: "When the bridge was reserved, in Unix milliseconds."
        archived_at:
          type: integer
          format: int64
          description: "When the bridge was archived, in Unix milliseconds; absent until then."
    BridgeNotInvited:
      example:
        identity: dana@example.com
        reason: not found in Slack
      description: A human the bridge could not invite, and why.
      type: object
      required: [identity, reason]
      properties:
        identity:
          type: string
          description: "The human identity, which is its email address, that Slack did not invite."
        reason:
          type: string
          description: "Why: not found in Slack (no Slack account for the address, or a bot or deleted one), Slack guest or external user, or invite failed followed by Slack's error code."
    BridgeCreated:
      example:
        bridge:
          channel: acme-ops
          scope: acme
          slack_channel_id: C0EXAMPLE01
          slack_name: acme-ops
          state: live
          created_at: 1794096000000
        not_invited:
          - identity: dana@example.com
            reason: not found in Slack
      description: The created bridge and the humans it could not invite.
      type: object
      required: [bridge, not_invited]
      properties:
        bridge:
          $ref: "#/components/schemas/Bridge"
        not_invited:
          type: array
          description: "Every human with write on the channel whom Slack could not invite; empty when all were invited."
          items:
            $ref: "#/components/schemas/BridgeNotInvited"
    BridgeList:
      example:
        bridges:
          - channel: acme-docs
            scope: acme
            slack_channel_id: C0EXAMPLE02
            slack_name: acme-docs
            state: archived
            created_at: 1794096000000
            archived_at: 1794182400000
          - channel: acme-ops
            scope: acme
            slack_channel_id: C0EXAMPLE01
            slack_name: acme-ops
            state: live
            created_at: 1794096000000
      description: The bridges of the server.
      type: object
      required: [bridges]
      properties:
        bridges:
          type: array
          description: "Every bridge by channel name, in any state."
          items:
            $ref: "#/components/schemas/Bridge"
