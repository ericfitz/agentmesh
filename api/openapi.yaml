  /v1/auth/token:
    post:
      operationId: token
      summary: "Exchange a client assertion or a subject token for a bearer (RFC 6749, RFC 8693)"
      tags: [auth]
      security: []
      description: >-
        Exchanges a credential for a short-lived bearer; every refusal is an RFC
        6749 section 5.2 body, not a problem document. The client_credentials grant
        is the RFC 7523 private_key_jwt flow: the client assertion's iss and sub are
        the identity, its aud is this server's issuer URL (the token endpoint URL is
        still accepted), its header carries a kid and an alg of EdDSA or ES256, and
        its exp is at most five minutes ahead (plus 60 seconds of clock skew). The
        bearer's lifetime is token_lifetime_seconds (default 3600). The assertion's
        jti is single-use per identity across replicas, so a replayed assertion is
        invalid_client. The token-exchange grant (RFC 8693) trades an access token
        of a configured external issuer, never an ID token, for a human bearer whose
        lifetime is the issuer's human lifetime (default 900 seconds); a first
        sign-in creates the human's identity. A server without a token issuer
        answers 503 temporarily_unavailable. Open operation. The caller has no
        bearer yet. Side effects: the client_credentials grant records the
        assertion's jti and nothing else; the exchange may create the human identity
        and its binding. No idempotency key: the call precedes an identity, and its
        replay protection is the single-use jti, so repeating a request needs a new
        assertion. Source: spec 4.1, Decisions 19, 70, 84.
      requestBody:
        description: "A form-encoded token request: a client assertion (RFC 7523) or a subject token to exchange (RFC 8693)"
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: A short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "413":
          $ref: "#/components/responses/OAuthError"
        "500":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /v1/auth/jwks:
    get:
      operationId: jwks
      summary: "The public keys that verify the bearers this server issues"
      tags: [auth]
      security: []
      description: >-
        Returns the public keys that verify the bearers this server issues: the
        active signing key and any retiring key that still verifies bearers it
        signed, each as a JWK with its kid. A server without a token issuer answers
        503 unavailable. Open operation. Writes nothing. No idempotency key: a read
        has nothing to repeat. Source: ADR 0012, Decision 70.
      responses:
        "200":
          description: The public keys that verify tokens this server issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/register:
    post:
      operationId: register
      summary: "Register an identity's public key, with an enrollment token where registration is by enrollment"
      tags: [auth]
      security: []
      description: >-
        Binds a public key to an identity name and, when the name is new, creates
        the identity and subscribes it to the general channel at the current head.
        The server's registration setting decides, never the request: open (trust on
        first use, the default on a loopback or Unix-socket listener) lets anyone
        claim a name that has no credential, and enrollment (the default on any
        other listener) requires an enrollment token, which a host administrator
        creates. A keyless administrator row (after reset-credential) needs an enrollment token even in open mode. A name that already has a credential cannot take another key (409
        conflict; a lost credential is recovered with the host command
        reset-credential), a scoped identity registers only with the enrollment
        token bound to it, and a human identity cannot register (403). Registering
        the same key again changes nothing, consumes no token and answers success
        with created false, so a client whose response was lost can retry. Open
        operation. The caller has no credential yet. Side effects: creates the
        identity and its key; consumes one use of the enrollment token when one is
        given. No idempotency key: receipts are per identity and the caller has none
        yet, and a repeat with the same key is safe by construction. Source: spec
        4.2, Decisions 20, 58, 72.
      requestBody:
        description: "The identity, its public key as a JWK and, where registration is by enrollment, the enrollment token"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/reset:
    post:
      operationId: adminReset
      summary: "Reset the store (an administrator's reset)"
      tags: [admin]
      description: >-
        Wipes the bus data. With scope data (the default) it deletes the channels with their
        messages, memories, tasks, ACLs and subscriptions, every session, the agent
        statuses, the notices and the idempotency receipts, and keeps the identities with
        their keys, the enrollment tokens, the users and administrators lists, the scopes,
        the bridges (a bridge whose channel the wipe deleted stays as a row until the Slack
        bridge runner cleans it) and the signing keys. With scope everything it also removes every
        identity except the caller and the reserved slack-bridge identity, every enrollment
        token and the users list, and restarts the administrators list as the caller alone.
        Either way the server then recreates the general channel and subscribes every
        remaining identity to it except slack-bridge. Administrator only. Any other caller
        gets 403 forbidden. Side effects: the data is gone for every client, sessions
        included, and the watches are woken. Idempotency-Key: a repeat with the same key and
        scope returns the first answer without wiping again; the same key with another scope
        is 409 conflict. Without a key a second reset leaves the same empty state. Source:
        ADR 0003 (the admin reset scope), ADR 0002 Decision 12, Decision 48.
      parameters:
        - name: scope
          description: "What to wipe: data keeps the identities, their keys and the signing keys; everything removes the other identities, their keys and every enrollment token too. Default data."
          in: query
          required: false
          example: data
          schema:
            type: string
            enum: [data, everything]
            default: data
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: The server's data was reset.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/identities/{identity}/reset-credential:
    post:
      operationId: resetCredential
      summary: "Remove an identity's registered keys"
      tags: [admin]
      description: >-
        Removes every registered key of the identity in the path and answers how many it
        removed (0 is success), so the identity can no longer mint a bearer until a key is
        registered for it again; a bearer already minted stays valid until it expires. A
        human identity holds no keys: the call clears the provider subject recorded at its
        first sign-in, so the next sign-in binds afresh, and the Slack account bound to it,
        and answers 1 when a subject was recorded, else 0. A name that is not registered or
        is reserved is 403 not_registered; a name the name rule refuses is 400 validation.
        Administrator only. Any other caller gets 403 forbidden. Side effects: deletes the
        key rows or clears the binding; nothing is appended. Idempotency-Key: a repeat with
        the same key and body returns the first answer and changes nothing; the same key
        for another identity is 409 conflict. Source: ADR 0002, Decision 58, Decision 73.
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
            maxLength: 384
          example: acme-builder
          description: >-
            The identity whose registered keys are removed, percent-encoded once; a human
            identity's name is its email address. At most 384 characters: the percent-encoded
            length (the server counts 128 decoded bytes).
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: The identity's registered keys were removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/signing-keys:
    get:
      operationId: listSigningKeys
      summary: "List the server's token signing keys"
      tags: [admin]
      description: >-
        The server's token signing key set, the active key first. Public facts only: a
        private key is never part of the answer. Administrator only. Any other caller gets
        403 forbidden. Local mode and a server without a key service answer 503 unavailable,
        not retryable. Writes nothing. No idempotency key: a read has nothing to repeat.
        Source: ADR 0012, docs/ops/signing-keys.md.
      responses:
        "200":
          description: The signing key set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/signing-keys/rotate:
    post:
      operationId: rotateSigningKey
      summary: "Rotate the active token signing key"
      tags: [admin]
      description: >-
        Asks the configured key provider for the next key and makes it the active key. The
        previous active key becomes retiring and keeps verifying until its remove_after
        time, or is deleted at once with revoke_previous, which also skips the rotation
        cooldown and stops the bearers it signed from verifying. Inside the cooldown
        (signing_key_rotation_cooldown_seconds, counted from the active key's creation) a
        plain rotation is 409 conflict, as is a provider whose next key is the active key.
        Administrator only. Any other caller gets 403 forbidden. A provider that cannot
        answer is 503 unavailable, retryable; local mode and a server without a key service
        answer 503 unavailable, not retryable. Side effects: writes the new key row, retires
        or deletes the previous one and refreshes the server's key set. Idempotency-Key: a
        repeat with the same key and body returns the first answer and changes nothing; the
        same key with a different body is 409 conflict. Source: ADR 0012,
        docs/ops/signing-keys.md.
      parameters:
        - name: revoke_previous
          description: "Delete the previous active key at once instead of retiring it, and skip the rotation cooldown; the bearers the deleted key signed stop verifying. Default false."
          in: query
          required: false
          example: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: The rotation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeyRotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/identities/by-email:
    post:
      operationId: createIdentityByEmail
      summary: "Create a human identity for an email address"
      tags: [admin]
      description: >-
        Creates the human identity for an email address, or returns the one already bound to
        it. The address is trimmed and lowercased and the normalized address is the
        identity's name; it must pass the name rule (at most 128 bytes), have one @ with
        text on each side and not be a reserved name (400 validation otherwise). The
        identity has no provider subject until the human first signs in, and is subscribed
        to general. An address already bound to a human answers that identity with created
        false; a name held by an agent, or by a human bound to another address, is 409
        conflict. A malformed address is 400 validation for every caller, a non-administrator
        included (the address is checked first); any other non-administrator gets 403
        forbidden. Administrator only. Side effects:
        writes the identity and its binding when it creates one. Idempotency-Key: a repeat
        with the same key and body returns the first answer and changes nothing; the same
        key with a different body is 409 conflict. Source: ADR 0002, ADR 0009.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The email address the human identity is created for"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityByEmailRequest"
      responses:
        "200":
          description: The human identity bound to the email, created when it did not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/identities:
    post:
      operationId: createAgentIdentity
      summary: "Create an agent identity, optionally in a scope, with a one-time enrollment token"
      tags: [admin]
      description: >-
        Creates a keyless agent identity, optionally in a scope, and a one-time enrollment
        token bound to its name (24 hours, one use); the agent registers its own key with
        the token, so the private key never leaves its host. An unscoped agent is subscribed
        to general, a scoped one is not. The scope must be open: an unknown or retired one
        is 404 not_found, a done one 409 conflict. A repeat for an existing keyless agent of
        the same scope answers created false with a fresh token and revokes its earlier
        unused tokens. A reserved or malformed name, and a scope given for a human or an
        administrator, are 400 validation; an existing human, an identity in another scope
        or in none, an identity that already has a key and a name held by a retired identity
        are 409 conflict. Administrator only. Any other caller gets 403 forbidden. Side
        effects: writes the identity and the token row. No idempotency key: the token is
        never stored in clear and is not in an idempotency receipt, so a receipt could not
        replay it; repeating the call issues a fresh token instead. Source: ADR 0009, ADR
        0011.
      requestBody:
        description: "The agent identity's name and, optionally, its scope"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentIdentityRequest"
      responses:
        "200":
          description: The identity and its enrollment token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/scopes:
    post:
      operationId: createScope
      summary: "Create a scope"
      tags: [admin]
      description: >-
        Creates an open scope: a named group of channels and agent identities that is
        retired as one unit. The name follows the channel name rule and its prefix <name>-
        must not overlap another scope's prefix or name a channel of another scope or of
        none; a name that exists in any state, retired included, is 409 conflict, as is an
        overlap. Administrator only. Any other caller gets 403 forbidden. Side effects:
        writes the scope row with last_activity set to now. Idempotency-Key: a repeat with
        the same key and body returns the first answer and changes nothing; the same key
        with a different body is 409 conflict. Source: ADR 0009, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The new scope's name"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeRequest"
      responses:
        "200":
          description: The new open scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listScopes
      summary: "List scopes"
      tags: [admin]
      description: >-
        Lists the open and done scopes by name, without their channels and identities
        (getScope fills those); retired scopes are not listed. Administrator only. Any other
        caller gets 403 forbidden. Writes nothing. No idempotency key: a read has nothing to
        repeat. Source: ADR 0009, ADR 0011.
      responses:
        "200":
          description: The open and done scopes, without their members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/scopes/{scope}:
    parameters:
      - $ref: "#/components/parameters/ScopeParam"
    get:
      operationId: getScope
      summary: "Read a scope"
      tags: [admin]
      description: >-
        Returns one scope, open or done, with the names of its channels and identities. A
        scope that does not exist or is retired is 404 not_found; a name the name rule
        refuses is 400 validation. Administrator only. Any other caller gets 403 forbidden.
        Writes nothing. No idempotency key: a read has nothing to repeat. Source: ADR 0009,
        ADR 0011.
      responses:
        "200":
          description: The scope with its channel and identity names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/scopes/{scope}/done:
    post:
      operationId: doneScope
      summary: "Retire a scope, with or without its bridge"
      tags: [admin]
      description: >-
        Marks an open scope done and records how it is retired; this call retires nothing,
        and nothing new may join a done scope (409 conflict). with_bridge needs a live
        bridge of the scope (409 conflict otherwise) and the scope is retired once none of
        its bridges is creating or live, which the bridge rules bring about
        (slack_archive_after_done_hours after this call, an idle scope, or no human left in
        the Slack channel). normal retires it when its last channel is removed by the normal
        rules. Either way a scope with no message on any of its channels for
        scope_idle_hours is retired too. Retirement, run by the maintenance job, deletes the
        scope's bridges, its channels of every kind with their messages, subscriptions and
        ACLs and its scoped identities with their keys and sessions, and keeps those names
        reserved for good. A scope already done is 409 conflict; an unknown or retired one
        is 404 not_found. Administrator only. Any other caller gets 403 forbidden. Side
        effects: marks the scope done. Idempotency-Key: a repeat with the same key and body
        returns the first answer and changes nothing; the same key with a different body is
        409 conflict. Source: ADR 0009, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/ScopeParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "How the scope is retired: with_bridge or normal"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoneScopeRequest"
      responses:
        "200":
          description: The scope, now done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/bridges:
    post:
      operationId: createBridge
      summary: "Bridge a channel to a new private Slack channel"
      tags: [admin]
      description: >-
        Bridges an ordinary channel of a scope to a new private Slack channel and starts
        mirroring it. The channel must exist (404 not_found), be of kind ordinary and have a
        scope (400 validation) and the scope must be open (409 conflict when done); its ACL
        may not name everyone or humans nor give admins read or write (403 forbidden).
        slack_name, when given, must match the pattern of the request (400 validation); a
        Slack name already taken and a channel already bridged are 409 conflict. The call
        creates the Slack channel, invites every human with write on the bus channel who is
        a full member of the Slack workspace (guests and external users never are), adds a
        read entry for slack-bridge to the ACL, subscribes slack-bridge and makes the bridge
        live; the humans it could not invite are listed in not_invited and named in a notice
        posted to Slack and to the channel. A failure part way leaves the bridge in state
        creating and the next call resumes it. Administrator only. Any other caller gets 403
        forbidden. Slack's rate limit is 429 rate_limited with Retry-After. A server with no
        Slack bridge answers 503 unavailable, not retryable, with the text "the Slack bridge
        is not configured"; before the bridge has reached Slack the 503 is retryable. No
        idempotency key: a repeat on a live bridge is 409 conflict and on a creating one
        resumes it. Source: ADR 0009, docs/ops/slack-bridge.md.
      requestBody:
        description: "The channel to bridge and, optionally, the Slack channel's name"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBridgeRequest"
      responses:
        "200":
          description: The bridge and every human whom Slack could not invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listBridges
      summary: "List bridges"
      tags: [admin]
      description: >-
        Lists every bridge by channel name, in any state (creating, live or archived).
        Administrator only. Any other caller gets 403 forbidden. A server with no Slack
        bridge answers 503 unavailable, not retryable; before the bridge has reached Slack
        the 503 is retryable. Writes nothing. No idempotency key: a read has nothing to
        repeat. Source: ADR 0009, docs/ops/slack-bridge.md.
      responses:
        "200":
          description: Every bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/bridges/{channel}:
    parameters:
      - $ref: "#/components/parameters/ChannelParam"
    get:
      operationId: getBridge
      summary: "Read a channel's bridge"
      tags: [admin]
      description: >-
        Returns the bridge of a channel, in any state, found by the channel name stored with
        the bridge. A channel with no bridge, including one whose bridge was removed, is 404
        not_found. Administrator only. Any other caller gets 403 forbidden. A server with no
        Slack bridge answers 503 unavailable, not retryable; before the bridge has reached
        Slack the 503 is retryable. Writes nothing. No idempotency key: a read has nothing
        to repeat. Source: ADR 0009, docs/ops/slack-bridge.md.
      responses:
        "200":
          description: The channel's bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bridge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeBridge
      summary: "Remove a channel's bridge, archiving its Slack channel"
      tags: [admin]
      description: >-
        Removes a channel's bridge: posts a final line to the Slack channel and archives it
        (a channel already archived or gone counts as done), then deletes the bridge row
        with its message map, unsubscribes slack-bridge from the bus channel and removes its
        ACL entry. The bus channel and the scope stay. A channel with no bridge is 404
        not_found. Administrator only. Any other caller gets 403 forbidden. Slack's rate
        limit is 429 rate_limited with Retry-After. A server with no Slack bridge answers
        503 unavailable, not retryable; before the bridge has reached Slack the 503 is
        retryable. No idempotency key: a second call is 404 not_found because the bridge row
        is gone. Source: ADR 0009, docs/ops/slack-bridge.md.
      responses:
        "204":
          description: The Slack channel is archived and the bridge is deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token in the RFC 9068 profile (a JWT whose typ header is at+jwt), minted by this
        server and sent as Authorization: Bearer followed by the token. The server is its own issuer:
        iss and aud are the issuer URL that /.well-known/oauth-authorization-server (RFC 8414)
        advertises, sub is the identity, and the token carries client_id, jti, iat, exp and the
        agentmesh_kind claim. It is obtained at POST /v1/auth/token, either by the client
        credentials grant with a client assertion (RFC 7523 private_key_jwt: an agent signs a JWT
        with the key it registered, iss and sub the identity, aud the issuer URL, a jti the server
        accepts once) or, for a human, by the RFC 8693 exchange of a token from a configured
        identity provider. The lifetime is token_lifetime_seconds (default 3600) for an agent and
        the issuer's human_token_lifetime_seconds (default 900) for a human, and never more than
        86400 seconds (one day); the response's expires_in says how long a given token lives. The
        server verifies a bearer as RFC 8725 asks: the algorithm must be EdDSA or ES256 (no other,
        and never none), the typ header must be at+jwt or application/at+jwt, the signature is
        checked with the key the kid header names from the key set at GET /v1/auth/jwks, iss and
        aud must equal the issuer URL, and exp and sub are required (a 60 second clock leeway
        applies). A missing, malformed, expired or otherwise invalid token is answered 401
        unauthenticated.
  parameters:
    SessionParam:
      name: session
      in: path
      required: true
      schema:
        type: string
        maxLength: 3072
      example: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
      description: >-
        The id of the caller's session, as openSession returned it, percent-encoded
        once. At most 3072 characters: the percent-encoded length (the server counts
        1024 decoded bytes).
    ChannelParam:
      name: channel
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      example: release-train
      description: >-
        The channel name, percent-encoded once. At most 384 characters: the
        percent-encoded length (the server counts 128 decoded bytes).
    ScopeParam:
      name: scope
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      example: acme
      description: >-
        The scope name, percent-encoded once. At most 384 characters: the
        percent-encoded length (the server counts 128 decoded bytes).
    IdParam:
      name: id
      in: path
      required: true
      example: 42
      description: "The numeric id of the memory or task, as the id member of its document names it"
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775807
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      example: 6b1f2d4e-0c3a-4f8b-9e7d-example00001
      description: >-
        An opaque key the client chooses to make a mutating call safe to retry
        (Decision 66). The server keeps the first call's answer per identity and
        key for receipt_retention_minutes (default 60); a repeat with the same key
        and body returns that answer without running the call again, and the same
        key with a different body is 409 conflict. Absent or empty means no
        receipt. At most 1024 bytes.
      schema:
        type: string
        maxLength: 1024
  responses:
    BadRequest:
      description: >-
        The request is malformed or fails validation: a parameter, header or
        body the server cannot read or that breaks the schema. code: validation.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:validation
            title: 'Bad Request'
            status: 400
            detail: 'Idempotency-Key must be at most 1024 bytes'
            instance: /v1/channels/release-train/messages
            code: validation
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [validation]
    Unauthorized:
      description: >-
        The bearer is missing, invalid or expired. code: unauthenticated.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:unauthenticated
            title: 'Unauthorized'
            status: 401
            detail: 'invalid credential: invalid bearer token: malformed'
            instance: /v1/health
            code: unauthenticated
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unauthenticated]
    Forbidden:
      description: >-
        The caller is authenticated but may not do this, or is not registered.
        code: forbidden (the access rule refuses the action) or not_registered
        (the bearer names no registered identity).
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:forbidden
            title: 'Forbidden'
            status: 403
            detail: 'acme-coder-1 needs write on channel "release-train"'
            instance: /v1/channels/release-train/messages
            code: forbidden
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [forbidden, not_registered]
    NotFound:
      description: >-
        The named channel, session, memory, task, scope, bridge or identity does
        not exist, or is outside the caller's scope. code: not_found.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:not_found
            title: 'Not Found'
            status: 404
            detail: 'channel "release-train" does not exist'
            instance: /v1/channels/release-train/acl
            code: not_found
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [not_found]
    Conflict:
      description: >-
        The request conflicts with current state: a taken name, a closed scope,
        a live bridge, a reused idempotency key, a precondition that no longer
        holds, or a watch replaced by a newer one on the same session. code:
        conflict, or replaced for a watch.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:conflict
            title: 'Conflict'
            status: 409
            detail: 'idempotency_key "6b1f2d4e-0c3a-4f8b-9e7d-example00001" was used with a different payload'
            instance: /v1/channels/release-train/messages
            code: conflict
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [conflict, replaced]
    Gone:
      description: >-
        The session is closed or its lease has lapsed. code: session_closed or
        session_lapsed.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:session_closed
            title: 'Gone'
            status: 410
            detail: 'session "9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60" is closed'
            instance: /v1/sessions/9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60/peek
            code: session_closed
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [session_lapsed, session_closed]
    PayloadTooLarge:
      description: >-
        The request body exceeds the server limit. A body sent to an operation
        without a request body is refused the same way and is outside the
        contract. code: payload_too_large.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:payload_too_large
            title: 'Request Entity Too Large'
            status: 413
            detail: 'request body exceeds 1114112 bytes'
            instance: /v1/channels/release-train/messages
            code: payload_too_large
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [payload_too_large]
    UnprocessableEntity:
      description: >-
        A configured write inspector rejected the content. code:
        inspection_rejected.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:inspection_rejected
            title: 'Unprocessable Entity'
            status: 422
            detail: 'rejected by inspection (credential_detected): the message appears to contain an API key'
            instance: /v1/channels/release-train/messages
            code: inspection_rejected
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [inspection_rejected]
    TooManyRequests:
      description: >-
        The caller exceeded a rate limit; retry after the number of seconds in
        Retry-After. code: rate_limited.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying, at least 1.
          example: 30
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:rate_limited
            title: 'Too Many Requests'
            status: 429
            detail: 'send_messages_per_second rate limit exceeded for acme-coder-1'
            instance: /v1/channels/release-train/messages
            code: rate_limited
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [rate_limited]
    InternalServerError:
      description: >-
        The server failed in a way the caller cannot correct. code: internal.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:internal
            title: 'Internal Server Error'
            status: 500
            detail: 'database disk image is malformed (11) (SQLITE_CORRUPT)'
            instance: /v1/channels
            code: internal
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [internal]
    ServiceUnavailable:
      description: >-
        The store or a dependency is unavailable; the request may be retried.
        code: unavailable.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:unavailable
            title: 'Service Unavailable'
            status: 503
            detail: 'store unreachable'
            instance: /v1/health
            code: unavailable
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unavailable]
    OAuthError:
      description: >-
        RFC 6749 section 5.2 error; only the token endpoint answers it (spec
        8.1).
      content:
        application/json:
          example:
            error: invalid_client
            error_description: assertion replayed
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    # Convention: every JSON request-body schema (and each object inside a
    # request body) sets `additionalProperties: false`, so a misspelled or
    # unknown member is a 400 validation error instead of being silently
    # dropped. Two exceptions: TokenRequest, because an OAuth token endpoint
    # ignores parameters it does not know (RFC 6749 section 3.2); and JWK
    # (RegisterRequest.public_key_jwk), which is `additionalProperties: true`
    # because a key carries members that differ per key type (RFC 7517). A schema
    # used only in responses stays open so a newer server can add a member; a
    # schema shared by a request and a response (ACLEntry) follows the request
    # rule. A new request body follows the convention.
    Problem:
      example:
        type: urn:agentmesh:problem:not_found
        title: Not Found
        status: 404
        detail: 'channel "release-train" does not exist'
        instance: /v1/channels/release-train/acl
        code: not_found
        retryable: false
      description: "The body of every error response (application/problem+json): the stable code, the HTTP status, whether a retry can succeed, and a human-readable title and detail."
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
          example: urn:agentmesh:problem:not_found
          description: "A URN naming the code: the prefix urn:agentmesh:problem: followed by the code (RFC 9457 section 3.1.1)."
        title:
          type: string
          example: Not Found
          description: "The HTTP status text of the status, for example Not Found."
        status:
          type: integer
          example: 404
          description: "The HTTP status code of the response, repeated in the body."
        detail:
          type: string
          example: 'channel "release-train" does not exist'
          description: "An explanation specific to this occurrence; absent when there is none. The health 503 and the token endpoint never carry the text of a store failure; an internal problem carries the truncated text of the failure."
        instance:
          type: string
          example: /v1/channels/release-train/acl
          description: "The path of the request that failed, for example /v1/channels/release-train/acl; absent when the request is unknown."
        code:
          type: string
          example: not_found
          description: agentmesh extension member (RFC 9457 section 3.2).
          # inspection_rejected is declared per operation (issue #33)
          enum:
            - validation
            - not_found
            - conflict
            - forbidden
            - not_registered
            - rate_limited
            - replaced
            - session_lapsed
            - session_closed
            - unavailable
            - internal
            - unauthenticated
            - inspection_rejected
            - payload_too_large
        retryable:
          type: boolean
          example: false
          description: agentmesh extension member (RFC 9457 section 3.2).
    Wake:
      example:
        seq: 42
        count: 1
        channels: [release-train]
      description: "The answer to a watch that woke: the sequence number, the count of pending messages and the channels they wait on."
      type: object
      required: [seq, count, channels]
      properties:
        seq:
          type: integer
          format: int64
          description: "The highest sequence number among the pending messages that woke the watch."
        count:
          type: integer
          description: "How many messages are pending above the watch floor, each source (a channel, or the tag matches) counting at most receive_max_count."
        channels:
          type: array
          description: "The names of the channels the pending messages are on, sorted and without repeats; a channel reached only through a tag subscription is included."
          items:
            type: string
    Peek:
      example:
        count: 1
        channels:
          - channel: release-train
            count: 1
      description: "The read-only pending counts of a session: the total and the non-zero count of each channel."
      type: object
      required: [count, channels]
      properties:
        count:
          type: integer
          description: "The total number of pending messages above the watch floor, over every channel."
        channels:
          type: array
          description: "The channels that have pending messages, by name; a channel with none is left out."
          items:
            type: object
            required: [channel, count]
            properties:
              channel:
                type: string
                description: "The channel name."
              count:
                type: integer
                description: "How many messages are pending on this channel, at most receive_max_count."
    WellKnown:
      example:
        discover: /v1/discover
      description: "The answer of the well-known document: the path of the discovery document."
      type: object
      required: [discover]
      properties:
        discover:
          type: string
          description: "The path of the discovery document, always /v1/discover."
    AuthMethod:
      example:
        name: bearerAuth
        type: http
        scheme: bearer
        bearer_format: JWT
      description: One authentication method the server accepts, as advertised in the discovery document.
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: "The name of the security scheme in this document."
        type:
          type: string
          description: "The OpenAPI security scheme type of the scheme."
        scheme:
          type: string
          description: "The HTTP authentication scheme; absent when the security scheme names none."
        bearer_format:
          type: string
          description: "The format of the bearer token; absent when the security scheme names none."
    Discovery:
      example:
        api_versions: [v1]
        server_version: 2.0.0-dev
        protocol_version: 1.0.0
        capabilities: [health, long_poll]
        auth_methods:
          - name: bearerAuth
            type: http
            scheme: bearer
            bearer_format: JWT
        authorization_server: http://localhost:8420/.well-known/oauth-authorization-server
        openid_configuration: http://localhost:8420/.well-known/openid-configuration
        issuers: []
      description: "The liveness and discovery document: API versions, server and protocol versions, capabilities, authentication methods and the issuer metadata locations."
      type: object
      required: [api_versions, server_version, protocol_version, capabilities, auth_methods, issuers]
      properties:
        api_versions:
          type: array
          description: "The API versions the server serves; v1 is the /v1 path prefix."
          items:
            type: string
        server_version:
          type: string
          description: "The server's version string, the same value as version in the health document."
        protocol_version:
          type: string
          description: >-
            The protocol version (this document's info.version): the major is
            the /v1 path, the minor is bumped on every addition, the patch on
            a documentation-only change. Independent of server_version.
        capabilities:
          type: array
          description: "What the server offers, sorted and computed from what is available: health and long_poll always, semantic_search when an embedder is configured."
          items:
            type: string
        auth_methods:
          type: array
          description: "The authentication methods, computed from the security schemes of this document (Decision 65)."
          items:
            $ref: "#/components/schemas/AuthMethod"
        authorization_server:
          type: string
          description: URL of the RFC 8414 authorization server metadata.
        openid_configuration:
          type: string
          description: >-
            URL of the same document under /.well-known/openid-configuration,
            kept for existing clients.
        issuers:
          type: array
          description: "The issuer URLs of the configured external identity providers whose access tokens the token endpoint exchanges for a human bearer; empty when none is configured."
          items:
            type: string
    AuthorizationServerMetadata:
      example:
        issuer: http://localhost:8420
        token_endpoint: http://localhost:8420/v1/auth/token
        jwks_uri: http://localhost:8420/v1/auth/jwks
        response_types_supported: []
        grant_types_supported:
          - client_credentials
          - urn:ietf:params:oauth:grant-type:token-exchange
        token_endpoint_auth_methods_supported: [private_key_jwt, none]
        token_endpoint_auth_signing_alg_values_supported: [EdDSA, ES256]
      description: The RFC 8414 authorization server metadata of the server's token endpoint.
      type: object
      required:
        - issuer
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
      properties:
        issuer:
          type: string
          description: "The issuer URL: the configured issuer, else the scheme and host of the request. It is the iss and aud of every bearer the server mints."
        token_endpoint:
          type: string
          description: "The URL of the token endpoint: the issuer followed by /v1/auth/token."
        jwks_uri:
          type: string
          description: "The URL of the key set that verifies the server's bearers: the issuer followed by /v1/auth/jwks."
        response_types_supported:
          type: array
          description: "Always empty: the server has no authorization endpoint and issues tokens only at the token endpoint."
          items:
            type: string
        grant_types_supported:
          type: array
          description: "The grants the token endpoint accepts: client_credentials and the RFC 8693 token exchange."
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          description: "How a client authenticates: private_key_jwt for the client credentials grant, none for the token exchange, which presents no client credentials."
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          description: "The algorithms a client assertion may be signed with: EdDSA and ES256."
          items:
            type: string
    OfferedCursor:
      example:
        channel: release-train
        seq: 41
      description: "A position a client offers on open: a channel and the last sequence number it holds."
      type: object
      additionalProperties: false
      required: [channel, seq]
      properties:
        channel:
          type: string
          maxLength: 128
          description: "The channel the client holds messages of. A channel that does not exist, or one the identity is not subscribed to, is rejected as unsubscribed. At most 128 bytes (the server counts bytes)."
        seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: "The sequence number of the last message the client holds on the channel; delivery resumes above it. It is rejected as before_retention when messages after it are already removed, and as ahead when it is above the newest sequence number the server has assigned."
    OpenSessionRequest:
      example:
        hint: builder
        cursors:
          - channel: release-train
            seq: 41
      description: "Opens or resumes a session: an optional hint, an optional resume token and the cursors the client offers."
      type: object
      additionalProperties: false
      properties:
        hint:
          type: string
          maxLength: 128
          description: "A short role label for a second session or a subagent, such as builder: the display name becomes identity/hint. It never affects what the session may do, must not contain a slash or a control character, and is ignored when resuming. At most 128 bytes (the server counts bytes)."
        resume_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: "The token of the session to resume, as the open that created it returned it. It is valid while the server retains the session row after its lease lapsed; a token the server no longer holds opens a fresh session. Exactly 43 code points of base64url."
        cursors:
          type: array
          items:
            $ref: "#/components/schemas/OfferedCursor"
          maxItems: 256
          description: "Positions the client kept from an earlier session, so the new session resumes where it stopped instead of at the identity's acknowledged position; a channel may be offered once, and a resume does not apply them. At most 256 items."
    RejectedCursor:
      example:
        channel: release-train
        reason: unsubscribed
      description: An offered cursor that was not adopted, with the reason (before_retention, ahead, unreadable or unsubscribed).
      type: object
      required: [channel, reason]
      properties:
        channel:
          type: string
          description: "The channel of the offered cursor that was not adopted."
        reason:
          type: string
          description: "Why: unsubscribed (the channel does not exist, or the identity is not subscribed to it), unreadable (the identity may not receive it), before_retention (messages after the offered position are already removed) or ahead (the position is above the newest sequence number)."
          enum: [before_retention, ahead, unreadable, unsubscribed]
    PendingChannel:
      example:
        channel: general
        pending: 2
      description: The number of messages waiting on one subscribed channel.
      type: object
      required: [channel, pending]
      properties:
        channel:
          type: string
          description: "A channel the identity is subscribed to and may receive."
        pending:
          type: integer
          format: int64
          description: "How many messages wait above the session's position on the channel, counted up to receive_max_count."
    Session:
      example:
        id: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
        identity: acme-coder-1
        display_name: acme-coder-1/builder
        resume_token: ZXhhbXBsZS1yZXN1bWUtdG9rZW4tbm90LWEtcmVhbDE
        resumed: false
        rejected_cursors:
          - channel: release-train
            reason: unsubscribed
        pending:
          - channel: general
            pending: 2
      description: "An opened session: its id, identity and display name, the resume token, whether an existing session was resumed, the rejected cursors and the pending counts."
      type: object
      required: [id, identity, display_name, resume_token, resumed, rejected_cursors, pending]
      properties:
        id:
          type: string
          description: "The session id, 32 lowercase hex characters. Pass it as the session path parameter, and as the session of send."
        identity:
          type: string
          description: "The identity that owns the session: the authenticated caller."
        display_name:
          type: string
          description: "The name the server gave the session: the identity, or identity/hint, with -2, -3 and so on added to be unique among the identity's sessions that are not closed."
        resume_token:
          type: string
          description: "The secret that resumes this session later, 43 base64url characters. The server keeps only a hash of it, so keep it; a resume returns the same token."
        resumed:
          type: boolean
          description: "True when an existing session was resumed, with its cursors and pending batch intact; false for a new session."
        rejected_cursors:
          type: array
          description: "The offered cursors that were not adopted, each with its reason; empty when none were offered or all were adopted, and always empty on a resume."
          items:
            $ref: "#/components/schemas/RejectedCursor"
        pending:
          type: array
          description: "One entry for each subscribed channel the caller may receive, with the messages waiting on it."
          items:
            $ref: "#/components/schemas/PendingChannel"
    ReceiveRequest:
      example:
        ack: "0123456789abcdef01234567:o1"
        count: 10
        channels: [release-train]
        include_own: true
      description: "Reads the next batch for a session: the batch token to acknowledge, a count, an optional channel filter and whether the session's own messages count."
      type: object
      additionalProperties: false
      properties:
        ack:
          type: string
          maxLength: 1024
          description: "The token of the previous batch, to acknowledge it so the session's position advances past it. A token that is not the pending one is ignored and reported as ack_ignored. At most 1024 bytes."
        count:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          x-go-type: int
          description: >-
            The most messages to return; absent or 0 means receive_default_count (100 by default), and a redelivered batch ignores it. At most 10000, the largest value of receive_max_count; above the configured receive_max_count the server returns at most that many.
        channels:
          type: array
          items:
            type: string
            maxLength: 128
            description: At most 128 bytes (the server counts bytes).
          maxItems: 256
          description: "Read only these channels; absent or empty reads every subscribed channel and the tag matches. A channel that holds a pending batch is redelivered whether named or not. At most 256 items."
        include_own:
          type: boolean
          description: "Whether the session's own messages are delivered; default false. The setting is stored with the batch, so a redelivery repeats it."
    Gap:
      example:
        channel: release-train
        from: 30
        to: 41
      description: A range of sequence numbers on a channel that the receiver will never see because retention removed them.
      type: object
      required: [channel, from, to]
      properties:
        channel:
          type: string
          description: "The channel the range was on."
        from:
          type: integer
          format: int64
          description: "The first sequence number of the removed range, just above the session's old position."
        to:
          type: integer
          format: int64
          description: "The last sequence number of the removed range."
    Message:
      example:
        seq: 42
        channel: release-train
        sender: acme-coder-1
        sender_kind: agent
        session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
        display: acme-coder-1/builder
        created_at: 1794096000000
        type: status
        subject: Build 42 is green
        content: Build 42 is green on main; deploying to staging.
        reply_to: 41
        metadata:
          build: "42"
        memory_id: 42
        revision: 1
        tags: [deploy-prod, build-42]
        matched_tags: [deploy-prod]
      description: "A delivered, read or searched message: sender, session, channel, sequence number, subject, content, tags and, on a memory channel, the memory id and revision."
      type: object
      required: [seq, channel, sender, sender_kind, display, created_at, type, subject, content]
      properties:
        seq:
          type: integer
          format: int64
          description: "The message's sequence number: one counter for the whole server, increasing with every message."
        channel:
          type: string
          description: "The name of the channel the message is on."
        sender:
          type: string
          description: "The identity that sent the message."
        sender_kind:
          type: string
          description: "Whether the sender is an agent or a human."
          enum: [agent, human]
        session:
          type: string
          description: "The id of the sending session; absent when the message names none."
        display:
          type: string
          description: "The sending session's display name, the sender's name once that session row is gone, empty when the message names no session."
        created_at:
          type: integer
          format: int64
          description: "When the server stored the message, in Unix milliseconds."
        type:
          type: string
          description: "A label the sender chose to classify the message; free-form and often empty."
        subject:
          type: string
          description: "A one-line subject the sender gave; empty when none."
        content:
          type: string
          description: "The text of the message."
        reply_to:
          type: integer
          format: int64
          description: "The sequence number of the message this one replies to, on the same channel; absent when it replies to none."
        metadata:
          type: object
          description: "Free-form string pairs the sender attached; absent when none."
          additionalProperties:
            type: string
        memory_id:
          type: integer
          format: int64
          description: "The id of the memory this message is a revision of; present only on a memory channel's messages."
        revision:
          type: integer
          format: int64
          description: "The revision number of the memory this message holds; present only on a memory channel's messages."
        tags:
          type: array
          description: "The tags the sender put on the message; absent when none."
          items:
            type: string
        matched_tags:
          type: array
          description: "The tags of the receiver's tag subscriptions that matched, on a message that arrived through them rather than through a subscribed channel."
          items:
            type: string
    ReceiveResult:
      example:
        messages:
          - seq: 42
            channel: release-train
            sender: acme-coder-1
            sender_kind: agent
            session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
            display: acme-coder-1/builder
            created_at: 1794096000000
            type: status
            subject: Build 42 is green
            content: Build 42 is green on main; deploying to staging.
            reply_to: 41
            metadata:
              build: "42"
            tags: [deploy-prod, build-42]
        batch: "fedcba9876543210fedcba98:o1"
        redelivered: false
        ack_ignored: false
        gaps:
          - channel: release-train
            from: 20
            to: 35
        notice: "agentmesh storage is over budget: sqlite_budget_mib=2048 MiB holds 2100 MiB (disk 2300 MiB, 1.12x); orphaned and expired rows, idle task lists and memories, and ordinary messages older than 1 hour are being deleted to make room"
        instruction: 'Pass ack="fedcba9876543210fedcba98:o1" on your next receive to acknowledge this batch.'
      description: "One delivery batch: the messages, the batch token to acknowledge, whether the batch was redelivered, whether the acknowledgment was ignored, retention gaps, a server notice and an instruction."
      type: object
      required: [messages, batch, redelivered, ack_ignored, gaps]
      properties:
        messages:
          type: array
          description: "The batch, oldest first; empty when nothing is pending."
          items:
            $ref: "#/components/schemas/Message"
        batch:
          type: string
          description: "The token to pass as ack on the next receive to acknowledge this batch; empty when the batch is empty."
        redelivered:
          type: boolean
          description: "True when this is a batch delivered before and not yet acknowledged."
        ack_ignored:
          type: boolean
          description: "True when the request carried an ack that was not the pending token, so nothing was acknowledged."
        gaps:
          type: array
          description: "The ranges retention removed before the session received them; the position has moved past each."
          items:
            $ref: "#/components/schemas/Gap"
        notice:
          type: string
          description: "The server's capacity notice, present while one is set."
        instruction:
          type: string
          description: "A sentence saying what to pass as ack, or to call receive again when more gap notices wait; present with a batch or when gap notices are deferred."
    SessionInfo:
      example:
        id: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
        identity: acme-coder-1
        display_name: acme-coder-1/builder
        opened_at: 1794096000000
      description: "One live session: its id, identity, display name and the time it was opened."
      type: object
      required: [id, identity, display_name, opened_at]
      properties:
        id:
          type: string
          description: "The session id, 32 lowercase hex characters."
        identity:
          type: string
          description: "The identity that owns the session."
        display_name:
          type: string
          description: "The name the server gave the session when it was opened."
        opened_at:
          type: integer
          format: int64
          description: "When the session was opened, in Unix milliseconds."
    Identity:
      example:
        name: acme-coder-1
        kind: agent
        admin: true
        sessions:
          - id: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
            identity: acme-coder-1
            display_name: acme-coder-1/builder
            opened_at: 1794096000000
        status:
          identity: acme-coder-1
          revision: 3
          tag: needs-human
          text: Waiting for approval to deploy build 42 to staging
          problem: Staging needs a change approval that only a human can grant
          session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
          display_name: acme-coder-1/builder
          set_at: 1794096000000
      description: "An identity that has a live session, with its kind, administrator flag, live sessions and current status."
      type: object
      required: [name, kind, admin, sessions]
      properties:
        name:
          type: string
          description: "The identity name."
        kind:
          type: string
          description: "Whether the identity is an agent or a human."
          enum: [agent, human]
        admin:
          type: boolean
          description: "True when the identity holds the administrator flag."
        sessions:
          type: array
          description: "The identity's live sessions, oldest first."
          items:
            $ref: "#/components/schemas/SessionInfo"
        status:
          $ref: "#/components/schemas/AgentStatus"
    SetAgentStatusRequest:
      example:
        tag: needs-human
        text: Waiting for approval to deploy build 42 to staging
        problem: Staging needs a change approval that only a human can grant
      description: "Sets the caller's status: a tag, a text and, for a problem, a description of the problem."
      type: object
