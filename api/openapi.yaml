  /v1/search:
    get:
      operationId: search
      summary: "Search the messages of the channels the caller may read"
      tags: [messages]
      description: >-
        Searches the messages of the channels the caller may read, or of the one
        channel named (which must exist and be readable: 404 not_found, 403
        forbidden). q is required: words are ANDed, word* matches a prefix and a
        double-quoted run is a phrase; a query with no word is 400 validation. Text
        matching looks at the subject and the content. mode is text, semantic (the
        embedded memories, ranked by similarity) or both (text and semantic merged
        by reciprocal rank fusion); absent it is both where the server has an
        embedding provider, else text. When semantic or both cannot use the
        provider, the hits are the text matches and semantic_unavailable is true.
        since and until bound created_at (Unix milliseconds, inclusive), sender and
        thread narrow the matches, and tags keeps messages whose tags satisfy every
        pattern. A page holds count hits (default 100, at most 1000), cut to
        result_default_kib; next names the following page and is passed back as
        cursor. Any registered identity, over the channels its ACL's read permission
        covers. Side effects: records an access time on the memories among the hits
        (a memory's expiry counts from it); no message is written. No idempotency
        key: a search has nothing to repeat. Source: spec 5.4, ADR 0008.
      parameters:
        - name: q
          example: build 42
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
          description: >-
            The query, required in practice (an absent or blank q is 400 validation): words that must all match, word* for a prefix and a double-quoted phrase. At most 1024 code points.
        - name: mode
          description: "text matches the subject and content, semantic ranks the embedded memories by similarity, both merges the two; default: both where the server has an embedding provider, else text"
          example: text
          in: query
          required: false
          schema:
            type: string
            enum: [text, semantic, both]
        - name: channel
          example: release-train
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: >-
            Search this channel only; it must exist and the caller must be able to read it. Absent: every channel the caller may read. At most 128 bytes (the server counts bytes).
        - name: sender
          example: acme-coder-1
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: >-
            Only messages sent by this identity. At most 128 bytes (the server counts bytes).
        - name: since
          description: "Only messages created at or after this time, in milliseconds since the Unix epoch"
          example: 1794096000000
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: until
          description: "Only messages created at or before this time, in milliseconds since the Unix epoch"
          example: 1825632000000
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: thread
          description: "Only the message with this sequence number and the replies to it"
          example: 41
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: tags
          example: [deploy-prod]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: >-
            Only messages whose tags satisfy every pattern, each pattern matching one of the message's tags; a pattern is a tag, or a tag prefix followed by an asterisk. Comma separated. At most 10 items.
        - name: count
          example: 20
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1000
            x-go-type: int
          description: >-
            The most hits in a page; absent or 0 means 100. At most 1000.
        - name: cursor
          example: "0000000000000000041"
          in: query
          required: false
          schema:
            type: string
            maxLength: 19
            pattern: ^[0-9]+$
          description: >-
            Where the page starts: the next member of the previous page's result, a decimal offset into the ranked hits; absent starts at the first hit, and an offset past the last hit returns no hits. At most 19 code points (digits).
      responses:
        "200":
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
              example:
                hits:
                  - message:
                      seq: 42
                      channel: release-train
                      sender: acme-coder-1
                      sender_kind: agent
                      session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                      display: acme-coder-1/builder
                      created_at: 1794096000000
                      type: status
                      subject: Build 42 is green
                      content: Build 42 is green on main; deploying to staging.
                      reply_to: 41
                      metadata:
                        build: "42"
                      tags: [deploy-prod, build-42]
                    score: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/memories/{id}:
    get:
      operationId: getMemory
      summary: "Read a memory's live revision"
      tags: [memories]
      description: >-
        Returns the live revision of a memory as a message with memory_id and
        revision set. A memory is a message on a channel of kind memory; its id is the
        sequence number of its first revision and stays the same through every edit.
        Needs read on the memory's channel (the channel ACL's read permission): without
        it 403 forbidden; an id with no live revision, or whose channel lies outside a
        scoped caller's scope, is 404 not_found. Side effects: moves the memory's access
        time to now (a memory's expiry counts from it). The id may also be a task's id (a
        task is a memory on a task list): the answer is then the task's live row as
        a message and no access time moves; getTask returns the task itself. No
        idempotency key: reading again returns whatever revision is then live.
        Source: spec 3.2, Decision 95, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                seq: 42
                channel: release-notes
                sender: acme-coder-1
                sender_kind: agent
                session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                display: acme-coder-1/builder
                created_at: 1794092400000
                type: note
                subject: Release notes 2026.11
                content: "Release notes for 2026.11: build 42 is green on main."
                memory_id: 42
                revision: 1
                tags: [release]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteMemory
      summary: "Delete a memory"
      tags: [memories]
      description: >-
        Deletes a memory: its live revision is tombstoned and its embedding and access
        record are dropped (earlier revisions were tombstoned by the edits that replaced
        them). Needs write on the memory's channel (the channel ACL's write
        permission): without it 403 forbidden; an id with no live revision, or whose
        channel lies outside a scoped caller's scope, is 404 not_found; an id on a task
        list is 400 validation (tasks are deleted with updateTask). The caller's rate
        limit counts one operation and no bytes: 429 rate_limited with Retry-After.
        Side effects: tombstones the revision and removes its embedding; no
        subscriber is woken. Idempotency-Key: a repeat with the same key and the same
        memory returns 204 and deletes nothing more; the same key for another memory is
        409 conflict. Source: spec 3.2 and 3.4, Decision 46, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Memory deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/memories/{id}/revisions:
    get:
      operationId: listMemoryRevisions
      summary: "List a memory's revisions"
      tags: [memories]
      description: >-
        Lists every revision of a memory, oldest first by revision number, tombstoned
        ones included, each as a message with memory_id and revision set; the newest
        is the live one unless the memory was deleted. Needs read on the memory's
        channel (the channel ACL's read permission): without it 403 forbidden; an id
        with no revision at all, or whose channel lies outside a scoped caller's scope,
        is 404 not_found. The id may also be a task's id: the answer is then the
        task's rows (one per revision) as messages; getTask returns the task itself.
        Writes nothing and does not move the access time. No idempotency key: a
        read has nothing to repeat. Source: spec 3.2, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Every revision, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
              example:
                - seq: 42
                  channel: release-notes
                  sender: acme-coder-1
                  sender_kind: agent
                  session: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
                  display: acme-coder-1/builder
                  created_at: 1794092400000
                  type: note
                  subject: Release notes 2026.11
                  content: "Release notes for 2026.11: build 42 is green on main."
                  memory_id: 42
                  revision: 1
                  tags: [release]
                - seq: 43
                  channel: release-notes
                  sender: acme-coder-1
                  sender_kind: agent
                  display: ""
                  created_at: 1794096000000
                  type: note
                  subject: Release notes 2026.11
                  content: "Release notes for 2026.11: build 42 is green on main; staging deploy approved."
                  memory_id: 42
                  revision: 2
                  tags: [release]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: editMemory
      summary: "Write a new revision of a memory"
      tags: [memories]
      description: >-
        Writes the next revision of a memory: the live revision is tombstoned and its
        embedding dropped, and a new message is appended with the next revision number.
        Each of subject, content, type, metadata and tags that the request leaves out
        keeps the live value, and a present empty subject, type, metadata or tags
        clears it; an empty content is 400 validation (delete the memory instead), as
        is a request with no field, a merged message above max_message_kib and a
        memory on a task list. if_revision, when given, must equal the live revision
        (409 conflict otherwise); absent, the edit is not conditional. Needs write on
        the memory's channel (the channel ACL's write permission): without it 403
        forbidden; an id with no live revision, or whose channel lies outside a scoped
        caller's scope, is 404 not_found. A request body above the server's limit is
        413 payload_too_large. The sender's rate limit (send_messages_per_second and
        send_kib_per_second) answers 429 rate_limited with Retry-After. When a write
        inspector is configured the merged record is judged first: a refusal is 422
        inspection_rejected, and an inspector that cannot answer is 503 unavailable
        under inspection_on_failure closed. Side effects: tombstones the old revision,
        appends the new one, moves the access time, wakes the watches of the channel's
        subscribers and queues the memory for embedding. Idempotency-Key: a repeat with
        the same key and body returns the first answer and writes nothing; the same key
        with a different body is 409 conflict. Source: spec 3.2 and 3.4, Decision 46,
        ADR 0008, ADR 0013.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The fields of the new revision (absent keeps the live value, empty clears it) and the revision the edit expects"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMemoryRequest"
      responses:
        "201":
          description: New revision appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/tasks:
    post:
      operationId: createTask
      summary: "Create a task on a channel's task list"
      tags: [tasks]
      description: >-
        Adds a task to a task list (a channel of kind tasks; any other kind is 400
        validation) and returns it. The task starts pending with no owner. The
        subject is 1 to 256 characters without control characters. parent, when given,
        and every id in blocked_by must be a live task of the same list (400
        validation); duplicate blockers collapse. before or after (not both) names a sibling to
        place the task next to, else it goes last among its parent's children. Needs
        write on the list (the channel ACL's write permission): without it 403
        forbidden; a list that does not exist or lies outside a scoped caller's scope
        is 404 not_found. A request body above the server's limit is 413
        payload_too_large, a task document above max_message_kib is 400 validation,
        and the sender's rate limit answers 429 rate_limited with Retry-After. When a
        write inspector is configured the subject, description and metadata are judged
        first: a refusal is 422 inspection_rejected, and an inspector that cannot
        answer is 503 unavailable under inspection_on_failure closed. Side effects:
        appends the task as the first revision of a new memory on the list and wakes
        the watches of its subscribers. Idempotency-Key: a repeat with the same key and
        body returns the first task and creates nothing; the same key with a different
        body is 409 conflict. Source: spec 3.2 and 3.4, Decision 81, Decision 90,
        ADR 0009.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The task's subject and description, its place in the list (parent, before or after a sibling), blockers and metadata"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 42
                channel: release-tasks
                revision: 1
                subject: Cut release 2026.11
                description: Tag main, build the archives and publish them.
                status: pending
                parent: 41
                rank: V
                blocked_by: [40]
                metadata:
                  ticket: REL-142
                blocked: false
                updated_at: 1794092400000
                updated_by: acme-coder-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listTasks
      summary: "List a channel's tasks, optionally filtered by status or owner"
      tags: [tasks]
      description: >-
        Lists the live tasks of a task list in tree order (each parent followed by its
        children, siblings by rank, then id) as summaries, optionally only those with
        one status or one owner; the depth of a task counts the whole list even when a
        filter hides its ancestors. An unknown status is 400 validation. Needs read on
        the list (the channel ACL's read permission): without it 403 forbidden; a list
        that does not exist or lies outside a scoped caller's scope is 404 not_found,
        and a channel that is not a task list is 400 validation. The result is cut to
        result_default_kib. Side effects: a task found abandoned (in_progress with its
        lease run out or with an owner who has no live session) is first returned to
        pending with its owner and lease cleared, the reclaimed_from and reclaimed_at
        members marking it (ADR 0009, decisions of 2026-11-05), and the list's read
        time is recorded at most once an hour. No idempotency key: a read has nothing
        to repeat. Source: spec 3.2, Decision 90, ADR 0009.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - name: status
          example: in_progress
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
          description: >-
            Only tasks with this status; absent lists every status. At most 256 code points. One of pending, in_progress, completed; any other value answers validation.
        - name: owner
          example: acme-coder-1
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: >-
            Only tasks owned by this identity; absent lists every owner. At most 128 bytes (the server counts bytes).
      responses:
        "200":
          description: Task summaries in tree order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskSummary"
              example:
                - id: 42
                  subject: Cut release 2026.11
                  status: in_progress
                  owner: acme-coder-1
                  parent: 41
                  depth: 1
                  leased_until: 1794182400000
                  has_details: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tasks/{id}:
    get:
      operationId: getTask
      summary: "Read a task"
      tags: [tasks]
      description: >-
        Returns one task with its derived members (blocked and open_blockers). Needs
        read on the task's list (the channel ACL's read permission): without it 403
        forbidden; an id with no live revision, or whose list lies outside a scoped
        caller's scope, is 404 not_found, as is an id that is not a task. Side effects:
        a task found abandoned (in_progress with its lease run out or with an owner who
        has no live session) is first returned to pending with its owner and lease
        cleared and reclaimed_from and reclaimed_at set (ADR 0009, decisions of
        2026-11-05), so the answer shows the reclaimed task, and the list's read time is
        recorded at most once an hour. No idempotency key: a read has nothing to repeat.
        Source: spec 3.2, Decision 90, ADR 0009.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 42
                channel: release-tasks
                revision: 2
                subject: Cut release 2026.11
                description: Tag main, build the archives and publish them.
                status: in_progress
                owner: acme-coder-1
                parent: 41
                rank: V
                blocked_by: [40]
                leased_until: 1794182400000
                metadata:
                  ticket: REL-142
                blocked: false
                updated_at: 1794096000000
                updated_by: acme-coder-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: updateTask
      summary: "Update a task: absent fields stay unchanged"
      tags: [tasks]
      description: >-
        Changes a task; every member the request leaves out stays as it is. status
        is pending, in_progress or completed (anything else is 400 validation): a
        completed task needs the status pending before it can be in_progress again, an
        in_progress task always has an owner (400 validation), moving a task to
        in_progress while a blocker is open is 409 conflict, completed takes the caller
        as owner when there is none, and a move into pending clears the owner (unless
        the patch sets one) and the lease. An owner must be a registered identity the caller can
        see (404 not_found otherwise). leased_until must be in the future or 0, and
        only an in_progress task keeps a lease. metadata merges into the task's and a
        value that is empty removes its key. add_blocked_by and remove_blocked_by
        change the blockers, parent moves the task and before or after (not both)
        places it among its siblings. delete removes the task and cannot be combined
        with another change (400 validation); a task with subtasks cannot be deleted
        (409 conflict). A change that alters nothing writes nothing and answers the
        current task with replaced 0. There is no owner guard: anyone with write on the
        list may update any task, whoever owns it. Needs write on the list (the channel
        ACL's write permission): without it 403 forbidden; an id with no live revision,
        or whose list lies outside a scoped caller's scope, is 404 not_found, as is an
        id that is not a task. An abandoned target is first returned to pending (ADR
        0009), in the same transaction, so a refused patch undoes the reclaim. A request
        body above the server's limit is 413 payload_too_large and the sender's rate
        limit answers 429 rate_limited with Retry-After. When a write inspector is
        configured and the patch changes the subject, description or metadata, the new
        values are judged first: a refusal is 422 inspection_rejected, and an inspector
        that cannot answer is 503 unavailable under inspection_on_failure closed. Side
        effects: tombstones the live revision and appends the next one and wakes the
        watches of the list's subscribers; a delete tombstones the task and appends no
        revision of its own. Idempotency-Key: a repeat with the same key and body returns the
        first answer and writes nothing; the same key with a different body is 409
        conflict. Source: spec 3.2 and 3.4, Decision 81, Decision 90, ADR 0009.
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The fields to change (absent fields are unchanged), including status, owner, placement, blockers, lease and deletion"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The updated task.
          content:
