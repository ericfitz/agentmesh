        Returns the size of the stored data against the budget of the server's engine
        (sqlite_budget_mib on SQLite, postgres_budget_mib on Postgres): bytes (the enforced
        measure), the budget, the physical disk size and its ratio to bytes, the pressure
        tier and, when the budget sweep has set one, the capacity notice text. Administrator
        only. Any other caller gets 403 forbidden. Writes nothing: the tier is computed at
        read time. No idempotency key: a read has nothing to repeat. Source: spec 3.2,
        Decision 48, ADR 0004.
