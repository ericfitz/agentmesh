  /v1/auth/token:
    post:
      operationId: token
      summary: "Exchange a client assertion or a subject token for a bearer (RFC 6749, RFC 8693)"
      tags: [auth]
      security: []
      description: >-
        Exchanges a credential for a short-lived bearer; every refusal is an RFC
        6749 section 5.2 body, not a problem document. The client_credentials grant
        is the RFC 7523 private_key_jwt flow: the client assertion's iss and sub are
        the identity, its aud is this server's issuer URL (the token endpoint URL is
        still accepted), its header carries a kid and an alg of EdDSA or ES256, and
        its exp is at most five minutes ahead (plus 60 seconds of clock skew). The
        bearer's lifetime is token_lifetime_seconds (default 3600). The assertion's
        jti is single-use per identity across replicas, so a replayed assertion is
        invalid_client. The token-exchange grant (RFC 8693) trades an access token
        of a configured external issuer, never an ID token, for a human bearer whose
        lifetime is the issuer's human lifetime (default 900 seconds); a first
        sign-in creates the human's identity. A server without a token issuer
        answers 503 temporarily_unavailable. Open operation. The caller has no
        bearer yet. Side effects: the client_credentials grant records the
        assertion's jti and nothing else; the exchange may create the human identity
        and its binding. No idempotency key: the call precedes an identity, and its
        replay protection is the single-use jti, so repeating a request needs a new
        assertion. Source: spec 4.1, Decisions 19, 70, 84.
      requestBody:
        description: "A form-encoded token request: a client assertion (RFC 7523) or a subject token to exchange (RFC 8693)"
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: A short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "413":
          $ref: "#/components/responses/OAuthError"
        "500":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /v1/auth/jwks:
    get:
      operationId: jwks
      summary: "The public keys that verify the bearers this server issues"
      tags: [auth]
      security: []
      description: >-
        Returns the public keys that verify the bearers this server issues: the
        active signing key and any retiring key that still verifies bearers it
        signed, each as a JWK with its kid. A server without a token issuer answers
        503 unavailable. Open operation. Writes nothing. No idempotency key: a read
        has nothing to repeat. Source: ADR 0012, Decision 70.
      responses:
        "200":
          description: The public keys that verify tokens this server issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/register:
    post:
      operationId: register
      summary: "Register an identity's public key, with an enrollment token where registration is by enrollment"
      tags: [auth]
      security: []
      description: >-
        Binds a public key to an identity name and, when the name is new, creates
        the identity and subscribes it to the general channel at the current head.
        The server's registration setting decides, never the request: open (trust on
        first use, the default on a loopback or Unix-socket listener) lets anyone
        claim a name that has no credential, and enrollment (the default on any
        other listener) requires an enrollment token, which a host administrator
        creates. A keyless administrator row (after reset-credential) needs an enrollment token even in open mode. A name that already has a credential cannot take another key (409
        conflict; a lost credential is recovered with the host command
        reset-credential), a scoped identity registers only with the enrollment
        token bound to it, and a human identity cannot register (403). Registering
        the same key again changes nothing, consumes no token and answers success
        with created false, so a client whose response was lost can retry. Open
        operation. The caller has no credential yet. Side effects: creates the
        identity and its key; consumes one use of the enrollment token when one is
        given. No idempotency key: receipts are per identity and the caller has none
        yet, and a repeat with the same key is safe by construction. Source: spec
        4.2, Decisions 20, 58, 72.
      requestBody:
        description: "The identity, its public key as a JWK and, where registration is by enrollment, the enrollment token"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/reset:
    post:
      operationId: adminReset
      summary: "Reset the store (an administrator's reset)"
      tags: [admin]
      parameters:
        - name: scope
          description: "data keeps identities and keys; everything removes them too; default: data"
          in: query
          required: false
          schema:
            type: string
            enum: [data, everything]
            default: data
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: The server's data was reset.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
