          maxLength: 1024
          description: At most 1024 bytes.
        subject_token:
          type: string
          maxLength: 16384
          description: At most 16384 bytes.
        subject_token_type:
          type: string
          maxLength: 1024
          description: At most 1024 bytes.
        requested_token_type:
          type: string
          maxLength: 1024
          description: At most 1024 bytes.
        audience:
