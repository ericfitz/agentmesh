    EditMemoryRequest:
      type: object
      description: >-
        Every field is optional and an omitted field keeps the live revision's
        value; a present empty subject, type, metadata or tags clears it.
        Content cannot be cleared (an empty content is a validation error).
        A request with no field is a validation error.
      additionalProperties: false
      properties:
        if_revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision the caller read; the edit fails with conflict if the live revision differs.
          maximum: 9223372036854775807
        subject:
          type: string
          maxLength: 200
          description: At most 200 code points.
        content:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        type:
          type: string
          maxLength: 256
          description: At most 256 code points.
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
        tags:
          type: array
          items:
            type: string
            maxLength: 32
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$
            description: >-
              At most 32 code points of letters, digits and hyphen with one optional colon; the server lowercases tags.
          maxItems: 10
          description: At most 10 items.
