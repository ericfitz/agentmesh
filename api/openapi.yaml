openapi: 3.1.0
info:
  title: agentmesh
  version: 1.0.0
  description: >-
    The agentmesh HTTP API (spec section 3, Decision 65). Path parameters: a
    client percent-encodes every path parameter exactly once (a space is %20,
    a percent sign %25, a slash inside a name %2F, a question mark %3F, a
    number sign %23); the server decodes each parameter exactly once, so a
    channel name such as 100% or a%2Fb round-trips as the literal name and an
    empty segment matches no route. Optional members are absent from the JSON,
    never null. Every error is application/problem+json.
security:
  - bearerAuth: []
tags:
  - name: discovery
  - name: health
  - name: sessions
  - name: channels
  - name: messages
  - name: memories
  - name: tasks
  - name: admin
  - name: auth
paths:
  /.well-known/agentmesh:
    get:
      operationId: wellKnown
      tags: [discovery]
      security: []
      responses:
        "200":
          description: Pointer to the versioned discovery endpoint (Decision 43).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /.well-known/oauth-authorization-server:
    get:
      operationId: authorizationServerMetadata
      tags: [discovery]
      security: []
      responses:
        "200":
          description: >-
            OAuth 2.0 authorization server metadata (RFC 8414). The same
            document is served at /.well-known/openid-configuration for
            existing clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /.well-known/openid-configuration:
    get:
      operationId: openidConfiguration
      tags: [discovery]
      security: []
      responses:
        "200":
          description: >-
            The same document as /.well-known/oauth-authorization-server. It
            is kept for existing clients. The server is not an OpenID Provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/discover:
    get:
      operationId: discover
      tags: [discovery]
      security: []
      responses:
        "200":
          description: Server versions, capabilities and auth methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/health:
    get:
      operationId: health
      tags: [health]
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The health document, as the caller's tier may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions:
    post:
      operationId: openSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
      responses:
        "201":
          description: Session opened or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}:
    delete:
      operationId: closeSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Session closed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/receive:
    post:
      operationId: receive
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveRequest"
      responses:
        "200":
          description: A batch of pending messages (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/watch:
    get:
      operationId: watch
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
            maximum: 9223372036854775807
        - name: timeout
          in: query
          required: false
          description: >-
            Seconds to wait; fractional allowed; 0 or absent means the server cap. At most 240 seconds, the largest value of watch_max_seconds; above the configured watch_max_seconds the server waits at most that long.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 240
        - name: include_own
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Woke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wake"
        "204":
          description: Timed out, nothing new.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/peek:
    get:
      operationId: peek
      tags: [sessions]
      description: Read-only pending counts above the watch floor. Writes nothing (no lease renewal, no cursor, no watch row, no receipt).
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: include_own
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The pending counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Peek"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/identities:
    get:
      operationId: listIdentities
      tags: [sessions]
      responses:
        "200":
          description: Registered identities and their open sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session}/status:
    post:
      operationId: setAgentStatus
      tags: [sessions]
      description: >-
        Sets the calling agent's status from one of its live sessions. Only
        an agent sets a status, and only its own.
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAgentStatusRequest"
      responses:
        "200":
          description: The stored status revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/agent-statuses:
    get:
      operationId: listAgentStatuses
      tags: [sessions]
      description: >-
        Every visible identity with a stored status, by identity. An entry
        whose identity has no live session reads tag offline, with last_tag
        the stored tag.
      responses:
        "200":
          description: The current statuses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentStatusEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/identities/{identity}/statuses:
    get:
      operationId: agentStatusHistory
      tags: [sessions]
      description: >-
        One identity's status revisions, oldest first, at most
        status_history_count.
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
            maxLength: 384
          description: >-
            At most 384 characters: the percent-encoded length (the server counts 128 decoded bytes).
      responses:
        "200":
          description: The stored revisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      responses:
        "200":
          description: Channels the caller holds an ACL entry on; a server administrator sees every channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createChannel
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}:
    delete:
      operationId: deleteChannel
      tags: [channels, admin]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Channel deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: renameChannel
      tags: [channels, admin]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameChannelRequest"
      responses:
        "204":
          description: Channel renamed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/acl:
    get:
      operationId: getACL
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
      responses:
        "200":
          description: The channel access control list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ACLEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setACL
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ACLEntry"
              maxItems: 256
              description: At most 256 items.
      responses:
        "204":
          description: ACL replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/subscription:
    put:
      operationId: subscribe
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "204":
          description: Subscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unsubscribe
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tag-subscriptions:
    get:
      operationId: listTagSubscriptions
      tags: [channels]
      responses:
        "200":
          description: The caller's tag subscriptions, each a set of patterns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: subscribeTags
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatterns"
      responses:
        "204":
          description: Subscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unsubscribeTags
      tags: [channels]
      parameters:
        - name: pattern
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: At most 10 items.
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/messages:
    post:
      operationId: sendMessage
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "201":
          description: Message appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: history
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - name: before
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 10000
            x-go-type: int
          description: >-
            At most 10000, the largest value of receive_max_count; above the configured receive_max_count the server returns at most that many.
        - name: thread
          in: query
          required: false
          description: Only the message with this sequence number and the messages whose reply_to is it.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: At most 10 items.
      responses:
        "200":
          description: Messages of the channel.
          content:
