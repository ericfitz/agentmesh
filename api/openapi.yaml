        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
    ChannelInfo:
      example:
        name: acme-ops
        kind: ordinary
        capabilities: [bridged]
        creator: acme-coder-1
        scope: acme
        created_at: 1794096000000
      description: "The creator's view of a channel on creation and the administrator's view on status: name, kind, capabilities, creator, scope and creation time."
      type: object
      required: [name, kind, creator, created_at, capabilities]
      properties:
        name:
          type: string
          description: "The channel name: 1 to 128 bytes, no slash."
        kind:
          type: string
          enum: [ordinary, memory, tasks]
          description: "ordinary (the default) carries messages; memory makes every message a memory that agents read with search and getMemory; tasks is a task list managed with the task operations, and send is refused on it."
        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
