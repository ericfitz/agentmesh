          description: "The task's one-line title: 1 to 256 characters, no control characters."
        description:
          type: string
          description: "The task's longer text; absent when empty."
        status:
          type: string
          description: "pending, in_progress or completed. A new task is pending, a claim makes it in_progress, and a completed task needs the status pending before it can be in_progress again."
        owner:
          type: string
          description: "The identity working on the task; absent while nobody owns it. An in_progress task always has one."
        parent:
          type: integer
          format: int64
          description: "The id of the parent task, a task of the same list; absent for a task at the top of the list."
        rank:
