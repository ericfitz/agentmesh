        text:
          type: string
          description: "The one line the agent set."
        problem:
          type: string
          description: "The problem line the agent set; absent when empty."
        session:
          type: string
          description: "The id of the session that set the status."
        display_name:
          type: string
          description: "The display name of that session when it set the status."
        set_at:
          type: integer
          format: int64
          description: "When the status was set, in Unix milliseconds."
    AgentStatusEntry:
      example:
        identity: acme-coder-1
        kind: agent
        live: true
        status:
