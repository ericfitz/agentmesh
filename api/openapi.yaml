          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: At most 10 items.
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1000
            x-go-type: int
          description: At most 1000.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 19
            pattern: ^[0-9]+$
          description: At most 19 code points (digits).
