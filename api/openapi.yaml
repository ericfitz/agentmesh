  /v1/channels:
    get:
      operationId: listChannels
      summary: "List the channels the caller may see"
      tags: [channels]
      description: >-
        Lists the channels the caller may list, by name in byte order, each with its
        kind and its capabilities (bridged: a live Slack bridge). A channel is
        listed when the caller holds a stored ACL entry on it, for its own name,
        everyone, admins (an administrator) or humans (a human), whatever
        permissions the entry grants; a server administrator lists every channel,
        and a scoped agent lists only channels of its scope. The channel ACL's list
        action. Writes nothing. No idempotency key: a read has nothing to repeat.
        Source: ADR 0011.
      responses:
        "200":
          description: Channels the caller holds an ACL entry on; a server administrator sees every channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
              example:
                - name: general
                  kind: ordinary
                  capabilities: []
                - name: release-notes
                  kind: memory
                  capabilities: []
                - name: release-train
                  kind: ordinary
                  capabilities: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createChannel
      summary: "Create a channel"
      tags: [channels]
      description: >-
        Creates a channel of kind ordinary (the default), memory or tasks, with the
        caller as its creator. The ACL is the one in the request; absent, it is the
        configured default_acl (shipped: everyone read and write, the creator read,
        write and admin, admins admin); an empty array stores no entries. There is
        no implicit creator entry, so an ACL that leaves out the caller leaves it
        without access. Every named identity must be a registered identity the
        caller can see, or one of the groups everyone, admins and humans; an entry
        with no permission or an unknown one is 400 validation. Any registered
        identity may create while channel_creation is open (the default); only an
        administrator when it is admins (403 forbidden). scope: only an
        administrator may name one, and it must exist and not be done (unknown or
        retired 404 not_found, done 409 conflict); otherwise the channel takes the
        caller's scope. A scoped agent's channel names must be <scope>-<rest> (an
        administrator who names a scope is exempt from the prefix), and no channel
        outside scope S may take a name starting S- (400 validation). A name
        already taken is 409 conflict. Side effects: inserts the channel and its ACL rows.
        Idempotency-Key: a repeat with the same key and body returns the first
        answer. Source: spec 3.2 and 4.6, ADR 0008, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The channel's name and kind, its ACL (absent: the configured default) and, for an administrator, its scope"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}:
    delete:
      operationId: deleteChannel
      summary: "Delete a channel"
      tags: [channels]
      description: >-
        Deletes a channel; its ACL, subscriptions, cursors and messages go with it,
        and subscribers do not block it. Needs admin on the channel (the channel
        ACL's admin permission, which administrators hold everywhere): without it
        403 forbidden, and a channel that does not exist or lies outside a scoped
        caller's scope is 404 not_found. The general channel cannot be deleted (400
        validation), and a channel whose Slack bridge is live or being created is
        409 conflict until the bridge is removed. Side effects: removes the rows
        above. Idempotency-Key: a repeat with the same key and body returns the
        first answer. Source: ADR 0008, ADR 0009, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Channel deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      operationId: renameChannel
      summary: "Rename a channel"
      tags: [channels]
      description: >-
        Renames a channel; its id stays, so subscriptions, cursors and messages stay
        with it. Needs admin on the channel (the channel ACL's admin permission,
        which administrators hold everywhere): without it 403 forbidden, and a
        channel that does not exist or lies outside a scoped caller's scope is 404
        not_found. The general channel cannot be renamed (400 validation), and a
        channel whose Slack bridge is live or being created is 409 conflict. The new
        name follows the creation rules: 1 to 128 bytes without a slash,
        <scope>-<rest> for a scoped agent (an administrator is exempt from the
        prefix) and never a name starting with another scope's prefix (400
        validation); a name another channel holds is 409 conflict. Side effects: changes the name. Idempotency-Key: a repeat with the
        same key and body returns the first answer. Source: ADR 0008, ADR 0009, ADR
        0011.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The channel's new name"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameChannelRequest"
      responses:
        "204":
          description: Channel renamed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/acl:
    get:
      operationId: getACL
      summary: "Read a channel's access control list"
      tags: [channels]
      description: >-
        Returns the channel's ACL entries in the order they were stored. Needs admin
        on the channel (the channel ACL's admin permission, which administrators
        hold everywhere), because the list names who may read the channel: without
        it 403 forbidden, and a channel that does not exist or lies outside a scoped
        caller's scope is 404 not_found. Writes nothing. No idempotency key: a read
        has nothing to repeat. Source: spec 4.6, ADR 0008, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
      responses:
        "200":
          description: The channel access control list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ACLEntry"
              example:
                - identity: acme-coder-1
                  permissions: [read, write, admin]
                - identity: everyone
                  permissions: [read]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: setACL
      summary: "Replace a channel's access control list"
      tags: [channels]
      description: >-
        Replaces the channel's whole ACL with the entries given; an empty array
        removes every entry (administrators keep admin through their flag). Needs
        admin on the channel (the channel ACL's admin permission, which
        administrators hold everywhere). An agent that is not an administrator
        cannot take a permission away from a protected entry (everyone, admins,
        humans, a human or an administrator): 403 forbidden. Every named identity
        must be a registered identity the caller can see, or one of the groups
        everyone, admins and humans, else 400 validation; each entry holds 1 to 3 of
        read, write and admin. On a channel whose Slack bridge is live or being
        created only a server administrator may change the ACL (403 forbidden
        otherwise), and the bridge's rules apply: no everyone or humans entry, no
        read or write for admins, and the slack-bridge read entry stays. A channel
        that does not exist or lies outside a scoped caller's scope is 404
        not_found. Side effects: replaces the ACL rows and hints the channel's
        watchers, so an armed watch re-checks what its session may read.
        Idempotency-Key: a repeat with the same key and body returns the first
        answer. Source: spec 4.6, ADR 0008, ADR 0009, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The complete ACL that replaces the channel's; an agent that is not an administrator cannot remove a protected entry's permission"
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ACLEntry"
              maxItems: 256
              description: At most 256 items.
            example:
              - identity: acme-coder-1
                permissions: [read, write, admin]
              - identity: everyone
                permissions: [read]
      responses:
        "204":
          description: ACL replaced.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/subscription:
    put:
      operationId: subscribe
      summary: "Subscribe the caller to a channel"
      tags: [channels]
      description: >-
        Subscribes the caller's identity, and so every session of it, to a channel.
        from is now (the default: only messages after the newest sequence number at
        this moment) or oldest (from the oldest retained message); a subscription
        that already exists keeps its position, so a repeat changes nothing. Needs
        read on the channel (the channel ACL's read permission): without it 403
        forbidden, and a channel that does not exist or lies outside a scoped
        caller's scope is 404 not_found. An agent that subscribes to a memory
        channel gets 400 validation: agents find memories with search. Side effects:
        stores the subscription at its starting position; the channel's messages
        then arrive in receive and wake watch. Idempotency-Key: a repeat with the
        same key and body returns the first answer. Source: spec 4.4, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "Where the subscription starts: now (the default) or oldest"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "204":
          description: Subscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unsubscribe
      summary: "Remove the caller's subscription to a channel"
      tags: [channels]
      description: >-
        Removes the caller's subscription to a channel; not being subscribed is a
        no-op that still answers 204. No ACL permission is needed, so a reader whose
        read was revoked can always leave; only the scope gate applies, and a
        channel that does not exist or lies outside a scoped caller's scope is 404
        not_found. Side effects: deletes the subscription. Idempotency-Key: a repeat
        with the same key and body returns the first answer. Source: spec 4.4, ADR
        0008, ADR 0011.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/tag-subscriptions:
    get:
      operationId: listTagSubscriptions
      summary: "List the caller's tag subscriptions"
      tags: [channels]
      description: >-
        Lists the caller's tag subscriptions. Each is one set of patterns that all
        have to match (an AND set); a message is delivered when it satisfies any
        set. The patterns of a set are lowercase, sorted and without duplicates, and
        the sets come in the order of their keys. Any registered identity. Writes
        nothing. No idempotency key: a read has nothing to repeat. Source: spec 4.4
        and 4.5, ADR 0008.
      responses:
        "200":
          description: The caller's tag subscriptions, each a set of patterns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
                  example: [build-42, deploy-prod]
              example:
                - [build-42, deploy-prod]
                - [deploy-*]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: subscribeTags
      summary: "Add a tag subscription: one AND set of tag patterns"
      tags: [channels]
      description: >-
        Adds one tag subscription: a set of 1 to 10 patterns, each a tag or a prefix
        followed by an asterisk. A message matches the set when each pattern matches
        one of its tags, and is then delivered to the caller's sessions when it is on
        a channel the caller may read (an unfiltered receive marks it with
        matched_tags; a channel the caller is subscribed to delivers it anyway),
        except that an agent is never delivered a memory channel's messages (the
        Deliver action, Decision 20). The
        patterns are lowercased, sorted and deduplicated, and the subscription counts
        messages after the newest sequence number at this moment. Adding a set that
        exists is a no-op. Any registered identity. Side effects: stores the set.
        Idempotency-Key: a repeat with the same key and body returns the first
        answer. Source: spec 4.4 and 4.5, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "One AND set of tag patterns"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatterns"
      responses:
        "204":
          description: Subscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unsubscribeTags
      summary: "Remove a tag subscription: one AND set of tag patterns"
      tags: [channels]
      description: >-
        Removes one tag subscription, named by its set of patterns: repeat the
        pattern parameter once for each pattern. The patterns are normalized as
        subscribeTags does (lowercase, order and duplicates ignored), so the set is
        found however it is spelled; removing a set that does not exist is a no-op
        that still answers 204. Any registered identity. Side effects: deletes the
        set. Idempotency-Key: a repeat with the same key and body returns the first
        answer. Source: spec 4.4 and 4.5, ADR 0008.
      parameters:
        - name: pattern
          example: [deploy-*]
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: >-
            A pattern of the set to remove; repeat the parameter once for each pattern. A pattern is a tag, or a tag prefix followed by an asterisk, and the patterns together name the set exactly as subscribeTags stored it. At most 10 items.
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/channels/{channel}/messages:
    post:
      operationId: sendMessage
      summary: "Send a message to a channel"
      tags: [messages]
      description: >-
        Appends one message to a channel and returns its sequence number. Needs
        write on the channel (the channel ACL's write permission): without it 403
        forbidden, and a channel that does not exist or lies outside a scoped
        caller's scope is 404 not_found. content is required; the whole message may
        not exceed max_message_kib (default 64). The subject is trimmed and must be
        one line; tags are lowercased, deduplicated and sorted. A reply_to must name
        an existing message of the same channel (404 not_found, 400 validation); on
        a channel with a live Slack bridge a reply to a reply is stored as a reply
        to its thread root. A task list refuses messages (400 validation). session,
        when given, must be the caller's own live session: another identity's is 404
        not_found, a closed or lapsed one 410. On a memory channel the message
        becomes revision 1 of a new memory and memory_id is returned. The sender's
        rate limit (send_messages_per_second and send_kib_per_second, per identity)
        answers 429 rate_limited with Retry-After. When a write inspector is
        configured the content is judged first: a refusal is 422
        inspection_rejected, and an inspector that cannot answer is 503 unavailable
        under inspection_on_failure closed. Side effects: appends the message, wakes
        the watches of its subscribers and, on a memory channel, queues the memory
        for embedding. Idempotency-Key: a repeat with the same key and body returns
        the first answer and appends nothing; the same key with a different body is
        409 conflict. Source: spec 3.4 and 4.6, ADR 0008, ADR 0009, ADR 0013.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        description: "The message: content, with optional subject, type, tags, reply_to and metadata"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "201":
          description: Message appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: history
      summary: "Read a window of a channel's messages"
      tags: [messages]
      description: >-
        Reads messages of one channel, oldest first, in a window of sequence
        numbers. With before alone it returns the newest messages below it; with
        after alone, the first messages above it; with both, those strictly between;
        with neither, the oldest messages of the channel. At most count messages
        (default receive_default_count, 100; above receive_max_count the server
        returns at most that many), cut to result_default_kib; when the window holds
        more, the messages nearest before or after survive. thread keeps the message
        with that sequence number and the messages that reply to it; tags keeps the
        messages whose tags satisfy every pattern. Messages that retention removed
        or that were deleted are not returned. Needs read on the channel (the
        channel ACL's read permission): without it 403 forbidden, and a channel that
        does not exist or lies outside a scoped caller's scope is 404 not_found.
        Writes nothing and moves no cursor. No idempotency key: a read has nothing
        to repeat. Source: spec 3.2 and 4.6, ADR 0008.
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - name: before
          description: "Return messages with a sequence number below this one; alone, the newest messages below it (returned oldest first), together with after the exclusive upper end of the window"
          example: 50
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: after
          description: "Return messages with a sequence number above this one, oldest first; together with before the exclusive lower end of the window"
          example: 40
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: count
          example: 20
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 10000
            x-go-type: int
          description: >-
            The most messages to return; absent or 0 means receive_default_count (100 by default). At most 10000, the largest value of receive_max_count; above the configured receive_max_count the server returns at most that many.
        - name: thread
          example: 41
          in: query
          required: false
          description: Only the message with this sequence number and the messages whose reply_to is it.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: tags
          example: [deploy-prod]
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              maxLength: 33
              pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
              description: >-
                At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
            maxItems: 10
          description: >-
            Only messages whose tags satisfy every pattern, each pattern matching one of the message's tags; a pattern is a tag, or a tag prefix followed by an asterisk. Comma separated. At most 10 items.
      responses:
        "200":
          description: Messages of the channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
              example:
                - seq: 41
                  channel: release-train
                  sender: acme-coder-1
