        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token (RFC 9068, typ at+jwt) issued by the authorization
        server described at /.well-known/oauth-authorization-server (RFC 8414).
  parameters:
    SessionParam:
      name: session
      in: path
      required: true
      schema:
        type: string
        maxLength: 3072
      example: 9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60
      description: >-
        The id of the caller's session, as openSession returned it, percent-encoded
        once. At most 3072 characters: the percent-encoded length (the server counts
        1024 decoded bytes).
    ChannelParam:
      name: channel
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      example: release-train
      description: >-
        The channel name, percent-encoded once. At most 384 characters: the
        percent-encoded length (the server counts 128 decoded bytes).
    ScopeParam:
      name: scope
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      example: acme
      description: >-
        The scope name, percent-encoded once. At most 384 characters: the
        percent-encoded length (the server counts 128 decoded bytes).
    IdParam:
      name: id
      in: path
      required: true
      example: 42
      description: "The numeric id of the memory or task, as the id member of its document names it"
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775807
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      example: 6b1f2d4e-0c3a-4f8b-9e7d-example00001
      description: >-
        An opaque key the client chooses to make a mutating call safe to retry
        (Decision 66). The server keeps the first call's answer per identity and
        key for receipt_retention_minutes (default 60); a repeat with the same key
        and body returns that answer without running the call again, and the same
        key with a different body is 409 conflict. Absent or empty means no
        receipt. At most 1024 bytes.
      schema:
        type: string
        maxLength: 1024
  responses:
    BadRequest:
      description: >-
        The request is malformed or fails validation: a parameter, header or
        body the server cannot read or that breaks the schema. code: validation.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:validation
            title: 'Bad Request'
            status: 400
            detail: 'Idempotency-Key must be at most 1024 bytes'
            instance: /v1/channels/release-train/messages
            code: validation
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [validation]
    Unauthorized:
      description: >-
        The bearer is missing, invalid or expired. code: unauthenticated.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:unauthenticated
            title: 'Unauthorized'
            status: 401
            detail: 'invalid credential: invalid bearer token: malformed'
            instance: /v1/health
            code: unauthenticated
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unauthenticated]
    Forbidden:
      description: >-
        The caller is authenticated but may not do this, or is not registered.
        code: forbidden (the access rule refuses the action) or not_registered
        (the bearer names no registered identity).
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:forbidden
            title: 'Forbidden'
            status: 403
            detail: 'acme-coder-1 needs write on channel "release-train"'
            instance: /v1/channels/release-train/messages
            code: forbidden
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [forbidden, not_registered]
    NotFound:
      description: >-
        The named channel, session, memory, task, scope, bridge or identity does
        not exist, or is outside the caller's scope. code: not_found.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:not_found
            title: 'Not Found'
            status: 404
            detail: 'channel "release-train" does not exist'
            instance: /v1/channels/release-train/acl
            code: not_found
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [not_found]
    Conflict:
      description: >-
        The request conflicts with current state: a taken name, a closed scope,
        a live bridge, a reused idempotency key, a precondition that no longer
        holds, or a watch replaced by a newer one on the same session. code:
        conflict, or replaced for a watch.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:conflict
            title: 'Conflict'
            status: 409
            detail: 'idempotency_key "6b1f2d4e-0c3a-4f8b-9e7d-example00001" was used with a different payload'
            instance: /v1/channels/release-train/messages
            code: conflict
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [conflict, replaced]
    Gone:
      description: >-
        The session is closed or its lease has lapsed. code: session_closed or
        session_lapsed.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:session_closed
            title: 'Gone'
            status: 410
            detail: 'session "9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60" is closed'
            instance: /v1/sessions/9f1c2e7a4b3d5c6e8f0a1b2c3d4e5f60/peek
            code: session_closed
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [session_lapsed, session_closed]
    PayloadTooLarge:
      description: >-
        The request body exceeds the server limit. A body sent to an operation
        without a request body is refused the same way and is outside the
        contract. code: payload_too_large.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:payload_too_large
            title: 'Request Entity Too Large'
            status: 413
            detail: 'request body exceeds 1114112 bytes'
            instance: /v1/channels/release-train/messages
            code: payload_too_large
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [payload_too_large]
    UnprocessableEntity:
      description: >-
        A configured write inspector rejected the content. code:
        inspection_rejected.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:inspection_rejected
            title: 'Unprocessable Entity'
            status: 422
            detail: 'rejected by inspection (credential_detected): the message appears to contain an API key'
            instance: /v1/channels/release-train/messages
            code: inspection_rejected
            retryable: false
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [inspection_rejected]
    TooManyRequests:
      description: >-
        The caller exceeded a rate limit; retry after the number of seconds in
        Retry-After. code: rate_limited.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying, at least 1.
          example: 30
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:rate_limited
            title: 'Too Many Requests'
            status: 429
            detail: 'send_messages_per_second rate limit exceeded for acme-coder-1'
            instance: /v1/channels/release-train/messages
            code: rate_limited
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [rate_limited]
    InternalServerError:
      description: >-
        The server failed in a way the caller cannot correct. code: internal.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:internal
            title: 'Internal Server Error'
            status: 500
            detail: 'database is locked (5) (SQLITE_BUSY)'
            instance: /v1/channels
            code: internal
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [internal]
    ServiceUnavailable:
      description: >-
        The store or a dependency is unavailable; the request may be retried.
        code: unavailable.
      content:
        application/problem+json:
          example:
            type: urn:agentmesh:problem:unavailable
            title: 'Service Unavailable'
            status: 503
            detail: 'store unreachable'
            instance: /v1/health
            code: unavailable
            retryable: true
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unavailable]
    OAuthError:
      description: >-
        RFC 6749 section 5.2 error; only the token endpoint answers it (spec
        8.1).
      content:
        application/json:
          example:
            error: invalid_client
            error_description: assertion replayed
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    # Convention: every JSON request-body schema (and each object inside a
    # request body) sets `additionalProperties: false`, so a misspelled or
    # unknown member is a 400 validation error instead of being silently
    # dropped. Two exceptions: TokenRequest, because an OAuth token endpoint
    # ignores parameters it does not know (RFC 6749 section 3.2); and JWK
    # (RegisterRequest.public_key_jwk), which is `additionalProperties: true`
    # because a key carries members that differ per key type (RFC 7517). A schema
    # used only in responses stays open so a newer server can add a member; a
    # schema shared by a request and a response (ACLEntry) follows the request
    # rule. A new request body follows the convention.
    Problem:
      example:
        type: urn:agentmesh:problem:not_found
        title: Not Found
        status: 404
        detail: 'channel "release-train" does not exist'
        instance: /v1/channels/release-train/acl
        code: not_found
        retryable: false
      description: "The body of every error response (application/problem+json): the stable code, the HTTP status, whether a retry can succeed, and a human-readable title and detail."
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
          description: "A URN naming the code: the prefix urn:agentmesh:problem: followed by the code (RFC 9457 section 3.1.1)."
        title:
          type: string
          description: "The HTTP status text of the status, for example Not Found."
        status:
          type: integer
          description: "The HTTP status code of the response, repeated in the body."
        detail:
          type: string
          description: "An explanation specific to this occurrence; absent when there is none. The health 503 and the token endpoint never carry the text of a store failure; an internal problem carries the truncated text of the failure."
        instance:
          type: string
          description: "The path of the request that failed, for example /v1/channels/release-train/acl; absent when the request is unknown."
        code:
          type: string
          description: agentmesh extension member (RFC 9457 section 3.2).
          # inspection_rejected is declared per operation (issue #33)
          enum:
            - validation
            - not_found
            - conflict
            - forbidden
            - not_registered
            - rate_limited
            - replaced
            - session_lapsed
            - session_closed
            - unavailable
            - internal
            - unauthenticated
            - inspection_rejected
            - payload_too_large
        retryable:
          type: boolean
          description: agentmesh extension member (RFC 9457 section 3.2).
    Wake:
      description: "The answer to a watch that woke: the sequence number, the count of pending messages and the channels they wait on."
      type: object
      required: [seq, count, channels]
      properties:
        seq:
          type: integer
          format: int64
        count:
          type: integer
        channels:
          type: array
          items:
            type: string
    Peek:
      description: "The read-only pending counts of a session: the total and the non-zero count of each channel."
      type: object
      required: [count, channels]
      properties:
        count:
          type: integer
        channels:
          type: array
          items:
            type: object
            required: [channel, count]
            properties:
              channel:
                type: string
              count:
                type: integer
    WellKnown:
      example:
        discover: /v1/discover
      description: "The answer of the well-known document: the path of the discovery document."
      type: object
      required: [discover]
      properties:
        discover:
          type: string
          description: "The path of the discovery document, always /v1/discover."
    AuthMethod:
      example:
        name: bearerAuth
        type: http
        scheme: bearer
        bearer_format: JWT
      description: One authentication method the server accepts, as advertised in the discovery document.
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: "The name of the security scheme in this document."
        type:
          type: string
          description: "The OpenAPI security scheme type of the scheme."
        scheme:
          type: string
          description: "The HTTP authentication scheme; absent when the security scheme names none."
        bearer_format:
          type: string
          description: "The format of the bearer token; absent when the security scheme names none."
    Discovery:
      example:
        api_versions: [v1]
        server_version: 2.0.0-dev
        protocol_version: 1.0.0
        capabilities: [health, long_poll]
        auth_methods:
          - name: bearerAuth
            type: http
            scheme: bearer
            bearer_format: JWT
        authorization_server: http://localhost:8420/.well-known/oauth-authorization-server
        openid_configuration: http://localhost:8420/.well-known/openid-configuration
        issuers: []
      description: "The liveness and discovery document: API versions, server and protocol versions, capabilities, authentication methods and the issuer metadata locations."
      type: object
      required: [api_versions, server_version, protocol_version, capabilities, auth_methods, issuers]
      properties:
        api_versions:
          type: array
          description: "The API versions the server serves; v1 is the /v1 path prefix."
          items:
            type: string
        server_version:
          type: string
          description: "The server's version string, the same value as version in the health document."
        protocol_version:
          type: string
          description: >-
            The protocol version (this document's info.version): the major is
            the /v1 path, the minor is bumped on every addition, the patch on
            a documentation-only change. Independent of server_version.
        capabilities:
          type: array
          description: "What the server offers, sorted and computed from what is available: health and long_poll always, semantic_search when an embedder is configured."
          items:
            type: string
        auth_methods:
          type: array
          description: "The authentication methods, computed from the security schemes of this document (Decision 65)."
          items:
            $ref: "#/components/schemas/AuthMethod"
        authorization_server:
          type: string
          description: URL of the RFC 8414 authorization server metadata.
        openid_configuration:
          type: string
          description: >-
            URL of the same document under /.well-known/openid-configuration,
            kept for existing clients.
        issuers:
          type: array
          description: "The issuer URLs of the configured external identity providers whose access tokens the token endpoint exchanges for a human bearer; empty when none is configured."
          items:
            type: string
    AuthorizationServerMetadata:
      example:
        issuer: http://localhost:8420
        token_endpoint: http://localhost:8420/v1/auth/token
        jwks_uri: http://localhost:8420/v1/auth/jwks
        response_types_supported: []
        grant_types_supported:
          - client_credentials
          - urn:ietf:params:oauth:grant-type:token-exchange
        token_endpoint_auth_methods_supported: [private_key_jwt, none]
        token_endpoint_auth_signing_alg_values_supported: [EdDSA, ES256]
      description: The RFC 8414 authorization server metadata of the server's token endpoint.
      type: object
      required:
        - issuer
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
      properties:
        issuer:
          type: string
          description: "The issuer URL: the configured issuer, else the scheme and host of the request. It is the iss and aud of every bearer the server mints."
        token_endpoint:
          type: string
          description: "The URL of the token endpoint: the issuer followed by /v1/auth/token."
        jwks_uri:
          type: string
          description: "The URL of the key set that verifies the server's bearers: the issuer followed by /v1/auth/jwks."
        response_types_supported:
          type: array
          description: "Always empty: the server has no authorization endpoint and issues tokens only at the token endpoint."
          items:
            type: string
        grant_types_supported:
          type: array
          description: "The grants the token endpoint accepts: client_credentials and the RFC 8693 token exchange."
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          description: "How a client authenticates: private_key_jwt for the client credentials grant, none for the token exchange, which presents no client credentials."
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          description: "The algorithms a client assertion may be signed with: EdDSA and ES256."
          items:
            type: string
    OfferedCursor:
      description: "A position a client offers on open: a channel and the last sequence number it holds."
      type: object
      additionalProperties: false
      required: [channel, seq]
      properties:
        channel:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
    OpenSessionRequest:
      description: "Opens or resumes a session: an optional hint, an optional resume token and the cursors the client offers."
      type: object
      additionalProperties: false
      properties:
        hint:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        resume_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Exactly 43 code points of base64url.
        cursors:
          type: array
          items:
            $ref: "#/components/schemas/OfferedCursor"
          maxItems: 256
          description: At most 256 items.
    RejectedCursor:
      description: An offered cursor that was not adopted, with the reason (before_retention, ahead, unreadable or unsubscribed).
      type: object
      required: [channel, reason]
      properties:
        channel:
          type: string
        reason:
          type: string
          enum: [before_retention, ahead, unreadable, unsubscribed]
    PendingChannel:
      description: The number of messages waiting on one subscribed channel.
      type: object
      required: [channel, pending]
      properties:
        channel:
          type: string
        pending:
          type: integer
          format: int64
    Session:
      description: "An opened session: its id, identity and display name, the resume token, whether an existing session was resumed, the rejected cursors and the pending counts."
      type: object
      required: [id, identity, display_name, resume_token, resumed, rejected_cursors, pending]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        resume_token:
          type: string
        resumed:
          type: boolean
        rejected_cursors:
          type: array
          items:
            $ref: "#/components/schemas/RejectedCursor"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingChannel"
    ReceiveRequest:
      description: "Reads the next batch for a session: the batch token to acknowledge, a count, an optional channel filter and whether the session's own messages count."
      type: object
      additionalProperties: false
      properties:
        ack:
          type: string
          maxLength: 1024
          description: At most 1024 bytes.
        count:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          x-go-type: int
          description: >-
            At most 10000, the largest value of receive_max_count; above the configured receive_max_count the server returns at most that many.
        channels:
          type: array
          items:
            type: string
            maxLength: 128
            description: At most 128 bytes (the server counts bytes).
          maxItems: 256
          description: At most 256 items.
        include_own:
          type: boolean
    Gap:
      description: A range of sequence numbers on a channel that the receiver will never see because retention removed them.
      type: object
      required: [channel, from, to]
      properties:
        channel:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
    Message:
      description: "A delivered, read or searched message: sender, session, channel, sequence number, subject, content, tags and, on a memory channel, the memory id and revision."
      type: object
      required: [seq, channel, sender, sender_kind, display, created_at, type, subject, content]
      properties:
        seq:
          type: integer
          format: int64
        channel:
          type: string
        sender:
          type: string
        sender_kind:
          type: string
          enum: [agent, human]
        session:
          type: string
        display:
          type: string
        created_at:
          type: integer
          format: int64
        type:
          type: string
        subject:
          type: string
        content:
          type: string
        reply_to:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        memory_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        matched_tags:
          type: array
          items:
            type: string
    ReceiveResult:
      description: "One delivery batch: the messages, the batch token to acknowledge, whether the batch was redelivered, whether the acknowledgment was ignored, retention gaps, a server notice and an instruction."
      type: object
      required: [messages, batch, redelivered, ack_ignored, gaps]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        batch:
          type: string
        redelivered:
          type: boolean
        ack_ignored:
          type: boolean
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
        notice:
          type: string
        instruction:
          type: string
    SessionInfo:
      description: "One live session: its id, identity, display name and the time it was opened."
      type: object
      required: [id, identity, display_name, opened_at]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        opened_at:
          type: integer
          format: int64
    Identity:
      description: "An identity that has a live session, with its kind, administrator flag, live sessions and current status."
      type: object
      required: [name, kind, admin, sessions]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [agent, human]
        admin:
          type: boolean
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
        status:
          $ref: "#/components/schemas/AgentStatus"
    SetAgentStatusRequest:
      description: "Sets the caller's status: a tag, a text and, for a problem, a description of the problem."
      type: object
      additionalProperties: false
      required: [tag, text]
      properties:
        tag:
          type: string
          description: >-
            One of idle, planning, implementing, reviewing, waiting, blocked, needs-human. offline is set by the server. At most 256 code points.
          maxLength: 256
        text:
          type: string
          maxLength: 200
          description: At most 200 code points.
        problem:
          type: string
          maxLength: 200
          description: At most 200 code points.
    AgentStatus:
      description: "One status revision of one identity: its tag, text, problem, session and the time it was set."
      type: object
      required: [identity, revision, tag, text, session, display_name, set_at]
      properties:
        identity:
          type: string
        revision:
          type: integer
          format: int64
        tag:
          type: string
        last_tag:
          type: string
          description: >-
            listAgentStatuses only: the stored tag; tag reads offline when
            live is false.
        text:
          type: string
        problem:
          type: string
          description: Absent when empty.
        session:
          type: string
        display_name:
          type: string
        set_at:
          type: integer
          format: int64
          description: Unix milliseconds.
    AgentStatusEntry:
      description: One identity's current status in the agent list, with whether the identity is live.
      type: object
      required: [identity, kind, live, status]
      properties:
        identity:
          type: string
        kind:
          type: string
          enum: [agent, human]
        live:
          type: boolean
        status:
          $ref: "#/components/schemas/AgentStatus"
    Channel:
      description: "What a caller sees of a channel it may list: name, kind and capabilities."
      type: object
      required: [name, kind, capabilities]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
    ChannelInfo:
      description: "The creator's view of a channel on creation and the administrator's view on status: name, kind, capabilities, creator, scope and creation time."
      type: object
      required: [name, kind, creator, created_at, capabilities]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
        creator:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          format: int64
    ACLEntry:
      description: Grants a list of permissions on a channel to one identity.
      type: object
      additionalProperties: false
      required: [identity, permissions]
      properties:
        identity:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        permissions:
          type: array
          items:
            type: string
            enum: [read, write, admin]
          maxItems: 3
          minItems: 1
          description: At least 1 and at most 3 items.
    CreateChannelRequest:
      description: "Creates a channel: its name, kind, an optional access control list and an optional scope."
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        acl:
          type: array
          items:
            $ref: "#/components/schemas/ACLEntry"
          maxItems: 256
          description: At most 256 items.
        scope:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    RenameChannelRequest:
      description: Renames a channel to a new name.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    SubscribeRequest:
      description: Subscribes the caller to a channel, from now or from the oldest retained message.
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          enum: [now, oldest]
    TagPatterns:
      description: A tag subscription, which is one AND set of tag patterns.
      type: object
      additionalProperties: false
      required: [patterns]
      properties:
        patterns:
          type: array
          items:
            type: string
            maxLength: 33
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
            description: >-
              At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
          maxItems: 10
          description: At most 10 items.
    SendRequest:
      description: "Sends a message to a channel: subject, content, an optional reply-to sequence number, metadata, tags and the sending session."
      type: object
      additionalProperties: false
      required: [content]
      properties:
        subject:
          type: string
          maxLength: 200
          description: At most 200 code points.
        content:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        type:
          type: string
          maxLength: 256
          description: At most 256 code points.
        reply_to:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
        tags:
          type: array
          items:
            type: string
            maxLength: 32
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$
            description: >-
              At most 32 code points of letters, digits and hyphen with one optional colon; the server lowercases tags.
          maxItems: 10
          description: At most 10 items.
        session:
          type: string
          maxLength: 1024
          description: At most 1024 bytes.
    SendResult:
      description: The sequence number of the new message and, on a memory channel, its memory id.
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
        memory_id:
          type: integer
          format: int64
    SearchHit:
      description: A message with its search score.
      type: object
      required: [message, score]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        score:
          type: number
          format: double
    SearchResult:
      description: One page of search hits, the cursor of the next page and whether semantic search was unavailable.
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        next:
          type: string
        semantic_unavailable:
          type: boolean
    EditMemoryRequest:
      type: object
      description: >-
        Every field is optional and an omitted field keeps the live revision's
        value; a present empty subject, type, metadata or tags clears it.
        Content cannot be cleared (an empty content is a validation error).
        A request with no field is a validation error.
      additionalProperties: false
      properties:
        if_revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision the caller read; the edit fails with conflict if the live revision differs.
          maximum: 9223372036854775807
        subject:
          type: string
          maxLength: 200
          description: At most 200 code points.
        content:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        type:
          type: string
          maxLength: 256
          description: At most 256 code points.
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
        tags:
          type: array
          items:
            type: string
            maxLength: 32
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$
            description: >-
              At most 32 code points of letters, digits and hyphen with one optional colon; the server lowercases tags.
          maxItems: 10
          description: At most 10 items.
    EditResult:
      description: Identifies the new revision of an edited memory and the one it replaced.
      type: object
      required: [seq, memory_id, revision, replaced]
      properties:
        seq:
          type: integer
          format: int64
        memory_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        replaced:
          type: integer
          format: int64
    Task:
      description: A task as returned to callers, with its channel (the task list), status, owner, parent, rank, blockers and lease.
      type: object
      required: [id, channel, revision, subject, status, rank, blocked, updated_at, updated_by]
      properties:
        id:
          type: integer
          format: int64
        channel:
          type: string
        revision:
          type: integer
          format: int64
        subject:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        parent:
          type: integer
          format: int64
        rank:
          type: string
        blocked_by:
          type: array
          items:
            type: integer
            format: int64
        leased_until:
          type: integer
          format: int64
        reclaimed_from:
          type: string
          description: "the owner the abandoned-task reclaim took the task from; present until the task is claimed, assigned or leaves pending"
        reclaimed_at:
          type: integer
          format: int64
          description: "when the reclaim happened, unix ms"
        metadata:
          type: object
          additionalProperties:
            type: string
        blocked:
          type: boolean
        open_blockers:
          type: array
          items:
            type: integer
            format: int64
        updated_at:
          type: integer
          format: int64
        updated_by:
          type: string
    TaskSummary:
      description: One row of a task list result.
      type: object
      required: [id, subject, status, depth]
      properties:
        id:
          type: integer
          format: int64
        subject:
          type: string
        status:
          type: string
        owner:
          type: string
        parent:
          type: integer
          format: int64
        depth:
          type: integer
        open_blockers:
          type: array
          items:
            type: integer
            format: int64
        leased_until:
          type: integer
          format: int64
        reclaimed_from:
          type: string
          description: "the owner the abandoned-task reclaim took the task from; present until the task is claimed, assigned or leaves pending"
        reclaimed_at:
          type: integer
          format: int64
          description: "when the reclaim happened, unix ms"
        has_details:
          type: boolean
    TaskCreateRequest:
      description: "Creates a task: subject, description, parent, a position relative to a sibling (before or after, mutually exclusive), blockers and metadata."
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 256
          description: At least 1 and at most 256 code points.
        description:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        parent:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        before:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        after:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        blocked_by:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
          maxItems: 64
          description: At most 64 items.
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
    TaskPatch:
      description: "The task update input: absent fields are unchanged; before and after are mutually exclusive sibling ids."
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          maxLength: 256
          description: >-
            At most 256 code points. One of pending, in_progress, completed; any other value answers validation.
        owner:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        subject:
          type: string
          maxLength: 256
          description: At most 256 code points.
        description:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        parent:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        before:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        after:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        add_blocked_by:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
          maxItems: 64
          description: At most 64 items.
        remove_blocked_by:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
          maxItems: 64
          description: At most 64 items.
        leased_until:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
        delete:
          type: boolean
    TaskUpdateResult:
      description: "The result of a task update: the task, whether an earlier revision was replaced and whether the task was deleted."
      type: object
      required: [task, replaced]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        replaced:
          type: integer
          format: int64
        deleted:
          type: boolean
    ClaimTaskRequest:
      description: Claims a task for the caller, optionally with a lease that runs until a time.
      type: object
      additionalProperties: false
      properties:
        leased_until:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
    Notice:
      description: "A server notice shown to administrators: its kind, message and the time it was set."
      type: object
      required: [kind, message, set_at]
      properties:
        kind:
          type: string
        message:
          type: string
        set_at:
          type: integer
          format: int64
    Status:
      description: "The administrator's view: live sessions, every channel with its creator, server notices and the embedding backlog and rejections."
      type: object
      required: [sessions, channels, notices, embedding_backlog, embedding_rejected]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelInfo"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        embedding_backlog:
          type: integer
        embedding_rejected:
          type: integer
        embedding_rejected_last:
          type: string
        embedding_error:
          type: string
        embedding_error_at:
          type: integer
          format: int64
    Usage:
      description: "Storage use against the budget: bytes, budget, disk size and ratio, how close the use is to the budget, and the capacity notice text when one is set."
      type: object
      required: [bytes, budget_bytes, evictable, disk_bytes, disk_ratio, tier]
      properties:
        bytes:
          type: integer
          format: int64
          description: "The enforced measure: used file bytes on SQLite, the logical sum on Postgres."
        budget_bytes:
          type: integer
          format: int64
        evictable:
          type: boolean
          description: A budget is enforced.
        disk_bytes:
          type: integer
          format: int64
        disk_ratio:
          type: number
          format: double
          description: disk_bytes / bytes; 0 when bytes is 0
        tier:
          type: string
          enum: [normal, approaching, soft, hard, exhausted]
        notice:
          type: string
          description: The capacity notice text, when one is set.
    Health:
      example:
        status: degraded
        tier: admin
        version: 2.0.0-dev
        protocol_version: 1.0.0
        now: 1794096000000
        started_at: 1794092400000
        store:
          engine: sqlite
          schema_version: 1
        embeddings:
          state: failing
          backlog: 3
          rejected: 1
          model: example-embedding-model
          last_error: 'embedding service unreachable: connection refused'
          last_error_at: 1794095000000
          rejected_last: 'input exceeds the model context window'
        storage:
          bytes: 352256
          budget_bytes: 2147483648
          evictable: true
          disk_bytes: 352256
          disk_ratio: 1
          tier: normal
        notices:
          - kind: embedding
            message: 'embedding service unreachable: connection refused'
            set_at: 1794095000000
        maintenance:
          interval_seconds: 60
          owner: a31950eb95b5c835988bcf17
          lock: held
          last_tick_at: 1794095940000
          jobs:
            - name: lapsed sessions
              changed: 2
              skipped: false
            - name: embeddings
              changed: 0
              error: 'embedding service unreachable: connection refused'
              skipped: false
      type: object
      description: >-
        The server's health as the caller's tier may see it (spec
        2026-10-25 section 4). Members above the probe tier are absent, never
        null, below their tier. An unreachable store is a 503 problem with
        code unavailable, never a document.
      required: [status, tier, version, protocol_version, now]
      properties:
        status:
          type: string
          description: "ok, or degraded when an operator notice (capacity, embedding or inspection) is set or this process's last maintenance tick recorded a lock error or a failed job. Every tier sees the same status."
          enum: [ok, degraded]
        tier:
          type: string
          description: "What the caller got: probe (no credential), identity (a registered identity) or admin (an administrator), so a probe-only view is never mistaken for health."
          enum: [probe, identity, admin]
        version:
          type: string
          description: "The server's version string, the same value as server_version in the discovery document."
        protocol_version:
          type: string
          description: >-
            The protocol version (this document's info.version): the major is
            the /v1 path, the minor is bumped on every addition, the patch on
            a documentation-only change. Independent of version.
        now:
          type: integer
          format: int64
          description: "The server's clock, in Unix milliseconds."
        started_at:
          type: integer
          format: int64
          description: "When this process started, in Unix milliseconds; identity tier and above."
        store:
          $ref: "#/components/schemas/HealthStore"
        embeddings:
          $ref: "#/components/schemas/HealthEmbeddings"
        storage:
          $ref: "#/components/schemas/Usage"
        notices:
          type: array
          description: "The operator notices (capacity, embedding, inspection); an empty list when none is set. Administrator tier only."
          items:
            $ref: "#/components/schemas/Notice"
        maintenance:
          $ref: "#/components/schemas/HealthMaintenance"
    HealthStore:
      example:
        engine: sqlite
        schema_version: 1
      description: The store engine and its schema version.
      type: object
      required: [engine, schema_version]
      properties:
        engine:
          type: string
          description: "The store engine: sqlite or postgres."
          enum: [sqlite, postgres]
        schema_version:
          type: integer
          description: "The schema version the database holds."
    HealthEmbeddings:
      example:
        state: failing
        backlog: 3
        rejected: 1
        model: example-embedding-model
        last_error: 'embedding service unreachable: connection refused'
        last_error_at: 1794095000000
        rejected_last: 'input exceeds the model context window'
      description: The embedding state and backlog; the model, last error and rejection details are set at the administrator tier only.
      type: object
      required: [state, backlog, rejected]
      properties:
        state:
          type: string
          description: "off when no embedder is configured, failing while the embedding notice is set, else ok."
          enum: [off, ok, failing]
        backlog:
          type: integer
          description: >-
            Memories waiting for an embedding, capped at 1000 (the search page
            maximum), so 1000 means "at least 1000".
        rejected:
          type: integer
          description: "The number of memories whose embedding the embedder rejected."
        model:
          type: string
          description: "The embedding model; administrator tier only, absent when state is off."
        last_error:
          type: string
          description: "The text of the embedding notice; administrator tier only, absent when none is set."
        last_error_at:
          type: integer
          format: int64
          description: "When the embedding notice was set, in Unix milliseconds; administrator tier only, absent when none is set."
        rejected_last:
          type: string
          description: "The latest rejection reason; administrator tier only, absent when there is none."
    HealthMaintenance:
      example:
        interval_seconds: 60
        owner: a31950eb95b5c835988bcf17
        lock: held
        last_tick_at: 1794095940000
        jobs:
          - name: lapsed sessions
            changed: 2
            skipped: false
          - name: embeddings
            changed: 0
            error: 'embedding service unreachable: connection refused'
            skipped: false
      description: "This process's view of the maintenance loop: its interval, the lock owner and the last tick's jobs."
      type: object
      required: [interval_seconds, owner, lock, jobs]
      properties:
        interval_seconds:
          type: integer
          description: "The period of the maintenance tick in seconds."
        owner:
          type: string
          description: "This process's own lock owner id, not the holder's."
        lock:
          type: string
          description: "The result of this process's last attempt to take the maintenance lock: held, held_elsewhere, or unknown before the first tick and after a lock error."
          enum: [held, held_elsewhere, unknown]
        last_tick_at:
          type: integer
          format: int64
          description: "When this process last ticked, in Unix milliseconds; absent before its first tick."
        lock_error:
          type: string
          description: "The last lock error, truncated; present only when lock is unknown after a failed attempt (that tick lists no jobs), absent otherwise."
        jobs:
          type: array
          description: "The jobs of the last tick; empty before the first tick, when the lock is held elsewhere and after a lock error."
          items:
            $ref: "#/components/schemas/HealthJob"
    HealthJob:
      example:
        name: lapsed sessions
        changed: 2
        skipped: false
      description: One maintenance job's outcome in the last tick.
      type: object
      required: [name, changed, skipped]
      properties:
        name:
          type: string
          description: "The job's name, for example lapsed sessions."
        changed:
          type: integer
          description: "The count the job reported changed in the last tick."
        error:
          type: string
          description: "The job's error text, truncated; absent when the job succeeded."
        skipped:
          type: boolean
          description: "True when the tick's deadline passed before the job ran."
    TokenRequest:
      example:
        grant_type: client_credentials
        client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
        client_assertion: eyJhbGciOiJFZERTQSIsImtpZCI6IlpYaGhiWEJzWlMxemFXZHVhVzVuTFd0bGVTMXBaQzF1YjNRdGNtVmhiREUiLCJ0eXAiOiJKV1QifQ.eyJpc3MiOiJhY21lLWNvZGVyLTEiLCJzdWIiOiJhY21lLWNvZGVyLTEiLCJhdWQiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJqdGkiOiJleGFtcGxlLWp0aS0xIiwiZXhwIjoxNzk0MDk5NjAwfQ.ZXhhbXBsZS1zaWduYXR1cmUtbm90LXJlYWw
      type: object
      description: >-
        RFC 6749 section 4.4.2 and RFC 8693 section 2.1 token request. The
        grant is a plain string so that an unsupported one answers
        unsupported_grant_type (RFC 6749 section 5.2) rather than failing
        validation; the handler checks which parameters each grant needs.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          maxLength: 1024
          description: "client_credentials, or urn:ietf:params:oauth:grant-type:token-exchange; any other value is unsupported_grant_type. At most 1024 bytes."
        client_assertion_type:
          type: string
          maxLength: 1024
          description: "client_credentials only: urn:ietf:params:oauth:client-assertion-type:jwt-bearer. At most 1024 bytes."
        client_assertion:
          type: string
          maxLength: 16384
          description: "client_credentials only: the signed client assertion JWT, whose iss and sub are the identity and whose aud is the issuer URL. At most 16384 bytes."
        client_id:
          type: string
          maxLength: 128
          description: "client_credentials only, optional: when sent, it must equal the assertion's issuer. The token exchange does not use it. At most 128 bytes (the server counts bytes)."
        scope:
          type: string
          maxLength: 1024
          description: "Ignored by the server. At most 1024 bytes."
        subject_token:
          type: string
          maxLength: 16384
          description: "Token exchange only: the access token a configured external issuer gave the human. At most 16384 bytes."
        subject_token_type:
          type: string
          maxLength: 1024
          description: "Token exchange only: urn:ietf:params:oauth:token-type:access_token; an ID token type is refused. At most 1024 bytes."
        requested_token_type:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, urn:ietf:params:oauth:token-type:access_token. At most 1024 bytes."
        audience:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, the issuer URL of this server (else invalid_target). At most 1024 bytes."
        resource:
          type: string
          maxLength: 1024
          description: "Token exchange only, optional: when sent, the issuer URL of this server (else invalid_target). At most 1024 bytes."
        actor_token:
          type: string
          maxLength: 16384
          description: "Not supported: any value is invalid_request in a token exchange. At most 16384 bytes."
        actor_token_type:
          type: string
          maxLength: 1024
          description: "Not supported: any value is invalid_request in a token exchange. At most 1024 bytes."
    OAuthError:
      example:
        error: invalid_client
        error_description: assertion replayed
      type: object
      description: RFC 6749 section 5.2 error body.
      required: [error]
      properties:
        error:
          type: string
          description: "The RFC 6749 section 5.2 error code: invalid_request, invalid_client, invalid_target, unsupported_grant_type, temporarily_unavailable or server_error."
        error_description:
          type: string
          description: "A human-readable explanation; a server fault always says internal error and never carries the underlying text."
    AccessToken:
      example:
        access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IlpYaGhiWEJzWlMxemFXZHVhVzVuTFd0bGVTMXBaQzF1YjNRdGNtVmhiREUiLCJ0eXAiOiJhdCtqd3QifQ.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJzdWIiOiJhY21lLWNvZGVyLTEiLCJhdWQiOiJodHRwOi8vbG9jYWxob3N0Ojg0MjAiLCJjbGllbnRfaWQiOiJhY21lLWNvZGVyLTEiLCJqdGkiOiJleGFtcGxlLWp0aS0xIiwiaWF0IjoxNzk0MDk2MDAwLCJleHAiOjE3OTQwOTk2MDAsImFnZW50bWVzaF9raW5kIjoiYWdlbnQifQ.ZXhhbXBsZS1zaWduYXR1cmUtbm90LXJlYWw
        token_type: Bearer
        expires_in: 3600
        issued_token_type: urn:ietf:params:oauth:token-type:access_token
      description: "The answer of a successful token exchange: the bearer, its type and its lifetime in seconds."
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: "The bearer, a JWT of type at+jwt; send it as Authorization: Bearer."
        token_type:
          type: string
          description: "Always Bearer."
        expires_in:
          type: integer
          format: int64
          description: "Seconds until the bearer expires: token_lifetime_seconds (default 3600) for an agent, the issuer's human lifetime (default 900) for a human."
        issued_token_type:
          type: string
          description: "urn:ietf:params:oauth:token-type:access_token after a token exchange; absent for client_credentials."
    JWK:
      example:
        kty: OKP
        crv: Ed25519
        x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
        kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
        alg: EdDSA
        use: sig
      type: object
      additionalProperties: true
      maxProperties: 16
      description: "A public JSON Web Key (RFC 7517): the members of the key and its kid, alg and use. At most 16 keys: the members of a submitted key."
    JWKS:
      example:
        keys:
          - kty: OKP
            crv: Ed25519
            x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
            kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
            alg: EdDSA
            use: sig
      description: "A JSON Web Key Set: the active signing key and any retiring key that still verifies the bearers it signed."
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: "The public keys, each with its kid."
          items:
            $ref: "#/components/schemas/JWK"
    RegisterRequest:
      example:
        identity: acme-coder-1
        public_key_jwk:
          kty: OKP
          crv: Ed25519
          x: ZXhhbXBsZS1wdWJsaWMta2V5LW5vdC1yZWFsLTMyYnk
          kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
          alg: EdDSA
          use: sig
        enrollment_token: abe_ZXhhbXBsZS1lbnJvbGxtZW50LXRvay1ub3QtcmVhbDE
      description: Registers a public key for an identity, with an enrollment token where the server requires one.
      type: object
      additionalProperties: false
      required: [identity, public_key_jwk]
      properties:
        identity:
          type: string
          maxLength: 128
          description: "The identity name to claim: it must have no credential yet. At most 128 bytes (the server counts bytes)."
        public_key_jwk:
          $ref: "#/components/schemas/JWK"
        enrollment_token:
          type: string
          maxLength: 1024
          description: "The plaintext token a host administrator created with enrollment create; required when the server registers by enrollment, consumed on success. At most 1024 bytes."
    Registration:
      example:
        identity: acme-coder-1
        kid: ZXhhbXBsZS1zaWduaW5nLWtleS1pZC1ub3QtcmVhbDE
        algorithm: EdDSA
        created: true
      description: "The outcome of a registration: the identity, the key id and algorithm, and whether this call created the identity."
      type: object
      required: [identity, kid, algorithm, created]
      properties:
        identity:
          type: string
          description: "The identity the key is bound to."
        kid:
          type: string
          description: "The key id: the RFC 7638 SHA-256 thumbprint of the public key, base64url."
        algorithm:
          type: string
          description: "The signing algorithm of the key: EdDSA for an Ed25519 key, ES256 for a P-256 key."
          enum: [EdDSA, ES256]
        created:
          type: boolean
          description: "True when this call created the identity, false when it already existed (a repeat of the same key included)."
    CreateIdentityByEmailRequest:
      description: Creates a human identity from an email address.
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    HumanIdentity:
      description: The normalized human identity name and whether this call created it.
      type: object
      required: [identity, created]
      properties:
        identity:
          type: string
        created:
          type: boolean
    CredentialReset:
      description: "The result of a credential reset: the identity and how many registered keys were removed."
      type: object
      required: [identity, keys_removed]
      properties:
        identity:
          type: string
        keys_removed:
          type: integer
    SigningKey:
      description: "One token signing key: its id, state, provider, algorithm and times."
      type: object
      required: [kid, state, provider, provider_ref, algorithm, created_at, retired_at, remove_after]
      properties:
        kid:
          type: string
          description: The RFC 7638 thumbprint of the public key.
        state:
          type: string
          enum: [active, retiring]
        provider:
          type: string
          enum: [store, awskms, gcpkms, azurekms, hashivault]
        provider_ref:
          type: string
          description: The key URI inside an external provider; empty for the store provider.
        algorithm:
          type: string
          enum: [EdDSA, ES256]
        created_at:
          type: integer
          format: int64
        retired_at:
          type: integer
          format: int64
          description: Unix milliseconds; 0 while the key is active.
        remove_after:
          type: integer
          format: int64
          description: Unix milliseconds, the earliest removal of a retiring key; 0 while the key is active.
    SigningKeyList:
      description: The server's token signing keys.
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    SigningKeyRotation:
      description: "The result of a rotation: the new active key, the key that was active before and whether that key was deleted."
      type: object
      required: [active, revoked]
      properties:
        active:
          $ref: "#/components/schemas/SigningKey"
        previous:
          description: The key that was active before the rotation, as the rotation left it (retiring, with its retirement times), or, when revoked is true, the deleted key as it was. Absent when the set had none.
          $ref: "#/components/schemas/SigningKey"
        revoked:
          type: boolean
          description: True when previous was deleted instead of retired.
    CreateAgentIdentityRequest:
      description: Creates an agent identity by name, optionally in a scope.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        scope:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    AgentIdentity:
      description: "The result of creating an agent identity: the identity, its scope, whether this call created it and the one-time enrollment token bound to the name with its expiry."
      type: object
      required: [identity, created, enrollment_token, expires_at]
      properties:
        identity:
          type: string
        scope:
          type: string
        created:
          type: boolean
        enrollment_token:
          type: string
        expires_at:
          type: integer
          format: int64
    CreateScopeRequest:
      description: Creates a scope by name.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    DoneScopeRequest:
      description: Retires a scope; retire is with_bridge or normal.
      type: object
      additionalProperties: false
      required: [retire]
      properties:
        retire:
          type: string
          enum: [with_bridge, normal]
    Scope:
      description: A named group of channels and agent identities retired as one unit; channels and identities are filled on a get only.
      type: object
      required: [name, state, created_at, last_activity]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [open, done, retired]
        retire:
          type: string
          enum: [with_bridge, normal]
        created_at:
          type: integer
          format: int64
        done_at:
          type: integer
          format: int64
        last_activity:
          type: integer
          format: int64
        channels:
          type: array
          items:
            type: string
        identities:
          type: array
          items:
            type: string
    ScopeList:
      description: The scopes of the server.
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    CreateBridgeRequest:
      description: Creates a bridge from a bus channel to a Slack channel, optionally with a Slack channel name.
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        slack_name:
          type: string
          maxLength: 80
          pattern: ^[a-z0-9_-]{1,80}$
          description: >-
            At most 80 code points of lowercase letters, digits, underscore and hyphen.
    Bridge:
      description: The link between a bus channel and a Slack channel, with its state and times.
      type: object
      required: [channel, scope, slack_name, state, created_at]
      properties:
        channel:
          type: string
        scope:
          type: string
        slack_channel_id:
          type: string
        slack_name:
          type: string
        state:
          type: string
          enum: [creating, live, archived]
        created_at:
          type: integer
          format: int64
        archived_at:
          type: integer
          format: int64
    BridgeNotInvited:
      description: A human the bridge could not invite, and why.
      type: object
      required: [identity, reason]
      properties:
        identity:
          type: string
        reason:
          type: string
    BridgeCreated:
      description: The created bridge and the humans it could not invite.
      type: object
      required: [bridge, not_invited]
      properties:
        bridge:
          $ref: "#/components/schemas/Bridge"
        not_invited:
          type: array
          items:
            $ref: "#/components/schemas/BridgeNotInvited"
    BridgeList:
      description: The bridges of the server.
      type: object
      required: [bridges]
      properties:
        bridges:
          type: array
          items:
            $ref: "#/components/schemas/Bridge"
