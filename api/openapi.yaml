      required: [tag, text]
      properties:
        tag:
          type: string
          description: >-
            The agent's state, one of idle, planning, implementing, reviewing, waiting, blocked, needs-human. offline is set by the server and refused here; the tag is compared exactly, never trimmed. At most 256 code points.
          maxLength: 256
        text:
          type: string
          maxLength: 200
          description: "One line saying what the agent is doing now; required, and surrounding spaces are trimmed. At most 200 code points."
        problem:
          type: string
          maxLength: 200
          description: "One line saying what blocks the agent; optional, usually with blocked or needs-human. At most 200 code points."
    AgentStatus:
      example:
