        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token (RFC 9068, typ at+jwt) issued by the authorization
        server described at /.well-known/oauth-authorization-server (RFC 8414).
  parameters:
    SessionParam:
      name: session
      in: path
      required: true
      schema:
        type: string
        maxLength: 3072
      description: >-
        At most 3072 characters: the percent-encoded length (the server counts 1024 decoded bytes).
    ChannelParam:
      name: channel
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      description: >-
        At most 384 characters: the percent-encoded length (the server counts 128 decoded bytes).
    ScopeParam:
      name: scope
      in: path
      required: true
      schema:
        type: string
        maxLength: 384
      description: >-
        At most 384 characters: the percent-encoded length (the server counts 128 decoded bytes).
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9223372036854775807
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Absent or empty means no receipt (Decision 66). At most 1024 bytes.
      schema:
        type: string
        maxLength: 1024
  responses:
    BadRequest:
      description: >-
        The request is malformed or fails validation: a parameter, header or
        body the server cannot read or that breaks the schema. code: validation.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [validation]
    Unauthorized:
      description: >-
        The bearer is missing, invalid or expired. code: unauthenticated.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unauthenticated]
    Forbidden:
      description: >-
        The caller is authenticated but may not do this, or is not registered.
        code: forbidden (the access rule refuses the action) or not_registered
        (the bearer names no registered identity).
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [forbidden, not_registered]
    NotFound:
      description: >-
        The named channel, session, memory, task, scope, bridge or identity does
        not exist, or is outside the caller's scope. code: not_found.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [not_found]
    Conflict:
      description: >-
        The request conflicts with current state: a taken name, a closed scope,
        a live bridge, a reused idempotency key, a precondition that no longer
        holds, or a watch replaced by a newer one on the same session. code:
        conflict, or replaced for a watch.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [conflict, replaced]
    Gone:
      description: >-
        The session is closed or its lease has lapsed. code: session_closed or
        session_lapsed.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [session_lapsed, session_closed]
    PayloadTooLarge:
      description: >-
        The request body exceeds the server limit. A body sent to an operation
        without a request body is refused the same way and is outside the
        contract. code: payload_too_large.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [payload_too_large]
    UnprocessableEntity:
      description: >-
        A configured write inspector rejected the content. code:
        inspection_rejected.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [inspection_rejected]
    TooManyRequests:
      description: >-
        The caller exceeded a rate limit; retry after the number of seconds in
        Retry-After. code: rate_limited.
      headers:
        Retry-After:
          required: true
          description: Whole seconds to wait before retrying, at least 1.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [rate_limited]
    InternalServerError:
      description: >-
        The server failed in a way the caller cannot correct. code: internal.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [internal]
    ServiceUnavailable:
      description: >-
        The store or a dependency is unavailable; the request may be retried.
        code: unavailable.
      content:
        application/problem+json:
          schema:
            x-go-type: Problem
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  code:
                    enum: [unavailable]
    OAuthError:
      description: >-
        RFC 6749 section 5.2 error; only the token endpoint answers it (spec
        8.1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    # Convention: every JSON request-body schema (and each object inside a
    # request body) sets `additionalProperties: false`, so a misspelled or
    # unknown member is a 400 validation error instead of being silently
    # dropped. Two exceptions: TokenRequest, because an OAuth token endpoint
    # ignores parameters it does not know (RFC 6749 section 3.2); and JWK
    # (RegisterRequest.public_key_jwk), which is `additionalProperties: true`
    # because a key carries members that differ per key type (RFC 7517). A schema
    # used only in responses stays open so a newer server can add a member; a
    # schema shared by a request and a response (ACLEntry) follows the request
    # rule. A new request body follows the convention.
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: agentmesh extension member (RFC 9457 section 3.2).
          # inspection_rejected is declared per operation (issue #33)
          enum:
            - validation
            - not_found
            - conflict
            - forbidden
            - not_registered
            - rate_limited
            - replaced
            - session_lapsed
            - session_closed
            - unavailable
            - internal
            - unauthenticated
            - inspection_rejected
            - payload_too_large
        retryable:
          type: boolean
          description: agentmesh extension member (RFC 9457 section 3.2).
    Wake:
      type: object
      required: [seq, count, channels]
      properties:
        seq:
          type: integer
          format: int64
        count:
          type: integer
        channels:
          type: array
          items:
            type: string
    Peek:
      type: object
      required: [count, channels]
      properties:
        count:
          type: integer
        channels:
          type: array
          items:
            type: object
            required: [channel, count]
            properties:
              channel:
                type: string
              count:
                type: integer
    WellKnown:
      type: object
      required: [discover]
      properties:
        discover:
          type: string
    AuthMethod:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        scheme:
          type: string
        bearer_format:
          type: string
    Discovery:
      type: object
      required: [api_versions, server_version, protocol_version, capabilities, auth_methods, issuers]
      properties:
        api_versions:
          type: array
          items:
            type: string
        server_version:
          type: string
        protocol_version:
          type: string
          description: >-
            The protocol version (this document's info.version): the major is
            the /v1 path, the minor is bumped on every addition, the patch on
            a documentation-only change. Independent of server_version.
        capabilities:
          type: array
          items:
            type: string
        auth_methods:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethod"
        authorization_server:
          type: string
          description: URL of the RFC 8414 authorization server metadata.
        openid_configuration:
          type: string
          description: >-
            URL of the same document under /.well-known/openid-configuration,
            kept for existing clients.
        issuers:
          type: array
          items:
            type: string
    AuthorizationServerMetadata:
      type: object
      required:
        - issuer
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
      properties:
        issuer:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
    OfferedCursor:
      type: object
      additionalProperties: false
      required: [channel, seq]
      properties:
        channel:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
    OpenSessionRequest:
      type: object
      additionalProperties: false
      properties:
        hint:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        resume_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Exactly 43 code points of base64url.
        cursors:
          type: array
          items:
            $ref: "#/components/schemas/OfferedCursor"
          maxItems: 256
          description: At most 256 items.
    RejectedCursor:
      type: object
      required: [channel, reason]
      properties:
        channel:
          type: string
        reason:
          type: string
          enum: [before_retention, ahead, unreadable, unsubscribed]
    PendingChannel:
      type: object
      required: [channel, pending]
      properties:
        channel:
          type: string
        pending:
          type: integer
          format: int64
    Session:
      type: object
      required: [id, identity, display_name, resume_token, resumed, rejected_cursors, pending]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        resume_token:
          type: string
        resumed:
          type: boolean
        rejected_cursors:
          type: array
          items:
            $ref: "#/components/schemas/RejectedCursor"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingChannel"
    ReceiveRequest:
      type: object
      additionalProperties: false
      properties:
        ack:
          type: string
          maxLength: 1024
          description: At most 1024 bytes.
        count:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          x-go-type: int
          description: >-
            At most 10000, the largest value of receive_max_count; above the configured receive_max_count the server returns at most that many.
        channels:
          type: array
          items:
            type: string
            maxLength: 128
            description: At most 128 bytes (the server counts bytes).
          maxItems: 256
          description: At most 256 items.
        include_own:
          type: boolean
    Gap:
      type: object
      required: [channel, from, to]
      properties:
        channel:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
    Message:
      type: object
      required: [seq, channel, sender, sender_kind, display, created_at, type, subject, content]
      properties:
        seq:
          type: integer
          format: int64
        channel:
          type: string
        sender:
          type: string
        sender_kind:
          type: string
          enum: [agent, human]
        session:
          type: string
        display:
          type: string
        created_at:
          type: integer
          format: int64
        type:
          type: string
        subject:
          type: string
        content:
          type: string
        reply_to:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        memory_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        matched_tags:
          type: array
          items:
            type: string
    ReceiveResult:
      type: object
      required: [messages, batch, redelivered, ack_ignored, gaps]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        batch:
          type: string
        redelivered:
          type: boolean
        ack_ignored:
          type: boolean
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
        notice:
          type: string
        instruction:
          type: string
    SessionInfo:
      type: object
      required: [id, identity, display_name, opened_at]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        opened_at:
          type: integer
          format: int64
    Identity:
      type: object
      required: [name, kind, admin, sessions]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [agent, human]
        admin:
          type: boolean
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
        status:
          $ref: "#/components/schemas/AgentStatus"
    SetAgentStatusRequest:
      type: object
      additionalProperties: false
      required: [tag, text]
      properties:
        tag:
          type: string
          description: >-
            One of idle, planning, implementing, reviewing, waiting, blocked, needs-human. offline is set by the server. At most 256 code points.
          maxLength: 256
        text:
          type: string
          maxLength: 200
          description: At most 200 code points.
        problem:
          type: string
          maxLength: 200
          description: At most 200 code points.
    AgentStatus:
      type: object
      required: [identity, revision, tag, text, session, display_name, set_at]
      properties:
        identity:
          type: string
        revision:
          type: integer
          format: int64
        tag:
          type: string
        last_tag:
          type: string
          description: >-
            listAgentStatuses only: the stored tag; tag reads offline when
            live is false.
        text:
          type: string
        problem:
          type: string
          description: Absent when empty.
        session:
          type: string
        display_name:
          type: string
        set_at:
          type: integer
          format: int64
          description: Unix milliseconds.
    AgentStatusEntry:
      type: object
      required: [identity, kind, live, status]
      properties:
        identity:
          type: string
        kind:
          type: string
          enum: [agent, human]
        live:
          type: boolean
        status:
          $ref: "#/components/schemas/AgentStatus"
    Channel:
      type: object
      required: [name, kind, capabilities]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
    ChannelInfo:
      type: object
      required: [name, kind, creator, created_at, capabilities]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        capabilities:
          type: array
          items:
            type: string
          description: "Traits of the channel; a value present means the trait applies. Known: bridged (a live Slack bridge). Clients ignore values they do not know."
        creator:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          format: int64
    ACLEntry:
      type: object
      additionalProperties: false
      required: [identity, permissions]
      properties:
        identity:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        permissions:
          type: array
          items:
            type: string
            enum: [read, write, admin]
          maxItems: 3
          minItems: 1
          description: At least 1 and at most 3 items.
    CreateChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        acl:
          type: array
          items:
            $ref: "#/components/schemas/ACLEntry"
          maxItems: 256
          description: At most 256 items.
        scope:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    RenameChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: At most 128 bytes (the server counts bytes).
    SubscribeRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          enum: [now, oldest]
    TagPatterns:
      type: object
      additionalProperties: false
      required: [patterns]
      properties:
        patterns:
          type: array
          items:
            type: string
            maxLength: 33
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$|^[A-Za-z0-9-]+(:[A-Za-z0-9-]*)?\*$
            description: >-
              At most 33 code points: a tag, or a prefix of at most 32 characters followed by an asterisk.
          maxItems: 10
          description: At most 10 items.
    SendRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        subject:
          type: string
          maxLength: 200
          description: At most 200 code points.
        content:
          type: string
          maxLength: 1048576
          description: >-
            At most 1048576 bytes (1 MiB, the largest max_message_kib); the server refuses content above its max_message_kib setting (default 64 KiB, at most 1024 KiB).
        type:
          type: string
          maxLength: 256
          description: At most 256 code points.
        reply_to:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 1024
            description: At most 1024 code points.
          maxProperties: 32
          description: >-
            At most 32 keys; a key is at most 64 code points (the server enforces this, the validator cannot) and a value at most 1024 code points.
        tags:
          type: array
          items:
            type: string
            maxLength: 32
            pattern: ^[A-Za-z0-9-]+(:[A-Za-z0-9-]+)?$
            description: >-
              At most 32 code points of letters, digits and hyphen with one optional colon; the server lowercases tags.
          maxItems: 10
          description: At most 10 items.
        session:
