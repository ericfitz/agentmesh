          description: At most 1024 code points.
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [text, semantic, both]
        - name: channel
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        - name: sender
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: At most 128 bytes (the server counts bytes).
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        - name: until
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
