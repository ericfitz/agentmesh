# Two agentmesh replicas over one Postgres. Copy example.env to .env first (docker compose reads deploy/.env).
#
# The server needs a CA before it starts (ADR 0019): a root, kept offline in a real deployment, and the
# installation's intermediate certificate in the database. deploy/ca/ (git-ignored, never committed) holds
# root.pem and intermediate.key, which both replicas mount at /ca. The root's own directory (root.key) is
# never mounted into a container: in a real deployment it stays offline; this example puts it in
# deploy/ca-root/, outside the mounted deploy/ca/ (both are git-ignored). Once, from the repository root, with the image built (make docker-image) and
# the stack's database running (docker compose -f deploy/docker-compose.yml up -d postgres):
#
#   export AGENTMESH_UID=$(id -u) AGENTMESH_GID=$(id -g)   # the containers run as you, so they own the key file
#   mkdir -p deploy/ca deploy/ca-root && umask 077
#   RUN="docker compose -f deploy/docker-compose.yml run --rm --no-deps --entrypoint /agentmesh agentmesh-a"
#   agentmesh ca init -dir deploy/ca-root         # the root tool; then: cp deploy/ca-root/root.pem deploy/ca/root.pem
#   $RUN server admin ca csr -out /ca/intermediate.csr   # makes /ca/intermediate.key on first use
#   agentmesh ca sign -dir deploy/ca-root deploy/ca/intermediate.csr > deploy/ca/intermediate.pem
#   $RUN server admin ca install /ca/intermediate.pem    # stores the certificate in Postgres
#
# (`agentmesh` is the binary on the host: `make build`.) Keep the same AGENTMESH_UID and AGENTMESH_GID when you
# start the stack (`docker compose up`), or the replicas cannot read the key file.
services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:0926ac7262a2c1963179eb939cd5d610e1be3ecca90b4b5cad8db8df16fab87e # Postgres 18; its LANG is en_US.UTF-8, so the initdb locale is UTF-8, which the server's Open requires
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  agentmesh-a: &agentmesh
    image: agentmesh:local
    build:
      context: ..
    environment:
      AGENTMESH_SERVER_LISTEN: 0.0.0.0:8420
      AGENTMESH_SERVER_POSTGRES: postgres://agentmesh:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/agentmesh?sslmode=disable
      AGENTMESH_SERVER_ISSUER: ${AGENTMESH_ISSUER:-http://localhost:8420}
      AGENTMESH_SERVER_ROOT_CERTIFICATE_FILE: /ca/root.pem
      AGENTMESH_SERVER_INTERMEDIATE_KEY_FILE: /ca/intermediate.key
      AGENTMESH_SERVER_INSTALLATION_NAME: ${AGENTMESH_INSTALLATION_NAME:-agentmesh-compose}
    user: "${AGENTMESH_UID:-65532}:${AGENTMESH_GID:-65532}"
    volumes:
      - ./ca:/ca
    command: ["-registration", "enrollment"]
    ports:
      - "127.0.0.1:8420:8420"
    depends_on:
      postgres:
        condition: service_healthy

  # Both replicas read the intermediate certificate and the CRLs from the database and each makes its own leaf
  # certificate in memory; they share only the CA files of ./ca (root.pem and intermediate.key, mounted at /ca).
  agentmesh-b:
    <<: *agentmesh
    ports:
      - "127.0.0.1:8421:8420"

volumes:
  pgdata:
